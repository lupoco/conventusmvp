<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Conventity Core</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<script src="/assets/js/cv-config.js"></script>
<script>
/* erken hata yakalayıcı — ana script parse edilemezse bile çalışır */
window.addEventListener('error', function(e){
  var b=document.getElementById('__err');
  if(!b){ b=document.createElement('div'); b.id='__err';
    b.style.cssText='position:fixed;left:0;right:0;top:0;z-index:999;background:#b23b3b;color:#fff;'+
      'font:600 12px/1.5 monospace;padding:10px 14px;white-space:pre-wrap;max-height:45vh;overflow:auto';
    (document.body||document.documentElement).appendChild(b);
  }
  b.textContent += 'HATA: '+(e.message||'?')+'\n@ '+(e.filename||'')+':'+(e.lineno||'?')+'\n\n';
});
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/cv-core.js"></script>
<style>
:root{
  --cream:#F5F2EC; --paper:#FBFAF7; --paper2:#F1EDE4;
  --navy:#0E2148; --blue:#004990; --blue2:#06488A; --gold:#E2B65E;
  --logo-outer:#0E2148; --logo-inner:#2A6FDB;
  --ink:#0E2148; --ink2:#40495e; --ink3:#6b7488;
  --line:#e4ddd979; --line2:#ded6cc; --danger:#b23b3b; --ok:#1f7a4d; --warn:#b8791f;
  --shadow:0 1px 2px rgba(14,33,72,.04),0 6px 20px rgba(14,33,72,.05);
  --radius:11px; --radius-sm:9px;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --body:'Manrope',system-ui,sans-serif;
  --serif:'Instrument Serif',Georgia,serif;
}
html.dark{
  --cream:#0b1428; --paper:#101c36; --paper2:#0e1a32;
  --ink:#eef1f7; --ink2:#aab4c8; --ink3:#7f8aa2;
  --logo-outer:#E8ECF5; --logo-inner:#5BC0FF;
  --line:#24345690; --line2:#2a3a5e; --gold:#E2B65E;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--cream);color:var(--ink);font-family:var(--body);font-size:14.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--blue2);text-decoration:none}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
::selection{background:var(--gold);color:var(--navy)}
h1,h2,h3{margin:0;font-weight:700}
em{font-style:italic;font-family:var(--serif);font-weight:400}
.mono{font-family:var(--mono)}
.hidden{display:none!important}

/* ---------- topbar ---------- */
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:14px;
  padding:13px 26px;background:color-mix(in srgb,var(--paper) 90%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line2)}
.brandwrap{display:flex;align-items:center;gap:10px}
.ver{font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.5px;color:var(--gold);border:1px solid var(--gold);border-radius:20px;padding:1px 7px;align-self:center;white-space:nowrap}
.brand-mark{width:38px;height:38px;flex:0 0 auto}
.brand{display:flex;flex-direction:column;line-height:1.02}
.brand-name{font-weight:700;letter-spacing:.22em;font-size:20px;line-height:1;
  background:linear-gradient(110deg,#7FA8E8 0%,#9BBCEC 34%,#A9C7E0 60%,#C9B3E6 100%);
  background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:hlShine 8s linear infinite}
.brand-sub{font-size:9px;letter-spacing:.32em;color:var(--ink3);margin-top:2px;text-transform:uppercase}
@keyframes hlShine{to{background-position:200% center}}
@media (prefers-reduced-motion:reduce){.brand-name{animation:none}}
.spacer{flex:1}
.tbtn{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 13px;border-radius:9px;
  border:1px solid var(--line2);background:var(--paper);color:var(--ink2);font-size:12.5px;font-weight:600}
.tbtn:hover{border-color:var(--gold);color:var(--ink)}
.tbtn.icon{padding:0;width:34px;justify-content:center}
.langpill{display:inline-flex;border:1px solid var(--line2);border-radius:9px;overflow:hidden;height:34px}
.langpill button{border:0;background:var(--paper);color:var(--ink3);font-size:11.5px;font-weight:700;padding:0 11px;letter-spacing:.5px}
.langpill button.on{background:var(--blue);color:#fff}

/* ---------- auth ---------- */
.authwrap{min-height:78vh;display:flex;align-items:center;justify-content:center;padding:30px}
.authcard{width:100%;max-width:390px;background:var(--paper);border:1px solid var(--line2);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:30px 28px}
.authcard h2{font-family:var(--serif);font-weight:400;font-size:28px;margin-bottom:4px}
.authcard p.sub{color:var(--ink3);font-size:13px;margin:0 0 20px}
.field{margin-bottom:14px}
.field label{display:block;font-size:11.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--ink3);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;height:40px;padding:0 12px;border:1px solid var(--line2);
  border-radius:var(--radius-sm);background:var(--paper2);color:var(--ink);font-family:inherit;font-size:14px}
.field textarea{height:auto;min-height:84px;padding:10px 12px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--blue);background:var(--paper)}
.grid2>div>label{display:block;font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--ink3);margin-bottom:6px}
.grid2 input:not([type=checkbox]),.grid2 select,.grid2 textarea{width:100%;height:40px;padding:0 12px;border:1px solid var(--line2);border-radius:var(--radius-sm);background:var(--paper2);color:var(--ink);font-family:inherit;font-size:14px}
.grid2 textarea{height:auto;min-height:80px;padding:10px 12px;resize:vertical}
.grid2 input:focus,.grid2 select:focus,.grid2 textarea:focus{outline:none;border-color:var(--blue);background:var(--paper)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 18px;border-radius:var(--radius-sm);
  border:1px solid transparent;font-weight:700;font-size:14px;background:var(--paper2);color:var(--ink)}
.btn.wide{width:100%}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:hover{background:var(--navy)}
.btn-ghost{background:transparent;border-color:var(--line2);color:var(--ink2)}
.btn-ghost:hover{border-color:var(--gold);color:var(--ink)}
.btn-danger{background:transparent;border-color:var(--danger);color:var(--danger)}
.btn-danger:hover{background:var(--danger);color:#fff}
.btn-sm{height:32px;padding:0 12px;font-size:12.5px;border-radius:8px}
.formerr{color:var(--danger);font-size:12.5px;min-height:16px;margin:2px 0 10px}

/* ---------- shell ---------- */
.shell{max-width:1260px;margin:0 auto;padding:20px 22px 60px;display:flex;gap:22px;align-items:flex-start}
.tabbar{display:flex;gap:2px;flex-wrap:wrap;border-bottom:1px solid var(--line2);margin-bottom:0;padding-bottom:0;position:relative}
.tab{border:0;background:transparent;color:var(--ink3);font-size:12.5px;font-weight:600;letter-spacing:.2px;padding:12px 15px;
  border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);border-bottom-color:var(--navy)}
.tab.new::after{content:'YENİ';font-size:8px;font-weight:800;color:var(--gold);vertical-align:super;margin-left:4px;letter-spacing:.5px}
html[lang=en] .tab.new::after{content:'NEW'}

/* ---------- side navigation (grouped, collapsible) ---------- */
.sidenav{position:sticky;top:62px;flex:0 0 252px;width:252px;align-self:flex-start;
  background:var(--paper);border:1px solid var(--line2);border-radius:var(--radius);box-shadow:var(--shadow);
  max-height:calc(100vh - 80px);display:flex;flex-direction:column;overflow:hidden;
  transition:flex-basis .24s cubic-bezier(.4,0,.2,1),width .24s cubic-bezier(.4,0,.2,1)}
.navwrap{flex:1;overflow-y:auto;overflow-x:hidden;padding:9px 10px}
.navwrap::-webkit-scrollbar{width:6px}
.navwrap::-webkit-scrollbar-thumb{background:var(--line2);border-radius:6px}
.navgrp{margin-top:8px}
.navgrp:first-child{margin-top:2px}
.navgh{font-family:var(--serif);font-weight:400;font-size:15px;color:var(--ink);letter-spacing:.2px;
  padding:11px 10px 5px;margin:0 2px 5px;border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden}
.sidenav .tab{display:flex;align-items:center;gap:11px;width:100%;text-align:left;position:relative;
  padding:8px 11px;margin:1px 0;border:0;border-radius:9px;background:transparent;color:var(--ink2);
  font-size:13.5px;font-weight:600;letter-spacing:.1px;white-space:nowrap}
.sidenav .tab .ic{flex:0 0 20px;display:grid;place-items:center;font-size:14px;color:var(--ink3)}
.sidenav .tab .lb{overflow:hidden;text-overflow:ellipsis}
.sidenav .tab:hover{background:var(--paper2);color:var(--ink)}
.sidenav .tab:hover .ic{color:var(--ink2)}
.sidenav .tab.on{background:color-mix(in srgb,var(--blue) 11%,transparent);color:var(--blue2)}
.sidenav .tab.on .ic{color:var(--blue2)}
.sidenav .tab.on::before{content:'';position:absolute;left:0;top:7px;bottom:7px;width:3px;border-radius:0 3px 3px 0;background:var(--blue)}
.sidenav .tab.new::after{content:'YENİ';margin-left:auto;font-size:8px;font-weight:800;letter-spacing:.5px;color:var(--gold)}
html[lang=en] .sidenav .tab.new::after{content:'NEW'}
.sidenav .tab .cnt{margin-left:auto;font-family:var(--mono);font-size:10.5px;font-weight:600;
  color:var(--ink3);background:var(--paper2);border:1px solid var(--line2);border-radius:20px;
  padding:0 7px;min-width:22px;height:18px;display:inline-flex;align-items:center;justify-content:center;
  font-variant-numeric:tabular-nums}
.sidenav .tab .cnt:empty{display:none}
.sidenav .tab.on .cnt{border-color:color-mix(in srgb,var(--blue) 40%,var(--line2));color:var(--blue2)}
.sidenav.mini .tab .cnt{display:none}
html.dark .sidenav .tab.on{background:color-mix(in srgb,var(--blue) 34%,transparent);color:#9cc0ee}
html.dark .sidenav .tab.on .ic{color:#9cc0ee}
.navfoot{border-top:1px solid var(--line2);padding:8px}
.navcollapse{display:flex;align-items:center;gap:11px;width:100%;border:0;border-radius:8px;background:transparent;
  color:var(--ink3);font-size:12px;font-weight:700;letter-spacing:.3px;padding:8px 11px}
.navcollapse:hover{background:var(--paper2);color:var(--ink)}
.navcollapse .ic{flex:0 0 20px;display:grid;place-items:center;font-size:15px}
.sidenav.mini{flex-basis:60px;width:60px}
.sidenav.mini .navgh{opacity:0;height:0;padding:0;margin:0;border:0}
.sidenav.mini .navgrp{margin-top:6px;border-top:1px solid var(--line);padding-top:6px}
.sidenav.mini .navgrp:first-child{border-top:0;padding-top:0;margin-top:2px}
.sidenav.mini .tab{justify-content:center;padding:9px 0}
.sidenav.mini .tab .lb{display:none}
.sidenav.mini .tab.new::after{display:none}
.sidenav.mini .navcollapse{justify-content:center;padding:9px 0}
.sidenav.mini .navcollapse .lb{display:none}
#navToggle{display:none}
.nav-bg{position:fixed;inset:0;background:rgba(14,33,72,.34);z-index:55;opacity:0;pointer-events:none;transition:opacity .2s}
.nav-bg.on{opacity:1;pointer-events:auto}

.phead{margin:26px 0 0}
.eyebrow{font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:2.5px;text-transform:uppercase;color:var(--gold)}
.ptitle{font-family:var(--serif);font-weight:400;font-size:34px;line-height:1.08;color:var(--ink);margin:8px 0 9px;letter-spacing:.2px}
.pdesc{font-size:15px;color:var(--ink2);max-width:920px;margin:0 0 20px;line-height:1.55}
.pdesc b{color:var(--ink);font-weight:700}
.pbar{display:flex;align-items:center;gap:12px;margin-bottom:16px;border-top:1px solid var(--line2);padding-top:14px}
.pcount{font-family:var(--mono);font-size:12.5px;letter-spacing:.3px;color:var(--ink3)}

.panel{flex:1;min-width:0;min-height:120px}
.panelhead{display:flex;align-items:center;gap:12px;margin:2px 0 14px;flex-wrap:wrap}
.panelhead h3{font-family:var(--serif);font-weight:400;font-size:22px}
.panelhead .count{font-size:12px;font-weight:700;color:var(--ink3);background:var(--paper2);border:1px solid var(--line2);
  border-radius:20px;padding:2px 10px}
.searchbox{position:relative}
.searchbox input{height:34px;width:210px;padding:0 12px 0 30px;border:1px solid var(--line2);border-radius:9px;
  background:var(--paper);color:var(--ink);font-size:13px}
.searchbox svg{position:absolute;left:9px;top:9px;color:var(--ink3)}

/* ---------- overview cards ---------- */
.ovgroup{margin:20px 0 0}
.ovgroup .gh{font-family:var(--mono);font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:var(--gold);margin:0 0 10px}
.ovgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.ovcard{background:var(--paper);border:1px solid var(--line2);border-left:2px solid var(--accent,var(--navy));border-radius:9px;padding:15px 16px}
.ovcard .n{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:29px;font-weight:600;line-height:1;color:var(--ink)}
.ovcard .n.small{font-size:22px;color:var(--ink3)}
.ovcard .l{font-size:10.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--ink3);margin-top:8px}

/* ---------- table ---------- */
.tablewrap{border:1px solid var(--line2);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);background:var(--paper)}
table.grid{width:100%;border-collapse:collapse;font-size:13px}
table.grid th{text-align:left;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--ink3);
  font-weight:700;padding:11px 16px;background:transparent;border-bottom:1.5px solid var(--line2)}
table.grid td{padding:12px 16px;border-bottom:1px solid var(--line);color:var(--ink2);vertical-align:top}
table.grid tr:last-child td{border-bottom:0}
table.grid tbody tr{cursor:pointer}
table.grid tbody tr:hover{background:var(--paper2)}
.chip{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.3px;padding:2px 8px;border-radius:20px;
  border:1px solid var(--line2);color:var(--ink2);background:var(--paper2)}
.chip.gold{border-color:var(--gold);color:var(--warn)}
.chip.blue{border-color:var(--blue);color:var(--blue2)}
.chip.green{border-color:#1f7a4d66;color:var(--ok)}
.prooflink{font-family:var(--mono);font-size:11.5px;font-weight:600;white-space:nowrap;color:var(--blue2)}
.prooflink:hover{text-decoration:underline}
.chip.grey{opacity:.7}
.empty{padding:34px;text-align:center;color:var(--ink3);font-size:13px}
.loading{padding:34px;text-align:center;color:var(--ink3);font-size:13px}

/* ---------- drawer ---------- */
.drawer-bg{position:fixed;inset:0;background:rgba(14,33,72,.28);backdrop-filter:blur(2px);z-index:50;opacity:0;
  transition:opacity .18s;pointer-events:none}
.drawer-bg.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,94vw);background:var(--paper);border-left:1px solid var(--line2);
  z-index:51;transform:translateX(100%);transition:transform .22s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(14,33,72,.12)}
.drawer.on{transform:translateX(0)}
.drawer header{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line2)}
.drawer header h3{font-family:var(--serif);font-weight:400;font-size:20px}
.drawer .body{padding:18px 20px;overflow:auto;flex:1}
.drawer footer{display:flex;gap:8px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid2 .full{grid-column:1/-1}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);z-index:80;opacity:0;
  transition:all .22s;background:var(--navy);color:#fff;padding:11px 18px;border-radius:10px;font-size:13px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.25)}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.err{background:var(--danger)}

.readonly-note{font-size:11px;color:var(--ink3);font-style:italic}
.mrow{display:flex;gap:14px;align-items:flex-start;background:var(--paper);border:1px solid var(--line2);
  border-left:3px solid var(--sc,var(--ink3));border-radius:10px;padding:14px 15px;margin-bottom:10px}
.mscore{flex:0 0 auto;text-align:center;min-width:52px}
.mscore .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:23px;font-weight:700;color:var(--ink);line-height:1}
.mscore .b{height:4px;background:var(--paper2);border-radius:4px;margin-top:6px;overflow:hidden}
.mscore .b>i{display:block;height:100%;background:var(--sc,var(--ink3))}
.mbody{flex:1;min-width:0}
.mbody .n{font-weight:700;font-size:14.5px;color:var(--ink);line-height:1.3}
.mbody .o{font-size:12.5px;color:var(--ink3);margin-top:2px}
.mwhy{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.mwhy span{font-size:10.5px;font-weight:600;letter-spacing:.2px;padding:2px 8px;border-radius:20px;
  border:1px solid var(--line2);color:var(--ink2);background:var(--paper2)}
.mwhy span.pos{border-color:#1f7a4d55;color:var(--ok)}
.mwhy span.neg{border-color:#b23b3b55;color:var(--danger)}
.macts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.mpick{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.mpick select{height:40px;min-width:260px;max-width:100%;border:1px solid var(--line2);border-radius:9px;
  background:var(--paper);color:var(--ink);font-family:inherit;font-size:14px;padding:0 10px}
.mdec{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:20px;margin-left:8px}
.mdec.shortlisted{border:1px solid var(--ok);color:var(--ok)}
.mdec.rejected{border:1px solid var(--line2);color:var(--ink3)}
.mdec.contacted{border:1px solid var(--blue);color:var(--blue2)}
.mdec.engaged{border:1px solid var(--gold);color:var(--warn)}
.lgroup{margin:22px 0 0}
.lgroup .lh{display:flex;align-items:baseline;gap:10px;margin:0 0 11px}
.lgroup .lh b{font-family:var(--serif);font-weight:400;font-size:21px;color:var(--ink)}
.lgroup .lh span{font-family:var(--mono);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink3)}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:11px}
.lcard{display:flex;flex-direction:column;gap:5px;background:var(--paper);border:1px solid var(--line2);border-left:3px solid var(--pc,var(--navy));
  border-radius:10px;padding:14px 15px;text-decoration:none;color:inherit;transition:transform .12s,box-shadow .12s}
.lcard:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(14,33,72,.09)}
.lcard .t{font-weight:700;font-size:14px;color:var(--ink);display:flex;align-items:center;gap:7px}
.lcard .t .ext{font-size:11px;color:var(--ink3);font-weight:600}
.lcard .d{font-size:12.5px;color:var(--ink3);line-height:1.45}
.lcard.dead{opacity:.55;border-left-color:var(--danger)}
.lcard.soon{opacity:.6;cursor:default;pointer-events:none}
.lcard .lsoon{font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  padding:2px 7px;border:1px solid var(--line2);border-radius:100px;color:var(--ink3)}
.lstat{font-family:var(--mono);font-size:9.5px;font-weight:700;color:var(--danger);border:1px solid var(--danger);border-radius:20px;padding:0 6px;margin-left:6px}
.imp-drop{border:1.5px dashed var(--line2);border-radius:11px;padding:18px;background:var(--paper);margin-bottom:14px}
.imp-drop textarea{width:100%;min-height:120px;border:1px solid var(--line2);border-radius:9px;background:var(--paper2);color:var(--ink);font-family:var(--mono);font-size:12px;padding:10px;resize:vertical}
.imp-map{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin:14px 0}
.imp-map .m{display:flex;flex-direction:column;gap:4px}
.imp-map label{font-size:10.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--ink3)}
.imp-map select{height:34px;border:1px solid var(--line2);border-radius:8px;background:var(--paper2);color:var(--ink);font-size:12.5px;padding:0 8px}
.imp-map .miss select{border-color:var(--danger)}
.imp-sum{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.imp-stat{background:var(--paper);border:1px solid var(--line2);border-radius:9px;padding:10px 14px;min-width:112px}
.imp-stat .n{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:22px;font-weight:600;color:var(--ink)}
.imp-stat .l{font-size:10px;letter-spacing:.6px;text-transform:uppercase;color:var(--ink3);margin-top:3px}
.imp-prog{height:6px;background:var(--paper2);border-radius:6px;overflow:hidden;margin:12px 0}
.imp-prog>i{display:block;height:100%;background:var(--blue);width:0;transition:width .2s}
.orion-adv{background:var(--paper2);border:1px solid var(--line2);border-left:3px solid #8B47CE;border-radius:9px;padding:12px 14px;margin-top:2px}
.orion-adv .oh{font-family:var(--mono);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:#8B47CE;font-weight:700;margin-bottom:9px}
.orion-adv .kv{grid-template-columns:130px 1fr}
.kv{display:grid;grid-template-columns:120px 1fr;gap:4px 12px;font-size:13px}
.kv dt{color:var(--ink3);font-weight:600}
.kv dd{margin:0;color:var(--ink2)}

@keyframes ecoBloom{from{opacity:0;transform:scale(.62)}to{opacity:1;transform:none}}
@keyframes ecoPop{0%{opacity:0;transform:scale(.1)}62%{transform:scale(1.14)}100%{opacity:1;transform:scale(1)}}
@keyframes ecoFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-3.2px)}}
@keyframes ecoFade{from{opacity:0}to{opacity:.95}}
@keyframes ecoRingPulse{0%,100%{stroke-opacity:.28}50%{stroke-opacity:.85}}
#ecoSvg .eco-seg{transform-box:fill-box;transform-origin:center;animation:ecoBloom .6s cubic-bezier(.2,.75,.2,1) both;transition:filter .15s,stroke-width .15s}
#ecoSvg .eco-seg:hover{filter:brightness(1.13) saturate(1.06);stroke-width:4.5}
#ecoSvg .eco-node{transform-box:fill-box;transform-origin:center;animation:ecoPop .6s cubic-bezier(.25,1.4,.4,1) both}
#ecoSvg .eco-float{animation:ecoFloat 4.4s ease-in-out infinite}
#ecoSvg .eco-nodec{transition:filter .15s}
#ecoSvg .eco-node:hover .eco-nodec{filter:brightness(1.16)}
#ecoSvg .eco-org{animation:ecoFade .5s ease both}
#ecoSvg .eco-ring{animation:ecoRingPulse 3.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){
  #ecoSvg .eco-seg,#ecoSvg .eco-node,#ecoSvg .eco-org{animation-duration:.001s}
  #ecoSvg .eco-float,#ecoSvg .eco-ring{animation:none}
  #ecoSvg .eco-flow,#ecoSvg .eco-sweep{display:none}
}

"use strict";

/* ---- config ---- */
var SB_URL = window.__CV_SUPABASE_URL;
function sb(){
  if(window.__cvSb) return window.__cvSb;
  window.__cvSb = window.supabase.createClient(SB_URL, window.__CV_ANON_KEY, {auth:{persistSession:true}});
  return window.__cvSb;
}
/* admin-users Edge Function çağrısı — çağıranın oturum token'ıyla; sunucu
   tarafında conventity_is_admin('ecosystem') doğrular. */
var ADMIN_FN_URL = SB_URL + '/functions/v1/admin-users';
async function cvAdminUser(action,email){
  var s=await sb().auth.getSession();
  var tok=s&&s.data&&s.data.session&&s.data.session.access_token;
  if(!tok) throw new Error('no session');
  var res=await fetch(ADMIN_FN_URL,{method:'POST',
    headers:{'Authorization':'Bearer '+tok,'Content-Type':'application/json','apikey':window.__CV_ANON_KEY},
    body:JSON.stringify({action:action,email:email})});
  var out={}; try{out=await res.json();}catch(e){}
  if(res.status===404) throw new Error(T('us_fn_missing'));
  if(!res.ok) throw new Error((out&&out.error)||('HTTP '+res.status));
  return out;
}

function renderTabbar(){
  var bar=$('#tabbar'); bar.innerHTML='';
  NAVGROUPS.forEach(function(g){
    var grp=document.createElement('div'); grp.className='navgrp';
    var h=document.createElement('div'); h.className='navgh'; h.textContent=T(g.h); grp.appendChild(h);
    g.keys.forEach(function(k){
      var t=TABMAP[k]; if(!t) return;
      var b=document.createElement('button');
      b.className='tab'+((t.neu&&!t.tbl)?' new':'')+(t.k===CURRENT?' on':'');
      b.setAttribute('data-k',t.k);
      b.title=T('tab_'+t.k);
      var ic=document.createElement('span'); ic.className='ic'; ic.textContent=t.ic||'•';
      var lb=document.createElement('span'); lb.className='lb'; lb.textContent=T('tab_'+t.k);
      b.appendChild(ic); b.appendChild(lb);
      if(t.tbl){ var cn=document.createElement('span'); cn.className='cnt'; cn.setAttribute('data-cnt',t.k); b.appendChild(cn); }
      b.addEventListener('click',function(){openTab(t.k);closeNavMobile();});
      grp.appendChild(b);
    });
    bar.appendChild(grp);
  });
  syncNavCollapse();
  loadNavCounts();
}
function loadNavCounts(){
  if(!$('#sidenav')) return;
  try{
    TABS.forEach(function(t){
      if(!t.tbl) return;
      try{
        sb().from(t.tbl).select('*',{count:'exact',head:true}).then(function(r){
          var e=document.querySelector('.cnt[data-cnt="'+t.k+'"]');
          if(e && r && r.count!=null) e.textContent=r.count;
        },function(){});
      }catch(e){}
    });
  }catch(e){}
}
function syncNavCollapse(){
  var sn=$('#sidenav'); if(!sn) return;
  var mini=sn.classList.contains('mini');
  var lb=$('#navCollapseLb'), ic=$('#navCollapseIc');
  if(lb) lb.textContent=T(mini?'nav_expand':'nav_collapse');
  if(ic) ic.textContent=mini?'»':'«';
}
function closeNavMobile(){
  var sn=$('#sidenav'); if(sn) sn.classList.remove('open');
  var bg=$('#navBg'); if(bg) bg.classList.remove('on');
}
function initNav(){
  var sn=$('#sidenav'); if(!sn) return;
  if(lsGet('cn-nav')==='mini') sn.classList.add('mini');
  syncNavCollapse();
}
function openTab(k,keep){
  CURRENT=k;
  $$('#tabbar .tab').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-k')===k);});
  var p=$('#panel');
  if(!keep) p.innerHTML='<div class="loading">'+esc(T('c_loading'))+'</div>';
  var fn=PANELS[k];
  if(typeof fn==='function'){ Promise.resolve(fn(p)).catch(function(e){ p.innerHTML='<div class="empty">'+esc(T('c_error'))+'</div>'; console.error(e); }); }
  else { p.innerHTML=panelStub(k); }
}
function panelHeader(k,opts){
  opts=opts||{};
  var countHtml = opts.countId ? '<div class="pcount" id="'+opts.countId+'"></div>' : '<div></div>';
  return '<div class="phead"><div class="eyebrow">'+esc(T('eb_'+k))+'</div>'+
    '<h2 class="ptitle">'+T('tab_'+k)+'</h2>'+
    '<p class="pdesc">'+T('info_'+k)+'</p>'+
    '<div class="pbar">'+countHtml+'<div style="flex:1"></div>'+(opts.actions||'')+'</div></div>';
}
function setCount(id,n,k){var e=$('#'+id);if(e)e.textContent=n+' '+T('ent_'+k).toLocaleLowerCase(LANG==='tr'?'tr-TR':'en-US');}
function panelStub(k){
  return panelHeader(k,{})+'<div class="empty">'+esc(T('c_soon'))+'</div>';
}

  ];
  function norm(s){return (s||'').toLowerCase().replace(/[^a-z0-9]/g,'');}
  function parseCSV(text){var rows=[],row=[],cur='',inq=false,i,c;text=text.replace(/\r\n/g,'\n').replace(/\r/g,'\n');

    $$('#impMapWrap select').forEach(function(s){s.addEventListener('change',function(){mapping[s.getAttribute('data-k')]=parseInt(s.value,10);renderPreview();});});}
  function pick(r){var m={};TARGETS.forEach(function(t){var idx=mapping[t.k];m[t.k]=(idx!=null&&idx>=0&&idx<r.length)?(r[idx]||'').trim():'';});return m;}
  async function renderPreview(){
    var mapped=dataRows.map(pick);var valid=mapped.filter(function(m){return m.cid&&m.org;});
    var orgset={};valid.forEach(function(m){orgset[(m.org||'').toLowerCase()]=1;});
    var existing=0;var refs=valid.map(function(m){return 'orion_sol:'+m.cid;});
    if(refs.length){var ex=await sb().from('conventity_solutions').select('source_ref').in('source_ref',refs.slice(0,1000));var set={};(ex.data||[]).forEach(function(x){set[x.source_ref]=1;});existing=valid.filter(function(m){return set['orion_sol:'+m.cid];}).length;}
    var neu=valid.length-existing;
    $('#impPrev').innerHTML='<div class="imp-sum">'+stat(valid.length,'imp_rows')+stat(Object.keys(orgset).length,'imp_orgs')+stat(neu,'imp_new')+stat(existing,'imp_exist')+'</div>'+
      sampleTable(valid.slice(0,5))+
      '<div style="display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap"><button class="btn btn-primary" id="impRun"'+(valid.length?'':' disabled')+'>'+esc(T('imp_run'))+'</button><span class="readonly-note">'+esc(T('imp_idem'))+'</span></div>'+
      '<div class="imp-prog hidden" id="impBar"><i></i></div><div id="impResult"></div>';
    var rb=$('#impRun');if(rb)rb.addEventListener('click',function(){runImport(valid);});}
  function sampleTable(list){if(!list.length)return '';return '<div class="tablewrap"><table class="grid"><thead><tr><th>'+esc(T('so_org'))+'</th><th>'+esc(T('so_name'))+'</th><th>TRL</th><th>'+esc(T('so_focus'))+'</th><th>Orion</th></tr></thead><tbody>'+list.map(function(m){return '<tr><td style="color:var(--ink)">'+esc(m.org)+'</td><td>'+esc(m.cap||T('c_none'))+'</td><td class="mono">'+esc(trlNum(m.trl)||'—')+'</td><td>'+esc(m.focus||T('c_none'))+'</td><td class="mono" style="font-size:11px">'+esc((m.o_code||'')+(m.o_conf?(' · '+m.o_conf):''))+'</td></tr>';}).join('')+'</tbody></table></div>';}
  async function runImport(valid){
    var bar=$('#impBar');bar.classList.remove('hidden');var fill=bar.querySelector('i');$('#impRun').disabled=true;
    var nameMap={};var oe=await sb().from('conventity_orgs').select('id,legal_name').limit(10000);(oe.data||[]).forEach(function(o){nameMap[(o.legal_name||'').trim().toLowerCase()]=o.id;});
    var actIds={};
    async function ensureAct(title,ref){var g=await sb().from('conventity_activities').select('id').eq('source_ref',ref).maybeSingle();if(g.data)return g.data.id;var r=await sb().from('conventity_activities').insert({title:title,activity_type:'challenge',source:'external',origin_ref:title,source_ref:ref}).select('id');return (r.data&&r.data[0])?r.data[0].id:null;}
    var c={orgs:0,sol:0,people:0,part:0,err:0}; var orionDropped=0, lastErr='';
    for(var i=0;i<valid.length;i++){var m=valid[i];
      try{
        var key=(m.org||'').trim().toLowerCase();var orgId=nameMap[key];
        if(!orgId){var oi=await sb().from('conventity_orgs').insert({legal_name:m.org,nation:m.country||null,source:'import',source_ref:'orion_org:'+slug(m.org)}).select('id');
          if(oi.error){var og=await sb().from('conventity_orgs').select('id').eq('source_ref','orion_org:'+slug(m.org)).maybeSingle();orgId=og.data?og.data.id:null;}
          else{orgId=(oi.data&&oi.data[0])?oi.data[0].id:null;if(orgId)c.orgs++;}
          if(orgId)nameMap[key]=orgId;}
        var orion={};if(m.o_code)orion.primary_code=m.o_code;if(m.o_name)orion.primary_name=m.o_name;if(m.o_conf&&!isNaN(parseInt(m.o_conf,10)))orion.confidence=parseInt(m.o_conf,10);if(m.o_signal)orion.signal=m.o_signal;if(m.o_verdict)orion.verdict=m.o_verdict;if(m.o_suit)orion.suitability=m.o_suit;if(m.o_rationale)orion.rationale=m.o_rationale;if(m.o_model)orion.fit_model_id=m.o_model;if(m.o_gen)orion.fit_generated_at=m.o_gen;if(m.o_state)orion.state=m.o_state;if(m.use_case)orion.use_case=m.use_case;if(m.evidence)orion.evidence=m.evidence;if(m.interop)orion.interoperability=m.interop;if(m.submitted)orion.submitted_at=m.submitted;
        var sol={org_id:orgId,name:m.cap||('Contribution '+m.cid),description:m.desc||m.use_case||null,trl:trlNum(m.trl),focus_area:m.focus||null,domain:m.isc_domain||null,isc_pilot_area:m.isc_pilot||null,source:'import',source_ref:'orion_sol:'+m.cid};
        if(Object.keys(orion).length)sol.orion=orion;
        var sr=await sb().from('conventity_solutions').upsert(sol,{onConflict:'source_ref'}).select('id');
        if(sr.error&&sol.orion){delete sol.orion;orionDropped++;sr=await sb().from('conventity_solutions').upsert(sol,{onConflict:'source_ref'}).select('id');}
        if(sr.error){lastErr=sr.error.message;}
        if(!sr.error&&sr.data&&sr.data.length)c.sol++;
        if(m.contact_name){var pr=await sb().from('conventity_people').upsert({full_name:m.contact_name,role_title:m.contact_role||null,home_org_id:orgId,is_poc:true,source:'import',source_ref:'orion_poc:'+m.cid},{onConflict:'source_ref'}).select('id');if(!pr.error&&pr.data&&pr.data.length)c.people++;}
        if(isYes(m.diana)){if(!actIds.diana)actIds.diana=await ensureAct('DIANA 2026','ext_activity:diana_2026');if(actIds.diana){var d1=await sb().from('conventity_participation').upsert({activity_id:actIds.diana,org_id:orgId,part_role:'participant',status:'confirmed',source_ref:'orion_part_diana:'+m.cid},{onConflict:'source_ref',ignoreDuplicates:true}).select('id');if(!d1.error&&d1.data&&d1.data.length)c.part++;}}
        if(isYes(m.nif)){if(!actIds.nif)actIds.nif=await ensureAct('NIF','ext_activity:nif');if(actIds.nif){var d2=await sb().from('conventity_participation').upsert({activity_id:actIds.nif,org_id:orgId,part_role:'participant',status:'confirmed',source_ref:'orion_part_nif:'+m.cid},{onConflict:'source_ref',ignoreDuplicates:true}).select('id');if(!d2.error&&d2.data&&d2.data.length)c.part++;}}
      }catch(e){c.err++;}
      fill.style.width=Math.round(((i+1)/valid.length)*100)+'%';}
    var warn='';
    if(orionDropped) warn+='<p style="color:var(--warn);font-size:12.5px;margin:6px 0 0">⚠ '+Tf('imp_orion_warn',orionDropped)+'</p>';
    if(lastErr) warn+='<p class="readonly-note" style="color:var(--danger)">'+esc(lastErr)+'</p>';
    $('#impResult').innerHTML='<div class="imp-sum" style="margin-top:14px">'+stat(c.orgs,'imp_r_orgs')+stat(c.sol,'imp_r_sol')+stat(c.people,'imp_r_ppl')+stat(c.part,'imp_r_part')+(c.err?stat(c.err,'imp_r_err'):'')+'</div>'+warn+'<p class="readonly-note">'+esc(T('imp_done'))+'</p>';
    toast(T('imp_done'));}
};      /* __PANEL_import__ */

/* ===================================================================
   EKOSİSTEM HARİTASI (ecomap) — üç halkalı çember
   merkez = 6 platform · orta halka = yetenek alanları · dış = org halkası
   Salt görsel. Yetenek sayıları conventity_solutions'tan best-effort
   anahtar-kelime eşlemesiyle; org halkası conventity_orgs'tan. Sessiz fallback.
   =================================================================== */
var ECO_PLAT=[
  {n:'Convexus',   c:'#5B5BD6', r:'ecopf_convexus'},
  {n:'Conventus',  c:'#06488A', r:'ecopf_conventus'},
  {n:'ConventLab', c:'#DC7B5B', r:'ecopf_conventlab'},
  {n:'Connectus',  c:'#1F9E50', r:'ecopf_connectus'},
  {n:'Consultus',  c:'#18B8C6', r:'ecopf_consultus'},
  {n:'Convergens', c:'#8B47CE', r:'ecopf_convergens'}
];
var ECO_DOM=[
  {k:'auto', c:'#06488A', kw:['cuas','c-uas','uas','uav','autonom','drone','counter','unmanned']},
  {k:'ai',   c:'#5B5BD6', kw:['ai ','machine','learning',' ml','data','analyt','artificial','yapay']},
  {k:'cyber',c:'#1F9E50', kw:['cyber','siber','network','interoper','5g',' comms','communicat']},
  {k:'space',c:'#8B47CE', kw:['space','uzay','satellite','satcom','orbit','geospatial']},
  {k:'iamd', c:'#B8791F', kw:['iamd','missile','füze','air defen','c2 ','command','radar','sensor','istar']},
  {k:'quant',c:'#12897E', kw:['quantum','kuantum','sensing','pnt','navigation']},
  {k:'hw',   c:'#DC7B5B', kw:['hardware','donanım','device','robot','material','energy','platform']},
  {k:'svc',  c:'#7A8296', kw:['cloud','software','consult','training','simulation','supply','service','logistic','enterprise']}
];
function ecoClassify(txt){
  txt=(' '+(txt||'')+' ').toLowerCase();
  for(var i=0;i<ECO_DOM.length;i++){var d=ECO_DOM[i];
    for(var j=0;j<d.kw.length;j++){ if(txt.indexOf(d.kw[j])>-1) return d.k; }}
  return 'svc';
}
function ecoPolar(cx,cy,r,deg){var a=(deg-90)*Math.PI/180;return {x:cx+r*Math.cos(a),y:cy+r*Math.sin(a)};}
function ecoF(n){return (Math.round(n*100)/100);}
function ecoSector(cx,cy,ri,ro,a0,a1){
  var large=(a1-a0)>180?1:0;
  var p0=ecoPolar(cx,cy,ro,a0),p1=ecoPolar(cx,cy,ro,a1),q1=ecoPolar(cx,cy,ri,a1),q0=ecoPolar(cx,cy,ri,a0);
  return 'M'+ecoF(p0.x)+' '+ecoF(p0.y)+' A'+ro+' '+ro+' 0 '+large+' 1 '+ecoF(p1.x)+' '+ecoF(p1.y)+
    ' L'+ecoF(q1.x)+' '+ecoF(q1.y)+' A'+ri+' '+ri+' 0 '+large+' 0 '+ecoF(q0.x)+' '+ecoF(q0.y)+' Z';
}
function ecoLines(label){var s=(''+label),i=s.indexOf(' & ');
  return i<0?[s]:[s.slice(0,i+2),s.slice(i+3)];}
function ecoReduced(){try{return window.matchMedia('(prefers-reduced-motion:reduce)').matches;}catch(e){return false;}}
function ecoCountUp(el,to,dur){
  if(!el)return; to=to||0;
  if(ecoReduced()||to<=0){el.textContent=to;return;}
  var t0=performance.now();
  function step(t){var k=Math.min(1,(t-t0)/dur);var e=1-Math.pow(1-k,3);
    el.textContent=Math.round(to*e); if(k<1)requestAnimationFrame(step); else el.textContent=to;}
  requestAnimationFrame(step);
}

PANELS.ecomap = async function(p){
  p.innerHTML = panelHeader('ecomap',{}) +
    '<div style="max-width:660px;margin:6px auto 0">'+
    '<div id="ecoSvg" style="width:100%"><div class="loading">'+esc(T('c_loading'))+'</div></div>'+
    '<div id="ecoLegend" style="margin-top:20px"></div></div>';
  var domCount={}; ECO_DOM.forEach(function(d){domCount[d.k]=0;});
  try{
    var so=await sb().from('conventity_solutions').select('name,domain,focus_area').limit(3000);
    (so.data||[]).forEach(function(r){
      domCount[ecoClassify((r.name||'')+' '+(r.domain||'')+' '+(r.focus_area||''))]++; });
  }catch(e){}
  var orgs=[];
  try{
    var og=await sb().from('conventity_orgs').select('legal_name').not('legal_name','is',null).order('legal_name').limit(300);
    orgs=(og.data||[]).map(function(o){return (''+o.legal_name).trim();}).filter(Boolean);
  }catch(e){}
  drawEcomap(orgs,domCount);
};

function drawEcomap(orgs,domCount){
  var host=$('#ecoSvg'); if(!host) return;
  var W=980,C=490, HUB=158, NR=112, ND=37, RI=178, RO=302, DL=238, RIM=308, RIMT=320;
  var svg='<svg viewBox="0 0 '+W+' '+W+'" style="width:100%;height:auto;display:block;overflow:visible" role="img" aria-label="'+esc(T('tab_ecomap'))+'">';
  // outer static guide + two counter-rotating dashed rings (radar sweep feel)
  svg+='<circle cx="'+C+'" cy="'+C+'" r="'+RIM+'" fill="none" stroke="var(--line2)" stroke-width="1"/>';
  svg+='<circle class="eco-sweep" cx="'+C+'" cy="'+C+'" r="'+RIM+'" fill="none" stroke="var(--gold)" stroke-width="1.4" stroke-opacity="0.4" stroke-dasharray="2 20" stroke-linecap="round">'+
    '<animateTransform attributeName="transform" type="rotate" from="0 '+C+' '+C+'" to="360 '+C+' '+C+'" dur="64s" repeatCount="indefinite"/></circle>';
  svg+='<circle class="eco-sweep" cx="'+C+'" cy="'+C+'" r="168" fill="none" stroke="var(--ink3)" stroke-width="1" stroke-opacity="0.5" stroke-dasharray="1 16">'+
    '<animateTransform attributeName="transform" type="rotate" from="360 '+C+' '+C+'" to="0 '+C+' '+C+'" dur="46s" repeatCount="indefinite"/></circle>';
  // middle ring — capability domains (8 slices), bloom-in staggered
  var N=ECO_DOM.length, step=360/N;
  for(var i=0;i<N;i++){
    var d=ECO_DOM[i], a0=i*step, a1=a0+step, mid=a0+step/2;
    svg+='<path class="eco-seg" style="animation-delay:'+(0.12+i*0.07).toFixed(2)+'s" d="'+ecoSector(C,C,RI,RO,a0,a1)+'" fill="'+d.c+'" fill-opacity="0.92" stroke="var(--cream)" stroke-width="2.5">'+
      '<title>'+esc(T('ecod_'+d.k))+' — '+(domCount[d.k]||0)+'</title></path>';
    var pos=ecoPolar(C,C,DL,mid), lines=ecoLines(T('ecod_'+d.k)), n=lines.length;
    var y0=pos.y-(n>1?7:1);
    for(var L=0;L<n;L++){
      svg+='<text x="'+ecoF(pos.x)+'" y="'+ecoF(y0+L*13)+'" text-anchor="middle" fill="#fff" '+
        'font-family="var(--body)" font-size="12.5" font-weight="700" style="pointer-events:none">'+esc(lines[L])+'</text>';
    }
    svg+='<text id="ecoc_'+d.k+'" x="'+ecoF(pos.x)+'" y="'+ecoF(y0+n*13+3)+'" text-anchor="middle" fill="#ffffff" fill-opacity="0.82" '+
      'font-family="var(--mono)" font-size="12" font-weight="600" style="pointer-events:none">'+(domCount[d.k]||0)+'</text>';
  }
  // energy flow — a dot travels hub→domain along each mid-spoke, looping
  for(var s=0;s<N;s++){
    var sm=s*step+step/2, fi=ecoPolar(C,C,RI+9,sm), fo=ecoPolar(C,C,RO-12,sm);
    svg+='<circle class="eco-flow" r="3.4" cx="0" cy="0" fill="#fff">'+
      '<animateMotion dur="2.4s" begin="'+(s*0.3).toFixed(2)+'s" repeatCount="indefinite" '+
      'path="M '+ecoF(fi.x)+' '+ecoF(fi.y)+' L '+ecoF(fo.x)+' '+ecoF(fo.y)+'"/>'+
      '<animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.18;0.7;1" dur="2.4s" begin="'+(s*0.3).toFixed(2)+'s" repeatCount="indefinite"/>'+
      '<animate attributeName="r" values="1.6;3.6;2.4" keyTimes="0;0.4;1" dur="2.4s" begin="'+(s*0.3).toFixed(2)+'s" repeatCount="indefinite"/></circle>';
  }
  // organizations rim — fade-in sequentially around the circle
  if(orgs.length){
    var shown=orgs.slice(0,36), M=shown.length;
    for(var o=0;o<M;o++){
      var oa=o*(360/M), tk0=ecoPolar(C,C,RIM,oa), tk1=ecoPolar(C,C,RIM+9,oa), lp=ecoPolar(C,C,RIMT,oa);
      var od=(0.5+o*0.035).toFixed(3);
      svg+='<g class="eco-org" style="animation-delay:'+od+'s">'+
        '<line x1="'+ecoF(tk0.x)+'" y1="'+ecoF(tk0.y)+'" x2="'+ecoF(tk1.x)+'" y2="'+ecoF(tk1.y)+'" stroke="var(--line2)" stroke-width="1"/>';
      var dx=lp.x-C, anc=(Math.abs(dx)<26?'middle':(dx<0?'end':'start'));
      var nm=shown[o]; if(nm.length>22) nm=nm.slice(0,21)+'…';
      svg+='<text x="'+ecoF(lp.x)+'" y="'+ecoF(lp.y)+'" text-anchor="'+anc+'" dominant-baseline="middle" '+
        'fill="var(--ink2)" font-family="var(--body)" font-size="10" font-weight="600">'+esc(nm)+'</text></g>';
    }
  }
  // hub disc + pulsing gold ring
  svg+='<circle cx="'+C+'" cy="'+C+'" r="'+HUB+'" fill="var(--navy)"/>';
  svg+='<circle class="eco-ring" cx="'+C+'" cy="'+C+'" r="'+HUB+'" fill="none" stroke="var(--gold)" stroke-width="1.6"/>';
  // center title
  svg+='<text x="'+C+'" y="'+(C-6)+'" text-anchor="middle" fill="var(--gold)" font-family="var(--serif)" font-size="26">Conventity</text>';
  svg+='<text x="'+C+'" y="'+(C+11)+'" text-anchor="middle" fill="#cbd5ea" font-family="var(--mono)" font-size="8" font-weight="600" letter-spacing="1.4" style="text-transform:uppercase">'+esc(T('eco_sub'))+'</text>';
  // 6 platform nodes — pop-in (staggered) + gentle continuous float
  for(var q=0;q<ECO_PLAT.length;q++){
    var pf=ECO_PLAT[q], pa=q*60, pc=ecoPolar(C,C,NR,pa);
    svg+='<g class="eco-node" style="animation-delay:'+(0.2+q*0.1).toFixed(2)+'s">'+
      '<g class="eco-float" style="animation-delay:'+(1.0+q*0.35).toFixed(2)+'s">'+
      '<circle class="eco-nodec" cx="'+ecoF(pc.x)+'" cy="'+ecoF(pc.y)+'" r="'+ND+'" fill="'+pf.c+'" stroke="#fff" stroke-width="2" stroke-opacity="0.9"/>'+
      '<text x="'+ecoF(pc.x)+'" y="'+ecoF(pc.y+3.5)+'" text-anchor="middle" fill="#fff" font-family="var(--body)" '+
      'font-size="'+(pf.n.length>9?9.5:11)+'" font-weight="700" style="pointer-events:none">'+esc(pf.n)+'</text>'+
      '</g></g>';
  }
  svg+='</svg>';

/* ===================================================================
   MATCHING (Reach-in) — kural-tabanlı, açıklanabilir
   Motor önerir, karar kullanıcıya aittir.
   =================================================================== */
var STOP=('ve ile için the and for with of a an in on to sistem system solution çözüm '+
  'technology teknoloji based tabanlı new yeni integrated entegre support destek services service '+
  'ltd inc sa pc gmbh as a.ş company şirket').split(/\s+/);
var ALIAS={counteruas:'cuas',counterdrone:'cuas',antidrone:'cuas',cuas:'cuas',
  uav:'uas',uas:'uas',drone:'uas',drones:'uas',uncrewed:'uas',unmanned:'uas',
  defeat:'defeat',kinetic:'kinetic',
  sbamd:'sbamd',iamd:'iamd', istar:'istar'};
function toks(s){
  s=(s||'').toLowerCase();
  var joined=(s.match(/[a-z0-9çğıöşü]+(?:-[a-z0-9çğıöşü]+)+/g)||[]).map(function(x){return x.replace(/-/g,'');});
  var base=s.replace(/[^a-z0-9çğıöşü\s-]/g,' ').split(/[\s-]+/);
  return base.concat(joined)
    .map(function(w){return ALIAS[w]||w;})
    .filter(function(w){return w.length>3 && STOP.indexOf(w)<0;});
}
function uniq(a){var o={},r=[];a.forEach(function(x){if(!o[x]){o[x]=1;r.push(x);}});return r;}

function scoreMatch(pr,so){
  var reasons=[],score=0;
  var pT=uniq(toks(pr.title+' '+(pr.focus_area||'')+' '+(pr.op_description||'')+' '+(pr.desired_end_state||'')));
  var sT=uniq(toks((so.name||'')+' '+(so.focus_area||'')+' '+(so.domain||'')+' '+
        ((so.orion&&so.orion.primary_name)||'')+' '+((so.orion&&so.orion.primary_code)||'')));
  var shared=pT.filter(function(w){return sT.indexOf(w)>-1;});
  if(shared.length){var fs=Math.min(40,shared.length*13);score+=fs;
    reasons.push({t:T('mw_focus')+': '+shared.slice(0,3).join(', '),k:'pos'});}

  var trl=so.trl;
  if(trl!=null){
    var ts=(trl>=7?25:(trl>=5?18:(trl>=3?10:4)));score+=ts;
    reasons.push({t:'TRL '+trl,k:(trl>=5?'pos':'')});
  }
  var o=so.orion||{};
  if(o.primary_code){
    var pc=(''+o.primary_code).toLowerCase();
    var hit=pT.some(function(w){return pc.indexOf(w)>-1;});
    if(hit){score+=20;reasons.push({t:T('mw_code')+': '+o.primary_code,k:'pos'});}
    else reasons.push({t:o.primary_code,k:''});
  }
  if(o.verdict){
    var v=(''+o.verdict).toLowerCase();
    if(v==='match'){score+=15;reasons.push({t:'FIT match',k:'pos'});}
    else if(v==='weak'){score+=6;reasons.push({t:'FIT weak',k:''});}
    else if(v==='mismatch'){score-=8;reasons.push({t:'FIT mismatch',k:'neg'});}
  }
  if(o.confidence!=null){
    if(o.confidence>=80){score+=8;reasons.push({t:T('mw_conf')+' '+o.confidence,k:'pos'});}
    else if(o.confidence>=60){score+=4;reasons.push({t:T('mw_conf')+' '+o.confidence,k:''});}
  }
  if(so.cost_class){score+=3;reasons.push({t:T('cc_'+so.cost_class),k:''});}
  score=Math.max(0,Math.min(100,score));
  return {score:score,reasons:reasons};
}

PANELS.matching = async function(p){
  p.innerHTML=panelHeader('matching',{countId:'mCount',actions:''})+
    '<div class="mpick"><select id="mProblem"></select>'+
    '<button class="btn btn-primary btn-sm" id="mRun">'+esc(T('m_run'))+'</button></div>'+
    '<div id="mList"></div>';
  applyI18n(p);
  var problems=[],sols=[],orgs={},decisions={};
  var pr=await sb().from('conventity_problems').select('*').order('created_at',{ascending:false}).limit(500);
  problems=pr.data||[];
  $('#mProblem').innerHTML='<option value="">'+esc(T('m_pick'))+'</option>'+
    problems.map(function(x){return '<option value="'+x.id+'">'+esc(x.title)+'</option>';}).join('');
  var so=await sb().from('conventity_solutions').select('*').limit(5000); sols=so.data||[];
  var og=await sb().from('conventity_orgs').select('id,legal_name').limit(10000);
  (og.data||[]).forEach(function(o){orgs[o.id]=o.legal_name;});
  setCount('mCount',sols.length,'solutions');

  async function loadDecisions(pid){
    decisions={};
    var d=await sb().from('conventity_matches').select('*').eq('problem_id',pid);
    (d.data||[]).forEach(function(x){decisions[x.solution_id]=x;});
  }
  async function run(){
    var pid=$('#mProblem').value;
    if(!pid){$('#mList').innerHTML='<div class="empty">'+esc(T('m_pick'))+'</div>';return;}
    $('#mList').innerHTML='<div class="loading">'+esc(T('c_loading'))+'</div>';
    var prob=problems.find(function(x){return x.id===pid;});
    await loadDecisions(pid);
    var ranked=sols.map(function(s){var r=scoreMatch(prob,s);return {s:s,score:r.score,reasons:r.reasons};})
      .filter(function(x){return x.score>0;})
      .sort(function(a,b){return b.score-a.score;});
    if(!ranked.length){$('#mList').innerHTML='<div class="empty">'+esc(T('m_none'))+'</div>';return;}
    $('#mList').innerHTML='<p class="readonly-note" style="margin:0 0 12px">'+esc(T('m_note'))+'</p>'+
      ranked.map(function(x){
        var col=x.score>=60?'#1f7a4d':(x.score>=35?'#B8791F':'#6b7488');
        var dec=decisions[x.s.id];
        return '<div class="mrow" style="--sc:'+col+'" data-sid="'+x.s.id+'">'+
          '<div class="mscore"><div class="v">'+x.score+'</div><div class="b"><i style="width:'+x.score+'%"></i></div></div>'+
          '<div class="mbody"><div class="n">'+esc(x.s.name)+
            (dec?'<span class="mdec '+esc(dec.status)+'">'+esc(T('ms_'+dec.status))+'</span>':'')+'</div>'+
          '<div class="o">'+esc(orgs[x.s.org_id]||T('c_none'))+'</div>'+
          '<div class="mwhy">'+x.reasons.map(function(r){return '<span class="'+r.k+'">'+esc(r.t)+'</span>';}).join('')+'</div>'+
          '<div class="macts">'+
            '<button class="btn btn-ghost btn-sm act" data-a="shortlisted">'+esc(T('ms_shortlisted'))+'</button>'+
            '<button class="btn btn-ghost btn-sm act" data-a="contacted">'+esc(T('ms_contacted'))+'</button>'+
            '<button class="btn btn-ghost btn-sm act" data-a="rejected">'+esc(T('ms_rejected'))+'</button>'+
            (x.s.org_id?'<button class="btn btn-primary btn-sm inv">'+esc(T('m_invite'))+'</button>':'')+
          '</div></div></div>';
      }).join('');
    $$('#mList .mrow').forEach(function(row){
      var sid=row.getAttribute('data-sid');
      var item=ranked.find(function(x){return x.s.id===sid;});
      $$('.act',row).forEach(function(b){
        b.addEventListener('click',function(){decide(pid,item,b.getAttribute('data-a'));});
      });
      var ib=row.querySelector('.inv');
      if(ib) ib.addEventListener('click',function(){invite(pid,item);});
    });
  }
  async function invite(pid,item){
    var a=await sb().from('conventity_activities').select('id,title,start_date').order('created_at',{ascending:false}).limit(500);
    var acts=a.data||[];
    if(!acts.length){toast(T('m_noact'),true);return;}
    openDrawer(T('m_invite_t'),
      '<p style="margin:0 0 14px;font-size:13.5px;color:var(--ink2)">'+esc(item.s.name)+' — '+esc(orgs[item.s.org_id]||'')+'</p>'+
      fWrap(fSelOpts('f_act','ev_activity',acts.map(function(x){return {v:x.id,l:x.title};}),'',true),'invErr'),
      '<div style="flex:1"></div><button class="btn btn-ghost" id="dCancel">'+esc(T('c_cancel'))+'</button>'+
      '<button class="btn btn-primary" id="dSave">'+esc(T('m_invite_go'))+'</button>');
    applyI18n($('#drawerBody'));
    $('#dCancel').addEventListener('click',closeDrawer);
    $('#dSave').addEventListener('click',async function(){
      var aid=$('#f_act').value;
      if(!aid){$('#invErr').textContent=T('ev_need_act');return;}
      var res=await sb().from('conventity_participation').upsert({
        activity_id:aid, org_id:item.s.org_id, part_role:'vendor', status:'invited',
        source_ref:'match_invite:'+pid+':'+item.s.id
      },{onConflict:'source_ref'});
      if(res.error){$('#invErr').textContent=res.error.message;return;}
      await decide(pid,item,'engaged');
      closeDrawer(); toast(T('m_invited'));
    });
  }
  async function decide(pid,item,status){
    var rec={problem_id:pid,solution_id:item.s.id,org_id:item.s.org_id||null,score:item.score,
      reasons:item.reasons.map(function(r){return r.t;}),status:status,decided_at:new Date().toISOString()};
    var u=await sb().auth.getUser(); if(u.data&&u.data.user)rec.decided_by=u.data.user.id;
    var res=await sb().from('conventity_matches').upsert(rec,{onConflict:'problem_id,solution_id'});
    if(res.error){toast(res.error.message,true);return;}
    toast(T('c_saved')); run();
  }
  $('#mRun').addEventListener('click',run);
  $('#mProblem').addEventListener('change',run);
};

async function checkAdmin(){
  var r=await sb().rpc('conventity_is_admin',{p_scope:'ecosystem'});
  if(r.error){ console.error(r.error); return false; }
  return r.data===true;
}
function showApp(){
  $('#authView').classList.add('hidden');
  $('#shell').classList.remove('hidden');
  $('#signoutBtn').classList.remove('hidden');
  renderTabbar(); initNav(); openTab('overview');
}
function showLogin(denied){
  $('#shell').classList.add('hidden');
  $('#signoutBtn').classList.add('hidden');
  $('#authView').classList.remove('hidden');
  $('#loginForm').classList.toggle('hidden',!!denied);
  $('#deniedBox').classList.toggle('hidden',!denied);
}
async function boot(){
  applyTheme();
  setLang(LANG);
  var s=await sb().auth.getSession();
  if(s.data && s.data.session){
    var ok=await checkAdmin();
    ok?showApp():showLogin(true);
  } else { showLogin(false); }
}
$('#signinBtn').addEventListener('click',async function(){
  var btn=this, err=$('#authErr'); err.textContent='';
  var email=$('#email').value.trim(), pass=$('#password').value;
  if(!email||!pass){ err.textContent=T('c_required'); return; }
  btn.disabled=true; btn.textContent='…';
  try{
    var r=await sb().auth.signInWithPassword({email:email,password:pass});
    if(r.error){ err.textContent=T('au_wrong'); return; }
    var ok=await checkAdmin();
    ok?showApp():showLogin(true);
  }catch(e){ err.textContent=T('c_error'); }
  finally{ btn.disabled=false; btn.textContent=T('au_signin'); }
});
async function doSignout(){ try{ await sb().auth.signOut(); }catch(e){} showLogin(false); }
$('#signoutBtn').addEventListener('click',doSignout);
$('#deniedSignout').addEventListener('click',doSignout);
