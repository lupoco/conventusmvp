<!doctype html>
<html lang="tr" data-theme="light">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="robots" content="noindex, nofollow"/>
<title>Conventity — Çalışma altında</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
/* ============================================================================
   TEK DOSYA. /assets'e bagimli DEGIL.
   Bu sayfa ErrorDocument 401/403 olarak, yani AUTH'SUZ servis ediliyor;
   korumali bir stylesheet/script cekerse 401 dongusune girer.
   Tokenlar ve hero dili assets/shared.css ile ayni; globe animasyonu
   index.html'den birebir alindi.
   ========================================================================= */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --brand-ink:#0E2148; --brand-blue:#2A6FDB; --brand-sky:#6FA8E6; --brand-gold:#C8A24B;
  --pf-convexus:#6366F1; --pf-conventus:#004990;
  --bg:#F5F2EC; --paper:#FFFFFF; --paper-2:#FAF7F1;
  --ink:#0E2148; --ink-2:#1F2D55; --muted:#5A6486;
  --line:#E5DFD2; --line-2:#D6CFBE;
  --logo-outer:#0E2148; --logo-inner:#2A6FDB;
}
html[data-theme="dark"]{
  --bg:#05070D; --paper:#0E131F; --paper-2:#0A0E18;
  --ink:#E8ECF5; --ink-2:#C8CFDD; --muted:#6F7A92;
  --line:#161C2A; --line-2:#232A3D;
  --logo-outer:#E8ECF5; --logo-inner:#5BC0FF;
}

html,body{height:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:'Manrope',system-ui,-apple-system,sans-serif;
  display:flex; flex-direction:column; min-height:100vh;
  transition:background .2s ease,color .2s ease;
}
a{color:inherit;text-decoration:none}

/* ---- marka (index.html topbar ile ayni) ---- */
.topbar{border-bottom:1px solid var(--line); position:relative; z-index:2}
.topbar-inner{
  max-width:1220px; margin:0 auto; padding:18px 28px;
  display:flex; align-items:center; gap:14px; justify-content:space-between;
}
.brand{display:flex; align-items:center; gap:14px}
.brand-mark{width:38px;height:38px;flex:none}
.brand-name{
  font-weight:700; letter-spacing:.22em; font-size:20px; line-height:1;
  background:linear-gradient(110deg,#7FA8E8 0%,#9BBCEC 34%,#A9C7E0 60%,#C9B3E6 100%);
  background-size:200% auto;
  -webkit-background-clip:text; background-clip:text; color:transparent;
  animation:hlShine 8s linear infinite;
}
.brand-sub{
  font-size:9px; letter-spacing:.32em; margin-top:3px; text-transform:uppercase;
  font-weight:700;
  background:linear-gradient(110deg,var(--brand-blue) 0%,var(--pf-convexus) 45%,var(--pf-conventus) 75%,#D97757 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
@keyframes hlShine{to{background-position:200% center}}

.tools{display:flex; gap:8px; align-items:center}
.tool{
  font-family:'JetBrains Mono',ui-monospace,monospace;
  font-size:11px; font-weight:700; letter-spacing:.06em;
  min-width:38px; height:34px; padding:0 10px;
  border:1px solid var(--line); border-radius:999px;
  background:var(--paper); color:var(--ink-2);
  cursor:pointer; transition:all .2s ease;
  display:inline-flex; align-items:center; justify-content:center;
}
.tool:hover{border-color:var(--brand-blue); color:var(--brand-blue)}

/* ---- hero (index.html ile ayni yapi) ---- */
.hero{position:relative; overflow:hidden; flex:1; padding:48px 0 64px;
  display:flex; align-items:center}
.hero-bg{
  position:absolute; inset:0; pointer-events:none;
  background:
    radial-gradient(50% 70% at 18% 8%, color-mix(in srgb, var(--brand-sky) 22%, transparent) 0%, transparent 60%),
    radial-gradient(40% 60% at 92% 30%, color-mix(in srgb, var(--brand-gold) 14%, transparent) 0%, transparent 60%);
}
html[data-theme="dark"] .hero-bg{
  background:
    radial-gradient(45% 60% at 18% 8%, color-mix(in srgb, var(--brand-blue) 18%, transparent) 0%, transparent 65%),
    radial-gradient(40% 60% at 90% 30%, color-mix(in srgb, #00C2FF 10%, transparent) 0%, transparent 65%);
}
html[data-theme="dark"] .hero::before{
  content:""; position:absolute; inset:0; pointer-events:none;
  background-image:
    linear-gradient(rgba(61,165,255,.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(61,165,255,.04) 1px, transparent 1px);
  background-size:80px 80px;
  -webkit-mask-image:radial-gradient(80% 60% at 50% 40%, black 0%, transparent 80%);
  mask-image:radial-gradient(80% 60% at 50% 40%, black 0%, transparent 80%);
}
.hero-grid{
  position:relative; width:100%;
  max-width:1220px; margin:0 auto; padding:0 28px;
  display:grid; grid-template-columns:1.05fr 1fr; gap:60px; align-items:center;
}

.eyebrow{
  display:inline-flex; align-items:center; gap:10px;
  padding:7px 14px 7px 8px; border-radius:999px;
  background:var(--paper); border:1px solid var(--line);
  font-size:12px; font-weight:600; color:var(--ink-2); letter-spacing:.04em;
}
.eyebrow-dot{
  width:22px; height:22px; border-radius:50%;
  background:linear-gradient(135deg,var(--brand-blue),var(--pf-convexus));
  display:inline-flex; align-items:center; justify-content:center;
  color:#fff; font-size:11px;
}
h1.hero-title{
  font-family:'Manrope',sans-serif; font-weight:700;
  font-size:clamp(30px,3vw,50px); line-height:1.05; letter-spacing:-.025em;
  margin:22px 0 0; color:var(--ink);
}
h1.hero-title em{
  font-family:'Instrument Serif',serif; font-style:italic; font-weight:400;
  background:linear-gradient(110deg,var(--brand-blue) 0%,var(--pf-convexus) 40%,var(--pf-conventus) 70%,#D97757 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  font-size:1.04em; letter-spacing:-.02em;
}
.hero-lead{font-size:18px; line-height:1.55; color:var(--muted); max-width:520px; margin:26px 0 34px}
.hero-actions{display:flex; gap:12px; flex-wrap:wrap}
.btn{
  display:inline-flex; align-items:center; gap:8px;
  padding:11px 20px; border-radius:999px;
  font-weight:600; font-size:14px; font-family:inherit;
  border:1px solid transparent; cursor:pointer; transition:all .2s ease;
}
.btn-primary{background:var(--brand-ink); color:#fff}
html[data-theme="dark"] .btn-primary{background:var(--brand-blue)}
.btn-primary:hover{background:var(--brand-blue); transform:translateY(-1px)}
.btn-ghost{background:transparent; color:var(--ink); border-color:var(--line-2)}
.btn-ghost:hover{background:var(--paper)}

.hero-globe-wrap{
  position:relative; display:flex; align-items:center; justify-content:center;
  aspect-ratio:1/1; max-width:560px; width:100%; margin:0 auto;
}
#globeCanvas{width:100%; height:100%; display:block}

.foot{
  font-family:'JetBrains Mono',ui-monospace,monospace;
  font-size:10px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--muted); text-align:center; padding:14px;
  border-top:1px solid var(--line); position:relative; z-index:2;
}
.ver{
  font-family:'JetBrains Mono',ui-monospace,monospace;
  font-size:9.5px; font-weight:700; letter-spacing:.1em;
  padding:3px 8px; border:1px solid var(--line); border-radius:999px; color:var(--muted);
}

@media (max-width:1080px){
  .hero-grid{grid-template-columns:1fr; gap:34px; text-align:center}
  .hero-lead{margin-left:auto; margin-right:auto}
  .hero-actions{justify-content:center}
  .hero-globe-wrap{max-width:400px; order:-1}
}
@media (max-width:640px){
  .topbar-inner{padding:14px 18px}
  .brand-name{font-size:18px; letter-spacing:.18em}
  .hero{padding:26px 0 38px}
  .hero-grid{padding:0 18px}
  .hero-globe-wrap{max-width:290px}
  .hero-lead{font-size:16px}
}
@media (prefers-reduced-motion:reduce){
  .brand-name{animation:none}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 100 100" aria-hidden="true">
        <path d="M 76.2 68.4 A 32 32 0 1 1 76.2 31.6" fill="none"
              stroke="var(--logo-outer)" stroke-width="6" stroke-linecap="round"/>
        <path d="M 64.7 60.3 A 18 18 0 1 1 64.7 39.7" fill="none"
              stroke="var(--logo-inner)" stroke-width="4.5" stroke-linecap="round"/>
        <circle cx="50" cy="50" r="3" fill="var(--logo-outer)"/>
      </svg>
      <div>
        <div class="brand-name">CONVENTITY</div>

<section class="hero">
  <div class="hero-bg"></div>
  <div class="hero-grid">
    <div class="hero-copy">
      <span class="eyebrow">
        <span class="eyebrow-dot">✦</span>
        <span data-i="eyebrow">KAPALI TEST · DAVETLİ ERİŞİM</span>

        <span data-i="lead2">Altı platform — tek operasyonel ekosistem.</span>
      </p>

               stroke-width="2.5" stroke-linecap="round"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
        </a>
        <a class="btn btn-ghost" href="mailto:serkancopul@gmail.com?subject=Conventity%20erisim"
           data-i="contact">Erişim iste</a>

    <div class="hero-globe-wrap">
      <canvas id="globeCanvas" width="560" height="560" aria-hidden="true"></canvas>
    </div>
  </div>
</section>

<div class="foot"><span class="ver">v0.3</span></div>

<script>
(function(){
  'use strict';
  /* localStorage engellenmis tarayicida firlatiyor — proje kurali: try/catch.
     Anahtarlar assets/prefs.js ile ayni: cv-theme / cv-lang. */
  function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
  function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }

  var I18N = {
    /* lead1/lead2 index.html sozlugundeki resmi cevirilerle ayni */
    tr:{ eyebrow:'KAPALI TEST · DAVETLİ ERİŞİM',
         title:'Çalışma altında.',
         lead1:'Tasarımdan güvenli. Doğası gereği birlikte çalışabilir.',
         lead2:'Altı platform — tek operasyonel ekosistem.',
         retry:'Tekrar dene', contact:'Erişim iste',
         docTitle:'Conventity — Çalışma altında' },
    en:{ eyebrow:'CLOSED PREVIEW · INVITED ACCESS',
         title:'Under construction.',
         lead1:'Secure by design. Interoperable by nature.',
         lead2:'Six platforms — one operational ecosystem.',
         retry:'Try again', contact:'Request access',
         docTitle:'Conventity — Under construction' }
  };

  var root = document.documentElement;
  var lang = lsGet('cv-lang') === 'tr' ? 'tr' : 'en';

  function applyLang(){
    var d = I18N[lang];
    root.lang = lang;
    var nodes = document.querySelectorAll('[data-i]');
    for (var i = 0; i < nodes.length; i++){
      var k = nodes[i].getAttribute('data-i');
      if (d[k] != null) nodes[i].textContent = d[k];
    }
    document.getElementById('lang').textContent = lang === 'tr' ? 'EN' : 'TR';
    document.title = d.docTitle;
  }
  document.getElementById('lang').addEventListener('click', function(){
    lang = lang === 'tr' ? 'en' : 'tr'; lsSet('cv-lang', lang); applyLang();
  });

  /* cv-theme: 'system' | 'light' | 'dark' — prefs.js ile ayni sozlesme */
  function resolve(pref){
    if (pref === 'light' || pref === 'dark') return pref;
    try {
      return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    } catch (e) { return 'light'; }
  }
  function applyTheme(){
    var eff = resolve(lsGet('cv-theme') || 'system');
    root.setAttribute('data-theme', eff);
    document.getElementById('theme').textContent = eff === 'dark' ? '☀️' : '🌙';
  }
  document.getElementById('theme').addEventListener('click', function(){
    var eff = resolve(lsGet('cv-theme') || 'system');
    lsSet('cv-theme', eff === 'dark' ? 'light' : 'dark');
    applyTheme();
  });

  applyLang(); applyTheme();
})();

// ── ANIMATED GLOBE CANVAS ──
(function(){
  const canvas = document.getElementById('globeCanvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const W = 560, H = 560, CX = W/2, CY = H/2, R = 200;

  // Continent dot clusters
  const continentPoints = [];
  const clusters = [
    {cx:.12,cy:-.55,rx:.18,ry:.12,n:42},   // Europe
    {cx:-.55,cy:-.4,rx:.22,ry:.2,n:55},    // N. America
    {cx:-.38,cy:.3,rx:.14,ry:.22,n:38},    // S. America
    {cx:.18,cy:.15,rx:.16,ry:.28,n:55},    // Africa
    {cx:.5,cy:-.35,rx:.3,ry:.2,n:75},      // Asia
    {cx:.65,cy:.05,rx:.12,ry:.12,n:28},    // SE Asia
    {cx:.7,cy:.4,rx:.12,ry:.1,n:22},       // Australia
  ];
  clusters.forEach(c=>{
    for(let i=0;i<c.n;i++){
      const a = Math.random()*Math.PI*2;
      const r = Math.random();
      continentPoints.push([
        c.cx + Math.cos(a)*r*c.rx,
        c.cy + Math.sin(a)*r*c.ry
      ]);
    }
  });

  const nodeAngles = [
    {a:-90, lbl:'CONVEXUS',  color:'#818CF8', icon:'cube'},
    {a:-30, lbl:'CONVENTUS', color:'#F472B6', icon:'cal'},
    {a: 30, lbl:'CONSULTUS', color:'#0BB8C4', icon:'users'},
    {a: 90, lbl:'CONNECTUS', color:'#4ADE80', icon:'net'},
    {a:150, lbl:'CONVERGENS',  color:'#A05CE6', icon:'shield'},
    {a:210, lbl:'CONVENTLAB',  color:'#E0926E', icon:'flask'},
  ];
  const NR = R + 50;

  function hexToRgba(hex, a){
    const h = hex.replace('#','');
    const r = parseInt(h.substring(0,2),16);
    const g = parseInt(h.substring(2,4),16);
    const b = parseInt(h.substring(4,6),16);
    return `rgba(${r},${g},${b},${a})`;
  }

  function drawPlatformIcon(ctx, type, color){
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.lineWidth = 1.6; ctx.lineCap='round'; ctx.lineJoin='round';
    if(type==='cube'){
      // Hexagon (Convexus)
      ctx.beginPath();
      for(let i=0;i<6;i++){
        const a = -Math.PI/2 + i*Math.PI/3;
        const x = Math.cos(a)*8, y = Math.sin(a)*8;
        if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      }
      ctx.closePath(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-8,0); ctx.lineTo(8,0); ctx.stroke();
      ctx.beginPath(); ctx.arc(0,0,1.5,0,Math.PI*2); ctx.fill();
    } else if(type==='cal'){
      // Calendar (Conventus)
      ctx.beginPath();
      ctx.roundRect ? ctx.roundRect(-8,-7,16,15,2) : (ctx.rect(-8,-7,16,15));
      ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-8,-3); ctx.lineTo(8,-3); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-4,-9); ctx.lineTo(-4,-5); ctx.moveTo(4,-9); ctx.lineTo(4,-5); ctx.stroke();
      ctx.beginPath(); ctx.arc(-3,2,1,0,Math.PI*2); ctx.arc(3,2,1,0,Math.PI*2); ctx.fill();
    } else if(type==='users'){
      // Two heads (Consultus)
      ctx.beginPath(); ctx.arc(-4,-3,2.6,0,Math.PI*2); ctx.stroke();
      ctx.beginPath(); ctx.arc(4,-3,2.6,0,Math.PI*2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-9,7); ctx.quadraticCurveTo(-9,1,-4,1); ctx.quadraticCurveTo(1,1,1,7); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0,7); ctx.quadraticCurveTo(0,1,4,1); ctx.quadraticCurveTo(9,1,9,7); ctx.stroke();
    } else if(type==='net'){
      // Connected dots (Connectus)
      const pts = [[0,-7],[-7,0],[7,0],[0,7]];
      ctx.beginPath();
      ctx.moveTo(pts[0][0],pts[0][1]); ctx.lineTo(pts[1][0],pts[1][1]);
      ctx.moveTo(pts[0][0],pts[0][1]); ctx.lineTo(pts[2][0],pts[2][1]);
      ctx.moveTo(pts[1][0],pts[1][1]); ctx.lineTo(pts[3][0],pts[3][1]);
      ctx.moveTo(pts[2][0],pts[2][1]); ctx.lineTo(pts[3][0],pts[3][1]);
      ctx.moveTo(pts[1][0],pts[1][1]); ctx.lineTo(pts[2][0],pts[2][1]);
      ctx.stroke();
      pts.forEach(p=>{ ctx.beginPath(); ctx.arc(p[0],p[1],2,0,Math.PI*2); ctx.fill(); });
    } else if(type==='shield'){
      // Shield with check (Convergens)
      ctx.beginPath();
      ctx.moveTo(0,-8); ctx.lineTo(7,-5); ctx.lineTo(7,1);
      ctx.quadraticCurveTo(7,7,0,9);
      ctx.quadraticCurveTo(-7,7,-7,1);
      ctx.lineTo(-7,-5); ctx.closePath(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-3,0); ctx.lineTo(-1,2.5); ctx.lineTo(3.5,-2); ctx.stroke();
    } else if(type==='flask'){
      // Flask (Conventlab)
      ctx.beginPath();
      ctx.moveTo(-3,-8); ctx.lineTo(3,-8);
      ctx.moveTo(-3,-8); ctx.lineTo(-3,-2);
      ctx.moveTo(3,-8); ctx.lineTo(3,-2);
      ctx.lineTo(7,7); ctx.quadraticCurveTo(7,9,5,9);
      ctx.lineTo(-5,9); ctx.quadraticCurveTo(-7,9,-7,7);
      ctx.lineTo(-3,-2);
      ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-5,3); ctx.lineTo(5,3); ctx.stroke();
      ctx.beginPath(); ctx.arc(-2,6,0.9,0,Math.PI*2); ctx.arc(1.5,5,0.7,0,Math.PI*2); ctx.fill();
    }
  }

  function isLight(){
    return document.documentElement.getAttribute('data-theme') === 'light';
  }
  function palette(){
    if (isLight()){
      return {
        outerGlow:['rgba(42,111,219,0.18)','rgba(42,111,219,0.05)','rgba(42,111,219,0)'],
        globeBg:['rgba(220,232,250,0.85)','rgba(190,212,242,0.7)','rgba(170,196,236,0.6)'],
        latLine:'rgba(42,111,219,0.18)',
        meridian:'rgba(42,111,219,0.12)',
        continent:(z)=>`rgba(14,33,72,${0.25 + z*0.5})`,
        rim:'rgba(42,111,219,0.5)',
        coreCore:['rgba(91,192,255,0.45)','rgba(42,111,219,0.18)','rgba(42,111,219,0)'],
        cArcOuter:'#0E2148',
        cArcMid:'#2A6FDB',
        cArcInner:'#6FA8E6',
        centerDot:'#0E2148',
        podBg:'rgba(255,255,255,0.92)'
      };
    }
    return {
      outerGlow:['rgba(0,133,255,0.20)','rgba(0,133,255,0.06)','rgba(0,133,255,0)'],
      globeBg:['rgba(27,58,126,0.55)','rgba(10,31,77,0.45)','rgba(3,8,28,0.65)'],
      latLine:'rgba(91,192,255,0.16)',
      meridian:'rgba(91,192,255,0.12)',
      continent:(z)=>`rgba(120,200,255,${0.22 + z*0.6})`,
      rim:'rgba(61,165,255,0.45)',
      coreCore:['rgba(91,192,255,0.55)','rgba(61,165,255,0.22)','rgba(61,165,255,0)'],
      cArcOuter:'rgba(255,255,255,1)',
      cArcMid:'rgba(91,192,255,0.95)',
      cArcInner:'rgba(61,165,255,0.85)',
      centerDot:'#FFFFFF',
      podBg:'rgba(5,12,28,0.95)'
    };
  }

  let t = 0;

  function draw(){
    const P = palette();
    ctx.clearRect(0,0,W,H);

    // Outer glow
    const grd = ctx.createRadialGradient(CX,CY,0,CX,CY,R+30);
    grd.addColorStop(0, P.outerGlow[0]);
    grd.addColorStop(.7, P.outerGlow[1]);
    grd.addColorStop(1, P.outerGlow[2]);
    ctx.fillStyle=grd; ctx.beginPath(); ctx.arc(CX,CY,R+30,0,Math.PI*2); ctx.fill();

    // Globe clip + bg
    ctx.save();
    ctx.beginPath(); ctx.arc(CX,CY,R,0,Math.PI*2); ctx.clip();

    const gbg = ctx.createRadialGradient(CX-40,CY-40,0,CX,CY,R);
    gbg.addColorStop(0, P.globeBg[0]);
    gbg.addColorStop(.55, P.globeBg[1]);
    gbg.addColorStop(1, P.globeBg[2]);
    ctx.fillStyle=gbg; ctx.fillRect(0,0,W,H);

    // Latitude rings
    [-3,-2,-1,0,1,2,3].forEach(i=>{
      const yOff = i * (R/3.5);
      const rr = Math.sqrt(Math.max(0, R*R - yOff*yOff));
      if(rr < 5) return;
      ctx.beginPath();
      ctx.ellipse(CX, CY+yOff, rr, rr*0.28, 0, 0, Math.PI*2);
      ctx.strokeStyle = P.latLine; ctx.lineWidth=0.7; ctx.stroke();
    });

    // Rotating meridians
    for(let i=0;i<6;i++){
      const angle = (i/6)*Math.PI + t*0.0035;
      ctx.save();
      ctx.translate(CX,CY); ctx.rotate(angle);
      ctx.beginPath(); ctx.ellipse(0,0,R*0.28,R,0,0,Math.PI*2);
      ctx.strokeStyle = P.meridian; ctx.lineWidth=0.7; ctx.stroke();
      ctx.restore();
    }

    // Continent dots (with slow rotation)
    const rot = t*0.0035;
    continentPoints.forEach(([nx,ny])=>{
      const lon = nx * Math.PI + rot;
      const lat = ny * Math.PI/2;
      const cosLat = Math.cos(lat);
      const x3d = cosLat * Math.cos(lon);
      const y3d = Math.sin(lat);
      const z3d = cosLat * Math.sin(lon);
      if(z3d < -0.25) return;
      const px = CX + x3d * R;
      const py = CY - y3d * R;
      const alpha = 0.22 + z3d * 0.6;
      const size = 1.1 + z3d*0.9;
      ctx.beginPath(); ctx.arc(px,py,size,0,Math.PI*2);
      ctx.fillStyle = P.continent(z3d); ctx.fill();
    });

    ctx.restore();

    // Globe rim
    ctx.beginPath(); ctx.arc(CX,CY,R,0,Math.PI*2);
    ctx.strokeStyle = P.rim; ctx.lineWidth=1; ctx.stroke();

    // Connection arcs to nodes
    nodeAngles.forEach(n=>{
      const rad = n.a * Math.PI/180;
      const nx = CX + NR * Math.cos(rad);
      const ny = CY + NR * Math.sin(rad);
      const lg = ctx.createLinearGradient(CX,CY,nx,ny);
      lg.addColorStop(0, hexToRgba(n.color, 0.55));
      lg.addColorStop(1, hexToRgba(n.color, 0.05));
      ctx.beginPath(); ctx.moveTo(CX,CY); ctx.lineTo(nx,ny);
      ctx.strokeStyle=lg; ctx.lineWidth=0.8; ctx.stroke();
      const rx2 = CX + R * Math.cos(rad);
      const ry2 = CY + R * Math.sin(rad);
      const pulse = 2.5 + Math.sin(t*0.05 + n.a*0.1)*0.8;
      ctx.beginPath(); ctx.arc(rx2,ry2,pulse,0,Math.PI*2);
      ctx.fillStyle = hexToRgba(n.color, 0.9); ctx.fill();
    });

    // CENTER C LOGO
    const CLR = 56;
    const cg = ctx.createRadialGradient(CX,CY,0,CX,CY,CLR+34);
    cg.addColorStop(0, P.coreCore[0]);
    cg.addColorStop(.5, P.coreCore[1]);
    cg.addColorStop(1, P.coreCore[2]);
    ctx.fillStyle=cg; ctx.beginPath(); ctx.arc(CX,CY,CLR+34,0,Math.PI*2); ctx.fill();

    // C arcs (concentric)
    const startA = 30 * Math.PI/180;
    const endA   = 330 * Math.PI/180;
    [
      [CLR,    P.cArcOuter, 3],
      [CLR-15, P.cArcMid,   2.4],
      [CLR-30, P.cArcInner, 2]
    ].forEach(([r,col,lw])=>{
      ctx.beginPath();
      ctx.arc(CX,CY,r,startA,endA,false);
      ctx.strokeStyle=col; ctx.lineWidth=lw; ctx.lineCap='round'; ctx.stroke();
    });
    // Center dot
    ctx.beginPath(); ctx.arc(CX,CY,5,0,Math.PI*2);
    ctx.fillStyle = P.centerDot; ctx.fill();

    // Node circles with platform mini-logos
    nodeAngles.forEach(n=>{
      const rad = n.a * Math.PI/180;
      const nx = CX + NR * Math.cos(rad);
      const ny = CY + NR * Math.sin(rad);

      // Soft halo in platform color
      ctx.beginPath(); ctx.arc(nx,ny,28,0,Math.PI*2);
      const hg = ctx.createRadialGradient(nx,ny,0,nx,ny,28);
      hg.addColorStop(0, hexToRgba(n.color, 0.35));
      hg.addColorStop(1, hexToRgba(n.color, 0));
      ctx.fillStyle=hg; ctx.fill();

      // Pod
      ctx.beginPath(); ctx.arc(nx,ny,22,0,Math.PI*2);
      ctx.fillStyle = P.podBg; ctx.fill();
      ctx.strokeStyle = hexToRgba(n.color, 0.85); ctx.lineWidth=1.4; ctx.stroke();

      // Platform icon drawn inside pod, in platform color
      ctx.save(); ctx.translate(nx,ny);
      ctx.strokeStyle = '#FFFFFF';
      ctx.fillStyle = n.color;
      ctx.lineWidth = 1.5; ctx.lineCap='round'; ctx.lineJoin='round';
      drawPlatformIcon(ctx, n.icon, n.color);
      ctx.restore();
    });

    t++;
    requestAnimationFrame(draw);
  }
  draw();
})();
</script>
</body>
</html>
