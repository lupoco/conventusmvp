      </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/cv-core.js"></script>
<script src="/assets/i18n.js"></script>
<script>
(function(){
  "use strict";
  var SB_URL=window.__CV_SUPABASE_URL;
  function sb(){ if(window.__cvSb) return window.__cvSb; if(!window.supabase) return null;
    return window.cvClient(); }
  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function initials(s){ s=String(s||'').trim(); if(!s) return '?';
    var p=s.replace(/^(Dr|Maj|Col|Gen|Lt|Capt|Mr|Ms|Mrs|Prof)\.?\s+/i,'').split(/[\s@._-]+/).filter(Boolean);
    return ((p[0]?p[0][0]:s[0])+(p[1]?p[1][0]:'')).toUpperCase(); }
  function ago(t){ if(!t) return ''; var d=(Date.now()-new Date(t).getTime())/1000;
    if(d<60) return 'now'; if(d<3600) return Math.floor(d/60)+'m'; if(d<86400) return Math.floor(d/3600)+'h';
    if(d<604800) return Math.floor(d/86400)+'d'; return Math.floor(d/604800)+'w'; }
  function clock(t){ if(!t) return ''; try{ return new Date(t).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}); }catch(e){ return ''; } }
  function qp(k){ try{ return new URLSearchParams(location.search).get(k); }catch(e){ return null; } }

  function T(k){ return (window.T?window.T(k):null)||k; }
  var current=null, curPerson=null, curMsgs=null; // open thread state

  function threadRow(t){
    return '<div class="thread'+(t.person_id===current?' active':'')+'" data-open-thread="'+esc(t.person_id)+'">'+
      '<div class="av">'+esc(initials(t.name))+'</div>'+
      '<div class="info"><div class="r1"><b>'+esc(t.name)+'</b><span class="t">'+esc(ago(t.last_at))+'</span></div>'+
        '<div class="prev'+(t.unread?' unread':'')+'">'+(t.from_me?esc(T('cn.msg.you')):'')+esc(t.last||'')+'</div></div>'+
      (t.unread?'<div class="dot" title="'+t.unread+'"></div>':'')+'</div>';
  }

  async function loadThreads(){
    var s=sb(), box=$('threads');
    if(!s){ box.innerHTML='<div class="empty">'+esc(T('cn.pf.signin'))+'</div>'; return; }
    try{ var r=await s.rpc('connectus_threads'); var rows=(r&&r.data)||[];
      box.innerHTML=rows.length?rows.map(threadRow).join(''):'<div class="empty">'+esc(T('cn.msg.no_threads'))+'</div>';
    }catch(e){ box.innerHTML='<div class="empty">'+esc(T('cn.msg.unavail'))+'</div>'; }
  }

  function renderConv(person, msgs){
    current=person.id; curPerson=person; curMsgs=msgs;
    $('shell').setAttribute('data-open','1');
    var head='<div class="ch"><a href="/platforms/connectus/network.html" style="margin-left:0;color:var(--muted)" title="Back" data-back>‹</a>'+
      '<div class="av">'+esc(initials(person.name))+'</div><div><b>'+esc(person.name)+'</b><span>'+esc(person.tagline||'')+'</span></div>'+
      '<a href="/platforms/connectus/profile.html?id='+esc(person.id)+'">'+esc(T('cn.msg.view'))+'</a></div>';
    var body='<div class="msg-body" id="mbody">'+(msgs.length?msgs.map(function(m){
      return '<div class="bubble '+(m.from_me?'me':'them')+'">'+esc(m.body)+'<div class="tm">'+esc(clock(m.created_at))+'</div></div>';
    }).join(''):'<div class="msg-none">'+esc(T('cn.msg.none'))+'</div>')+'</div>';
    var comp='<div class="msg-compose"><textarea id="mInput" rows="1" placeholder="'+esc(T('cn.msg.write_ph'))+'"></textarea>'+
      '<button class="btn-post" id="mSend" data-to="'+esc(person.id)+'">'+esc(T('cn.msg.send'))+'</button></div>';
    $('conv').innerHTML=head+body+comp;
    var mb=$('mbody'); if(mb) mb.scrollTop=mb.scrollHeight;
    document.querySelectorAll('.thread').forEach(function(el){
      el.classList.toggle('active', el.getAttribute('data-open-thread')===current); });
  }

  async function openThread(pid){
    var s=sb(); if(!s) return;
    $('conv').innerHTML='<div class="msg-none">'+esc(T('cn.msg.loading'))+'</div>';
    try{ var r=await s.rpc('connectus_thread',{p_with:pid,p_limit:200}); var d=(r&&r.data)||{};
      if(d&&d.ok&&d.person){ renderConv(d.person, d.messages||[]); loadThreads(); }
      else $('conv').innerHTML='<div class="msg-none">'+esc(T('cn.msg.cant_open'))+'</div>';
    }catch(e){ $('conv').innerHTML='<div class="msg-none">'+esc(T('cn.msg.unavail'))+'</div>'; }
  }

  async function init(){
    var s=sb();
    if(s){ try{ var se=await s.auth.getSession();
      if(!se||!se.data||!se.data.session){ location.href='/login.html?next='+encodeURIComponent(location.pathname+location.search); return; }
    }catch(e){} }
    await loadThreads();
    var to=qp('to'); if(to) openThread(to);
  }

  document.addEventListener('click', async function(e){
    var s=sb();
    var t=e.target.closest('[data-open-thread]');
    if(t){ openThread(t.getAttribute('data-open-thread')); return; }
    if(e.target.closest('[data-back]')){ e.preventDefault(); $('shell').setAttribute('data-open','0'); current=null;
      document.querySelectorAll('.thread').forEach(function(el){ el.classList.remove('active'); }); return; }
    var snd=e.target.closest('#mSend');
    if(snd){ if(!s) return; var inp=$('mInput'), body=(inp.value||'').trim(); if(!body) return;
      var to=snd.getAttribute('data-to'); snd.disabled=true;
      try{ var r=await s.rpc('connectus_send_message',{p_to:to,p_body:body});
        if(r&&r.data&&r.data.ok!==false){ inp.value=''; await openThread(to); } }catch(err){}
      snd.disabled=false; var i2=$('mInput'); if(i2) i2.focus(); return; }
  });
  document.addEventListener('keydown', function(e){
    if(e.target && e.target.id==='mInput' && e.key==='Enter' && !e.shiftKey){ e.preventDefault();
      var b=$('mSend'); if(b) b.click(); }
  });
  var ns=$('navSearch'); if(ns) ns.addEventListener('keydown', function(e){ if(e.key==='Enter'){ var q=(this.value||'').trim();
    location.href='/platforms/connectus/network.html'+(q?('?q='+encodeURIComponent(q)):''); } });

  if(window.CNApp) window.CNApp.onLang(function(){ loadThreads(); if(curPerson) renderConv(curPerson, curMsgs||[]); });
  if(document.readyState!=='loading') init(); else document.addEventListener('DOMContentLoaded', init);
})();
</script>
