<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/cv-core.js"></script>
<script src="/assets/i18n.js"></script>
<script>
(function(){
  "use strict";
  var SB_URL=window.__CV_SUPABASE_URL;
  function sb(){ if(window.__cvSb) return window.__cvSb; if(!window.supabase) return null;
    return window.cvClient(); }
  function $(id){ return document.getElementById(id); }
  function T(k){ return (window.T?window.T(k):null)||k; }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function initials(s){ s=String(s||'').trim(); if(!s) return '?';
    var p=s.replace(/^(Dr|Maj|Col|Gen|Lt|Capt|Mr|Ms|Mrs|Prof)\.?\s+/i,'').split(/[\s@._-]+/).filter(Boolean);
    return ((p[0]?p[0][0]:s[0])+(p[1]?p[1][0]:'')).toUpperCase(); }
  function ago(t){ if(!t) return ''; var d=(Date.now()-new Date(t).getTime())/1000;
    if(d<60) return 'now'; if(d<3600) return Math.floor(d/60)+'m'; if(d<86400) return Math.floor(d/3600)+'h';
    if(d<604800) return Math.floor(d/86400)+'d'; return Math.floor(d/604800)+'w'; }

  var items=[];

  function row(it){
    return '<a class="al-item'+(it.unread?' unread':'')+'" href="'+esc(it.href)+'">'+
      '<div class="ic k-'+it.kind+'">'+esc(initials(it.name))+'</div>'+
      '<div class="info"><div class="tx"><b>'+esc(it.name)+'</b> '+esc(it.text)+'</div>'+
        (it.at?'<div class="tm">'+esc(ago(it.at))+'</div>':'')+'</div>'+
      '<span class="go">'+esc(it.go)+'</span></a>';
  }

  function paint(){
    var box=$('alList');
    if(!items.length){ box.innerHTML='<div class="empty" style="padding:24px" data-i="cn.al.empty">'+esc(T('cn.al.empty'))+'</div>'; return; }
    box.innerHTML=items.map(row).join('');
  }

  async function load(){
    var s=sb(); if(!s){ $('alList').innerHTML='<div class="empty" style="padding:24px">'+esc(T('cn.pf.signin'))+'</div>'; return; }
    var out=[], myId=null;
    try{ var mp=await s.rpc('connectus_my_profile'); myId=(mp&&mp.data&&mp.data.id)||null; }catch(e){}
    // invitations
    try{ var c=await s.rpc('connectus_connections'); var inc=(c&&c.data&&c.data.incoming)||[];
      inc.forEach(function(x){ out.push({kind:'inv',name:x.name||'Member',text:T('cn.al.invite'),
        at:null, sort:Date.now(), unread:true, go:T('cn.al.review'), href:'/platforms/connectus/network.html#invitations'}); });
    }catch(e){}
    // unread messages
    try{ var t=await s.rpc('connectus_threads'); var th=(t&&t.data)||[];
      th.filter(function(x){ return x.unread>0; }).forEach(function(x){
        out.push({kind:'msg',name:x.name||'Member',text:T('cn.al.message'),at:x.last_at,
          sort:x.last_at?new Date(x.last_at).getTime():0, unread:true,
          go:T('cn.al.open'), href:'/platforms/connectus/messages.html?to='+encodeURIComponent(x.person_id)}); });
    }catch(e){}
    // recent group posts (others')
    try{ var f=await s.rpc('connectus_feed',{p_limit:20}); var rows=(f&&f.data)||[];
      rows.filter(function(p){ return p.author_id && p.author_id!==myId; }).slice(0,8).forEach(function(p){
        out.push({kind:'post',name:p.author||'Member',text:T('cn.al.post')+' · '+(p.group_name||''),at:p.created_at,
          sort:p.created_at?new Date(p.created_at).getTime():0, unread:false,
          go:T('cn.al.open'), href:'/platforms/connectus/app.html'}); });
    }catch(e){}
    out.sort(function(a,b){ return (b.sort||0)-(a.sort||0); });
    items=out; paint();
    // badge (invites + unread msgs)
    var n=out.filter(function(x){ return x.unread; }).length;
    var b=$('alertsBadge'); if(b){ if(n>0){ b.textContent=n>9?'9+':n; b.style.display=''; } else b.style.display='none'; }
  }

  async function init(){
    var s=sb();
    if(s){ try{ var se=await s.auth.getSession();
      if(!se||!se.data||!se.data.session){ location.href='/login.html?next='+encodeURIComponent(location.pathname); return; }
    }catch(e){} }
    load();
  }
  var ns=$('navSearch'); if(ns) ns.addEventListener('keydown', function(e){ if(e.key==='Enter'){ var q=(this.value||'').trim();
    location.href='/platforms/connectus/network.html'+(q?('?q='+encodeURIComponent(q)):''); } });

  if(window.CNApp) window.CNApp.onLang(function(){ paint(); });
  if(document.readyState!=='loading') init(); else document.addEventListener('DOMContentLoaded', init);
})();
</script>
<script src="/assets/connectus-app.js"></script>
