<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Register · Conventus</title>
<!-- S1: consolidated into register-conventus.html (canonical PAF registration). -->
<script src="/assets/js/cv-config.js"></script>
<script>location.replace('/platforms/conventus/register-conventus.html' + (location.search || ''));</script>
<meta http-equiv="refresh" content="0;url=/platforms/conventus/register-conventus.html" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/cv-core.js"></script>
<script>
  const _sb = window.cvClient();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet" />
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{--gold:#C9973A;--gold-dim:rgba(201,151,58,.12);--r:14px;--ease:.2s ease}
  [data-resolved-theme="dark"]{--bg:#060810;--panel:#0A0D1A;--surface:rgba(255,255,255,.04);--border:rgba(255,255,255,.08);--border-accent:rgba(201,151,58,.2);--text:#EEE9E2;--sub:#8B95A8;--muted:#525C6B;--field:#0d1120;--ok:#4ADE80;--err:#F87171}
  [data-resolved-theme="light"]{--bg:#F2F1EE;--panel:#FFFFFF;--surface:rgba(0,0,0,.025);--border:rgba(0,0,0,.09);--border-accent:rgba(201,151,58,.28);--text:#111318;--sub:#555E6E;--muted:#9CA3AF;--field:#FBFAF8;--ok:#16A34A;--err:#DC2626}
  body{min-height:100vh;background:var(--bg);color:var(--text);font-family:'Space Grotesk',system-ui,sans-serif;transition:background var(--ease),color var(--ease)}
  header{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(1rem,4vw,2rem);border-bottom:1px solid var(--border-accent);background:var(--panel)}
  .brand{display:flex;align-items:center;gap:.6rem}
  .brand svg{width:28px;height:28px}
  .brand b{font-family:'Outfit',sans-serif;font-size:.78rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase}
  .brand small{display:block;font-size:.48rem;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}
  #whoami{font-size:.72rem;color:var(--sub)}
  #whoami a{color:var(--gold);text-decoration:none;cursor:pointer}
  main{max-width:560px;margin:0 auto;padding:2.2rem 1.3rem 4rem}
  /* event header */
  .ev-head{border:1px solid var(--border-accent);background:var(--panel);border-radius:16px;padding:1.4rem 1.5rem;margin-bottom:1.4rem}
  .ev-head .eyebrow{font-size:.62rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-bottom:.5rem}
  .ev-head h1{font-family:'Outfit',sans-serif;font-size:1.35rem;font-weight:800;letter-spacing:-.02em;line-height:1.15;margin-bottom:.5rem}
  .ev-head .meta{font-size:.78rem;color:var(--sub);line-height:1.6}
  .ev-head .desc{font-size:.78rem;color:var(--muted);margin-top:.6rem;line-height:1.6}
  .ev-head .prog-link{display:inline-flex;align-items:center;gap:6px;margin-top:.85rem;padding:.42rem .95rem;border:1px solid var(--gold);border-radius:100px;color:var(--gold);font:600 .74rem 'Space Grotesk';text-decoration:none;transition:all .2s}
  .ev-head .prog-link:hover{background:var(--gold);color:#0b0b0b}
  /* card */
  .card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:clamp(1.3rem,3vw,1.8rem)}
  .card h2{font-family:'Outfit',sans-serif;font-size:1.05rem;font-weight:800;margin-bottom:.3rem}
  .card .hint{font-size:.78rem;color:var(--sub);margin-bottom:1.3rem}
  /* tabs */
  .tabs{display:flex;gap:.4rem;background:var(--surface);border:1px solid var(--border);border-radius:100px;padding:.25rem;margin-bottom:1.3rem}
  .tabs button{flex:1;padding:.5rem;border:none;background:transparent;border-radius:100px;color:var(--sub);font:600 .78rem 'Space Grotesk';cursor:pointer;transition:background var(--ease),color var(--ease)}
  .tabs button.active{background:var(--gold);color:#0b0b0b}
  /* fields */
  .field{margin-bottom:1rem}
  .field label{display:block;font-size:.72rem;font-weight:600;color:var(--sub);margin-bottom:.35rem}
  .field label .req{color:var(--gold)}
  .field input,.field select,.field textarea{width:100%;background:var(--field);border:1px solid var(--border);border-radius:10px;padding:.68rem .8rem;color:var(--text);font:400 .86rem 'Space Grotesk';transition:border-color var(--ease)}
  .field textarea{min-height:70px;resize:vertical}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--gold)}
  .field input:read-only{background:var(--surface);color:var(--sub);cursor:default}
  .verified{font-size:.66rem;color:var(--ok);margin-top:.3rem;display:flex;align-items:center;gap:.3rem}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
  .btn{width:100%;padding:.82rem;border:none;border-radius:11px;background:var(--gold);color:#0b0b0b;font:700 .86rem 'Space Grotesk';cursor:pointer;transition:opacity var(--ease),transform .15s;margin-top:.3rem}
  .btn:hover{opacity:.92;transform:translateY(-1px)}
  .btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
  .msg{font-size:.78rem;padding:.7rem .9rem;border-radius:10px;margin-top:1rem;display:none;line-height:1.5}
  .msg.err{display:block;background:rgba(220,38,38,.1);border:1px solid rgba(220,38,38,.3);color:var(--err)}
  .msg.ok{display:block;background:rgba(74,222,128,.08);border:1px solid rgba(74,222,128,.3);color:var(--ok)}
  /* state screens */
  .state{text-align:center;padding:.5rem 0}
  .state .ic{width:52px;height:52px;border-radius:50%;background:var(--gold-dim);border:1px solid var(--border-accent);display:grid;place-items:center;margin:0 auto 1rem;color:var(--gold)}
  .state h2{font-family:'Outfit',sans-serif;font-size:1.15rem;margin-bottom:.5rem}
  .state p{font-size:.82rem;color:var(--sub);line-height:1.6;max-width:38ch;margin:0 auto}
  .state p b{color:var(--text)}
  .status-pill{display:inline-block;margin-top:.9rem;font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:.3rem .8rem;border-radius:100px;border:1px solid var(--border-accent);color:var(--gold);background:var(--gold-dim)}
  .center-note{text-align:center;font-size:.72rem;color:var(--muted);margin-top:1rem}
  .center-note a{color:var(--gold);cursor:pointer;text-decoration:none}
  @media(max-width:440px){.row2{grid-template-columns:1fr}}
</style>
<script src="cv-skin.js"></script>
</head>
<body>
<header>
  <div class="brand">
    <svg viewBox="0 0 56 56" fill="none"><path d="M47 21A21 21 0 1 0 47 35" stroke="#1C3060" stroke-width="3.5" stroke-linecap="round"/><path d="M39 23A13 13 0 1 0 39 33" stroke="var(--gold)" stroke-width="2.2" stroke-linecap="round"/><circle cx="28" cy="28" r="3" fill="#1C3060"/></svg>
    <span><b>Conventus</b><small>Event Registration</small></span>
  </div>
  <div id="whoami"></div>
</header>

<main>
  <div id="evHead"></div>
  <div id="panel" class="card"><div class="state"><p>Loading…</p></div></div>
</main>

<script>
  // theme
  (function(){var t=localStorage.getItem('cv-theme')||'system';function r(x){return x==='system'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):x;}document.documentElement.setAttribute('data-resolved-theme',r(t));})();

  const $ = id => document.getElementById(id);
  const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const params = new URLSearchParams(location.search);
  const CODE = params.get('e');
  let EVENT = null;

  const ICON_MAIL = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>';
  const ICON_CHECK = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M20 6L9 17l-5-5"/></svg>';

  function evHeader(e){
    const when=[e.start_date,e.end_date].filter(Boolean).join(' → ')||'Date to be confirmed';
    $('evHead').innerHTML = `<div class="ev-head">
      <div class="eyebrow">You're registering for</div>
      <h1>${esc(e.title)}</h1>
      <div class="meta">${esc(when)}${e.location?' · '+esc(e.location):''}${e.host_org?'<br>Hosted by '+esc(e.host_org):''}</div>
      ${e.description?`<div class="desc">${esc(e.description)}</div>`:''}
      <a class="prog-link" href="programme.html?e=${encodeURIComponent(e.code)}" target="_blank" rel="noopener">📋 View programme →</a>
    </div>`;
  }

  async function init(){
    if(!CODE){ return fail('This registration link is invalid.', 'No event code was provided.'); }
    // fetch event (public read allowed for open events)
    const { data:ev, error } = await _sb.from('conventus_managed_events').select('*').eq('code', CODE).maybeSingle();
    if(error){ return fail('Something went wrong.', error.message); }
    if(!ev){ return fail('Registration unavailable.', 'This event link is closed or does not exist.'); }
    EVENT = ev; evHeader(ev);
    if(ev.published===false){ return fail('Registration unavailable.', 'This event is not open yet.'); }
    if(!ev.registration_open){ return stdGate(ev); }
    route();
  }

function icsHref(ev){
    function dd(x,plus){var t=new Date(String(x).slice(0,10)+'T00:00:00Z');if(plus)t.setUTCDate(t.getUTCDate()+1);return t.toISOString().slice(0,10).replace(/-/g,'');}
    if(!ev.start_date)return null;
    var L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Conventity//EN','BEGIN:VEVENT',
      'UID:cv-'+ev.id+'@conventity.org',
      'DTSTART;VALUE=DATE:'+dd(ev.start_date),
      'DTEND;VALUE=DATE:'+dd(ev.end_date||ev.start_date,true),
      'SUMMARY:'+String(ev.title||'').replace(/[,;\n]/g,' '),
      'LOCATION:'+String(([ev.city,ev.country].filter(Boolean).join(', '))||ev.location||'').replace(/[,;\n]/g,' '),
      'END:VEVENT','END:VCALENDAR'];
    return 'data:text/calendar;charset=utf-8,'+encodeURIComponent(L.join('\r\n'));
  }
  function stdGate(ev){
    var ics=icsHref(ev);
    $('panel').innerHTML = `<div class="state" style="text-align:center;padding:1.4rem 0">
      <div style="font-size:.62rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-bottom:.5rem">📅 SAVE THE DATE</div>
      <p style="line-height:1.7;margin-bottom:1rem">Registration opens with the <b>invitation stage</b>.<br>Add the event to your calendar now — details and registration will follow.</p>
      ${ics?`<a class="btn" style="display:inline-block;width:auto;padding:.82rem 1.6rem;text-decoration:none" href="${ics}" download="${esc(ev.code||'event')}.ics">📅 Add to Calendar</a>`:''}
      <div style="margin-top:1rem"><a class="prog-link" href="go-and-test.html">← Browse events</a></div>
    </div>`;
  }
  async function route(){
    const { data:{ session } } = await _sb.auth.getSession();
    if(session){ showWho(session.user); infoForm(session.user); }
    else { $('whoami').innerHTML=''; authPanel('register'); }
  }

  function showWho(user){
    const m=user.user_metadata||{}; const name=m.first_name||user.email.split('@')[0];
    $('whoami').innerHTML = `${esc(name)} · <a id="signout">Sign out</a>`;
    $('signout').onclick = async ()=>{ await _sb.auth.signOut(); location.reload(); };
  }

  function fail(title, sub){
    $('panel').innerHTML = `<div class="state"><div class="ic">!</div><h2>${esc(title)}</h2><p>${esc(sub)}</p></div>`;
  }

  // ---------- AUTH (register / sign in) ----------
  function authPanel(tab){
    $('panel').innerHTML = `
      <h2>Register to apply</h2>
      <div class="hint">Create an account (or sign in) to submit your application. We verify your email for security.</div>
      <div class="tabs">
        <button id="tabReg" class="${tab==='register'?'active':''}">Register</button>
        <button id="tabIn" class="${tab==='signin'?'active':''}">Sign in</button>
      </div>
      <div id="authBody"></div>
      <div class="msg" id="authMsg"></div>`;
    $('tabReg').onclick=()=>authPanel('register');
    $('tabIn').onclick=()=>authPanel('signin');
    $('authBody').innerHTML = tab==='register' ? regForm() : signinForm();
    if(tab==='register') $('doReg').onclick=doRegister; else $('doIn').onclick=doSignin;
  }
  function regForm(){
    return `
      <div class="row2">
        <div class="field"><label>First name <span class="req">*</span></label><input id="fn" type="text" autocomplete="given-name"></div>
        <div class="field"><label>Last name <span class="req">*</span></label><input id="ln" type="text" autocomplete="family-name"></div>
      </div>
      <div class="field"><label>Email <span class="req">*</span></label><input id="em" type="email" autocomplete="email"></div>
      <div class="field"><label>Password <span class="req">*</span></label><input id="pw" type="password" autocomplete="new-password" placeholder="At least 6 characters"></div>
      <button class="btn" id="doReg">Create account</button>`;
  }
  function signinForm(){
    return `
      <div class="field"><label>Email <span class="req">*</span></label><input id="em" type="email" autocomplete="email"></div>
      <div class="field"><label>Password <span class="req">*</span></label><input id="pw" type="password" autocomplete="current-password"></div>
      <button class="btn" id="doIn">Sign in</button>`;
  }
  function authErr(m){ const e=$('authMsg'); e.className='msg err'; e.textContent=m; }

  async function doRegister(){
    const fn=$('fn').value.trim(), ln=$('ln').value.trim(), em=$('em').value.trim(), pw=$('pw').value;
    if(!fn||!ln||!em||!pw) return authErr('Please fill in all fields.');
    if(pw.length<6) return authErr('Password must be at least 6 characters.');
    $('doReg').disabled=true; $('doReg').textContent='Creating…';
    const { data, error } = await _sb.auth.signUp({
      email:em, password:pw,
      options:{ data:{ first_name:fn, last_name:ln }, emailRedirectTo: location.href }
    });
    $('doReg').disabled=false; $('doReg').textContent='Create account';
    if(error) return authErr(error.message);
    if(data.session){ // email confirmation disabled → straight in
      showWho(data.session.user); infoForm(data.session.user);
    } else {
      verifySent(em);
    }
  }
  async function doSignin(){
    const em=$('em').value.trim(), pw=$('pw').value;
    if(!em||!pw) return authErr('Please enter your email and password.');
    $('doIn').disabled=true; $('doIn').textContent='Signing in…';
    const { error } = await _sb.auth.signInWithPassword({ email:em, password:pw });
    $('doIn').disabled=false; $('doIn').textContent='Sign in';
    if(error) return authErr(error.message.includes('confirm') ? 'Please verify your email first — check your inbox.' : error.message);
    location.reload();
  }
  function verifySent(email){
    $('whoami').innerHTML='';
    $('panel').innerHTML = `<div class="state">
      <div class="ic">${ICON_MAIL}</div>
      <h2>Verify your email</h2>
      <p>We've sent a verification link to <b>${esc(email)}</b>. Click it to confirm your account, then you'll come right back here to complete your application.</p>
      <div class="center-note">Wrong email? <a id="back">Go back</a></div>
    </div>`;
    $('back').onclick=()=>authPanel('register');
  }

  // ---------- INFO FORM (verified user) ----------
  async function infoForm(user){
    const m=user.user_metadata||{};
    const fn=m.first_name||'', ln=m.last_name||'', email=user.email||'';
    // already applied?
    const { data:existing } = await _sb.from('conventus_registrations')
      .select('status').eq('event_id', EVENT.id).eq('user_id', user.id).maybeSingle();
    if(existing){ return applied(existing.status); }

    $('panel').innerHTML = `
      <h2>Your details</h2>
      <div class="hint">Your name and email come from your verified account. Complete the rest and submit.</div>
      <div class="row2">
        <div class="field"><label>First name</label><input type="text" value="${esc(fn)}" readonly></div>
        <div class="field"><label>Last name</label><input type="text" value="${esc(ln)}" readonly></div>
      </div>
      <div class="field"><label>Email</label><input type="text" value="${esc(email)}" readonly>
        <div class="verified">${ICON_CHECK.replace('width="24" height="24"','width="12" height="12"')} Verified</div></div>
      <div class="row2">
        <div class="field"><label>Institution / organisation</label><input id="inst" type="text" maxlength="140"></div>
        <div class="field"><label>Country</label><input id="cty" type="text" maxlength="80"></div>
      </div>
      <div class="row2">
        <div class="field"><label>Rank / title</label><input id="rk" type="text" maxlength="100" placeholder="e.g. Director, Col., Advisor"></div>
        <div class="field"><label>Attending as</label>
          <select id="role">
            <option value="">Select…</option>
            <option>Delegate</option><option>Speaker</option><option>Observer</option>
            <option>Media / Press</option><option>Support staff</option><option>Other</option>
          </select></div>
      </div>
      <div class="field"><label>Note to organiser (optional)</label><textarea id="note" maxlength="400" placeholder="Anything the organiser should know."></textarea></div>
      <button class="btn" id="doApply">Submit application</button>
      <div class="msg" id="applyMsg"></div>`;
    $('doApply').onclick=()=>submitApplication(user, fn, ln, email);
  }

  async function submitApplication(user, fn, ln, email){
    $('doApply').disabled=true; $('doApply').textContent='Submitting…';
    const row={
      event_id:EVENT.id, user_id:user.id,
      first_name:fn, last_name:ln, email,
      institution:$('inst').value.trim()||null,
      country:$('cty').value.trim()||null,
      rank_title:$('rk').value.trim()||null,
      role:$('role').value||null,
      note:$('note').value.trim()||null,
      status:'pending'
    };
    const { error } = await _sb.from('conventus_registrations').insert(row);
    $('doApply').disabled=false; $('doApply').textContent='Submit application';
    if(error){
      if(error.code==='23505') return applied('pending'); // already applied (race)
      const e=$('applyMsg'); e.className='msg err'; e.textContent=error.message; return;
    }
    applied('pending', true);
  }

  function applied(status, justNow){
    const label = {pending:'Pending review', approved:'Approved', rejected:'Not approved'}[status] || status;
    $('panel').innerHTML = `<div class="state">
      <div class="ic">${ICON_CHECK}</div>
      <h2>${justNow?'Application submitted':"You've already applied"}</h2>
      <p>${justNow?'Thanks — the organiser will review your application.':'Your application for this event is on file.'}</p>
      <div class="status-pill">${esc(label)}</div>
    </div>`;
  }

  // handle the return from the email verification link (session becomes available)
  _sb.auth.onAuthStateChange((event)=>{ if(event==='SIGNED_IN' && EVENT){ route(); } });

  init();
</script>
</body>
</html>
