<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Go &amp; Test · Conventus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="/assets/js/cv-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/cv-core.js"></script>
<style>
:root{
  --pf:#004990;--pf-glow:rgba(0,73,144,.10);
  --bg:#F5F2EC;--paper:#fff;--paper2:#FAF7F1;
  --ink:#0E2148;--ink2:#1F2D55;--muted:#5A6486;
  --line:#E5DFD2;--line2:#D6CFBE;--ok:#1F9E50;--gold:#B8892B;
}
html[data-theme="dark"]{
  --pf:#4B92DB;--pf-glow:rgba(75,146,219,.12);
  --bg:#0B1428;--paper:#101C36;--paper2:#0E1A32;
  --ink:#EEF1F7;--ink2:#AAB4C8;--muted:#7F8AA2;
  --line:#243456;--line2:#2A3A5E;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Manrope',system-ui,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding:0 24px}
header{border-bottom:1px solid var(--line);background:var(--paper);position:sticky;top:0;z-index:5}
.hd{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 0}
.brand{font-family:'Instrument Serif',Georgia,serif;font-size:27px;color:var(--ink);text-decoration:none}
.brand em{font-style:italic;color:var(--pf)}
.actions{display:flex;align-items:center;gap:10px}
.tag{font:600 10px/1 'JetBrains Mono',monospace;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:100px;padding:6px 11px}
.btn{display:inline-flex;align-items:center;gap:7px;font:700 13px 'Manrope';text-decoration:none;border-radius:100px;padding:9px 16px;cursor:pointer;border:1px solid var(--line);background:var(--paper);color:var(--ink);transition:.18s}
.btn:hover{border-color:var(--pf);color:var(--pf)}
.btn-primary{background:var(--pf);border-color:var(--pf);color:#fff}
.btn-primary:hover{filter:brightness(1.08);color:#fff}
.icon-btn{width:38px;height:38px;display:flex;align-items:center;justify-content:center;border-radius:100px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;font-size:16px}
.hero{padding:46px 0 6px}
.hero .eye{font:600 11px 'JetBrains Mono',monospace;letter-spacing:.2em;text-transform:uppercase;color:var(--pf);margin-bottom:12px}
.hero h1{font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:46px;line-height:1.04;margin:0 0 10px;letter-spacing:-.01em}
.hero h1 em{font-style:italic;color:var(--pf)}
.hero p{color:var(--muted);font-size:15px;max-width:580px;margin:0;line-height:1.5}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px;padding:34px 0 64px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:11px;transition:.18s}
.card:hover{border-color:var(--line2);box-shadow:0 12px 34px rgba(14,33,72,.07)}
.card .code{font:600 10px 'JetBrains Mono',monospace;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}
.card h3{font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:25px;line-height:1.1;margin:0}
.card .sub{color:var(--ink2);font-size:13.5px;line-height:1.4}
.meta{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.meta b{color:var(--ink2);font-weight:600}
.foot{margin-top:auto;display:flex;align-items:center;gap:9px;padding-top:6px;flex-wrap:wrap}
.pill{font:600 10px 'JetBrains Mono',monospace;letter-spacing:.1em;text-transform:uppercase;padding:8px 13px;border-radius:100px;border:1px solid var(--gold);color:var(--gold)}
.state{padding:64px 0;text-align:center;color:var(--muted);font-size:14px}
.spin{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--pf);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 14px}
@keyframes sp{to{transform:rotate(360deg)}}
@media(max-width:560px){.hero h1{font-size:34px}}
</style>
</head>
<body>
<header><div class="wrap hd">
  <a class="brand" href="index.html">Go <em>&amp; Test</em></a>
  <div class="actions">
    <span class="tag">Conventus MVP</span>
    <a class="btn" href="my-events.html">My Events</a>
    <a class="btn" href="event-studio.html">Organiser Studio</a>
    <button class="icon-btn" id="themeBtn" title="Theme">◐</button>
  </div>
</div></header>

<main class="wrap">
  <section class="hero">
    <div class="eye">Register · Test · Track</div>
    <h1>Open <em>events</em> to register</h1>
    <p>Pick an event and register — your registration goes straight to the organizer. Follow its status anytime in My Events.</p>
  </section>
  <section id="grid" class="grid">
    <div class="state" style="grid-column:1/-1"><div class="spin"></div>Loading events…</div>
  </section>
</main>

<script>
const SB = window.cvClient();
window.__cvSb = SB;

const root=document.documentElement;
if(localStorage.getItem('cn-dark')==='1') root.setAttribute('data-theme','dark');
document.getElementById('themeBtn').onclick=function(){
  const dark=root.getAttribute('data-theme')==='dark';
  root.setAttribute('data-theme',dark?'light':'dark');
  localStorage.setItem('cn-dark',dark?'0':'1');
};

function fmt(d){ if(!d) return ''; const p=String(d).split('-'); return p.length===3 ? p[2]+'.'+p[1]+'.'+p[0] : String(d); }
function range(a,b){ a=fmt(a); b=fmt(b); if(a&&b&&a!==b) return a+' – '+b; return a||b||'Dates TBC'; }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

async function load(){
  const grid=document.getElementById('grid');
  try{
    const res = await SB.from('conventus_managed_events')
      .select('id,code,title,subtitle,summary,start_date,end_date,location,city,country,registration_open')
      .eq('published',true).order('start_date',{ascending:true,nullsFirst:false});
    if(res.error) throw res.error;
    const data=res.data||[];
    if(!data.length){ grid.innerHTML='<div class="state" style="grid-column:1/-1">No open events yet. Check back soon.</div>'; return; }
    grid.innerHTML = data.map(function(e){
      const loc = esc(e.location || [e.city,e.country].filter(Boolean).join(', '));
      const open = !!e.registration_open && !!e.code;
      const reg = open
        ? '<a class="btn btn-primary" href="register-conventus.html?e='+encodeURIComponent(e.code)+'">Register →</a>'
        : '<span class="pill">Registration soon</span>';
      const prog = e.code ? '<a class="btn" href="programme.html?e='+encodeURIComponent(e.code)+'">Programme</a>' : '';
      return '<article class="card">'
        + (e.code?'<div class="code">'+esc(e.code)+'</div>':'')
        + '<h3>'+esc(e.title||'Untitled event')+'</h3>'
        + (e.subtitle?'<div class="sub">'+esc(e.subtitle)+'</div>':'')
        + '<div class="meta"><span><b>'+range(e.start_date,e.end_date)+'</b></span>'
          + (loc?'<span>'+loc+'</span>':'')+'</div>'
        + '<div class="foot">'+reg+prog+'</div>'
      + '</article>';
    }).join('');
  }catch(err){
    grid.innerHTML='<div class="state" style="grid-column:1/-1">Could not load events.<br><small>'+esc(err.message||err)+'</small></div>';
  }
}
load();
</script>
</body>
</html>
