<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{--r:14px;--ease:.2s ease}
  [data-resolved-theme="dark"]{--gold:#4B92DB;--gold-dim:rgba(75,146,219,.12);--bg:#0B1428;--panel:#101C36;--surface:#0E1A32;--border:#243456;--border-accent:#2A3A5E;--text:#EEF1F7;--sub:#AAB4C8;--muted:#7F8AA2;--field:#0E1A32;--ok:#4ADE80;--err:#F87171}
  [data-resolved-theme="light"]{--gold:#004990;--gold-dim:rgba(0,73,144,.10);--bg:#F5F2EC;--panel:#FFFFFF;--surface:#FAF7F1;--border:#E5DFD2;--border-accent:#D6CFBE;--text:#0E2148;--sub:#1F2D55;--muted:#5A6486;--field:#FAF7F1;--ok:#1F9E50;--err:#DC2626}
  body{min-height:100vh;background:var(--bg);color:var(--text);font-family:'Manrope',system-ui,sans-serif;transition:background var(--ease),color var(--ease)}
  header{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(1rem,4vw,2rem);border-bottom:1px solid var(--border-accent);background:var(--panel)}
  .brand{display:flex;align-items:center;gap:.6rem}
  .brand svg{width:28px;height:28px}
  .brand b{font-family:'Instrument Serif',sans-serif;font-size:.78rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase}
  .brand small{display:block;font-size:.48rem;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}
  #whoami{font-size:.72rem;color:var(--sub)}
  #whoami a{color:var(--gold);text-decoration:none;cursor:pointer}
  main{max-width:560px;margin:0 auto;padding:2.2rem 1.3rem 4rem}
  /* event header */
  .ev-head{border:1px solid var(--border-accent);background:var(--panel);border-radius:16px;padding:1.4rem 1.5rem;margin-bottom:1.4rem}
  .ev-head .eyebrow{font-size:.62rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-bottom:.5rem}
  .ev-head h1{font-family:'Instrument Serif',sans-serif;font-size:1.35rem;font-weight:800;letter-spacing:-.02em;line-height:1.15;margin-bottom:.5rem}
  .ev-head .meta{font-size:.78rem;color:var(--sub);line-height:1.6}
  .ev-head .desc{font-size:.78rem;color:var(--muted);margin-top:.6rem;line-height:1.6}
  .ev-head .prog-link{display:inline-flex;align-items:center;gap:6px;margin-top:.85rem;padding:.42rem .95rem;border:1px solid var(--gold);border-radius:100px;color:var(--gold);font:600 .74rem 'Manrope';text-decoration:none;transition:all .2s}
  .ev-head .prog-link:hover{background:var(--gold);color:#fff}
  /* card */
  .card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:clamp(1.3rem,3vw,1.8rem)}
  .card h2{font-family:'Instrument Serif',sans-serif;font-size:1.05rem;font-weight:800;margin-bottom:.3rem}
  .card .hint{font-size:.78rem;color:var(--sub);margin-bottom:1.3rem}
  /* tabs */
  .tabs{display:flex;gap:.4rem;background:var(--surface);border:1px solid var(--border);border-radius:100px;padding:.25rem;margin-bottom:1.3rem}
  .tabs button{flex:1;padding:.5rem;border:none;background:transparent;border-radius:100px;color:var(--sub);font:600 .78rem 'Manrope';cursor:pointer;transition:background var(--ease),color var(--ease)}
  .tabs button.active{background:var(--gold);color:#fff}
  /* fields */
  .field{margin-bottom:1rem}
  .field label{display:block;font-size:.72rem;font-weight:600;color:var(--sub);margin-bottom:.35rem}
  .field label .req{color:var(--gold)}
  .field input,.field select,.field textarea{width:100%;background:var(--field);border:1px solid var(--border);border-radius:10px;padding:.68rem .8rem;color:var(--text);font:400 .86rem 'Manrope';transition:border-color var(--ease)}
  .field textarea{min-height:70px;resize:vertical}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--gold)}
  .field input:read-only{background:var(--surface);color:var(--sub);cursor:default}
  .verified{font-size:.66rem;color:var(--ok);margin-top:.3rem;display:flex;align-items:center;gap:.3rem}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
  .btn{width:100%;padding:.82rem;border:none;border-radius:11px;background:var(--gold);color:#fff;font:700 .86rem 'Manrope';cursor:pointer;transition:opacity var(--ease),transform .15s;margin-top:.3rem}
  .btn:hover{opacity:.92;transform:translateY(-1px)}
  .btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
  .msg{font-size:.78rem;padding:.7rem .9rem;border-radius:10px;margin-top:1rem;display:none;line-height:1.5}
  .msg.err{display:block;background:rgba(220,38,38,.1);border:1px solid rgba(220,38,38,.3);color:var(--err)}
  .msg.ok{display:block;background:rgba(74,222,128,.08);border:1px solid rgba(74,222,128,.3);color:var(--ok)}
  /* state screens */
  .state{text-align:center;padding:.5rem 0}
  .state .ic{width:52px;height:52px;border-radius:50%;background:var(--gold-dim);border:1px solid var(--border-accent);display:grid;place-items:center;margin:0 auto 1rem;color:var(--gold)}
  .state h2{font-family:'Instrument Serif',sans-serif;font-size:1.15rem;margin-bottom:.5rem}
  .state p{font-size:.82rem;color:var(--sub);line-height:1.6;max-width:38ch;margin:0 auto}
  .state p b{color:var(--text)}
  .status-pill{display:inline-block;margin-top:.9rem;font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:.3rem .8rem;border-radius:100px;border:1px solid var(--border-accent);color:var(--gold);background:var(--gold-dim)}
  .center-note{text-align:center;font-size:.72rem;color:var(--muted);margin-top:1rem}
  .center-note a{color:var(--gold);cursor:pointer;text-decoration:none}
  /* sihirbaz */
  .wz-top{margin-bottom:1.2rem}
  .wz-bar{height:4px;background:var(--surface);border:1px solid var(--border);border-radius:100px;overflow:hidden}
  .wz-bar i{display:block;height:100%;background:var(--gold);transition:width .25s ease}
  .wz-step{display:flex;justify-content:space-between;align-items:baseline;margin-top:.5rem}
  .wz-step b{font-size:.72rem;font-weight:700;color:var(--sub)}
  .wz-step span{font-family:'JetBrains Mono',monospace;font-size:.64rem;color:var(--muted)}
  .wz-nav{display:flex;gap:.6rem;margin-top:1.4rem}
  .wz-nav .btn{margin-top:0}
  .btn-ghost{padding:.82rem 1.1rem;border:1px solid var(--border-accent);border-radius:11px;background:transparent;color:var(--sub);font:600 .86rem 'Manrope';cursor:pointer;transition:all var(--ease)}
  .btn-ghost:hover{border-color:var(--gold);color:var(--gold)}
  /* secim kartlari */
  .pick{display:block;border:1px solid var(--border);background:var(--surface);border-radius:12px;padding:.9rem 1rem;margin-bottom:.7rem;cursor:pointer;transition:border-color var(--ease),background var(--ease)}
  .pick:hover{border-color:var(--border-accent)}
  .pick.on{border-color:var(--gold);background:var(--gold-dim)}
  .pick .t{display:flex;align-items:center;gap:.6rem;font-weight:700;font-size:.86rem}
  .pick .t input{width:16px;height:16px;accent-color:var(--gold);flex:none;pointer-events:none}
  .pick:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .pick .n{font-size:.74rem;color:var(--muted);line-height:1.55;margin-top:.4rem;padding-left:1.6rem}
  .pick .when{font-family:'JetBrains Mono',monospace;font-size:.66rem;color:var(--sub);margin-top:.35rem;padding-left:1.6rem}
  .pick .ext{font-size:.72rem;color:var(--gold);margin-top:.4rem;padding-left:1.6rem;font-weight:600}
  /* onaylar */
  .cons{border:1px solid var(--border);background:var(--surface);border-radius:12px;padding:1rem;margin-bottom:.8rem}
  .cons p{font-size:.8rem;line-height:1.6;color:var(--text)}
  .cons .yn{display:flex;gap:1.2rem;margin-top:.7rem}
  .cons .yn label{display:flex;align-items:center;gap:.4rem;font-size:.8rem;font-weight:600;color:var(--sub);cursor:pointer}
  .cons .yn input{accent-color:var(--gold)}
  .cons .warn{font-size:.72rem;color:var(--muted);margin-top:.5rem;line-height:1.5}
  /* ozet */
  .rev{border:1px solid var(--border);background:var(--surface);border-radius:12px;padding:1rem;margin-bottom:.8rem}
  .rev .h{display:flex;justify-content:space-between;align-items:center;margin-bottom:.6rem}
  .rev .h b{font-size:.78rem;font-weight:700}
  .rev .h a{font-size:.72rem;color:var(--gold);cursor:pointer;text-decoration:none;font-weight:600}
  .rev dl{display:grid;grid-template-columns:auto 1fr;gap:.3rem .9rem;font-size:.78rem}
  .rev dt{color:var(--muted)}
  .rev dd{color:var(--text);word-break:break-word}
  .code{font-family:'JetBrains Mono',monospace;font-size:1.25rem;font-weight:700;letter-spacing:.14em;color:var(--gold);background:var(--gold-dim);border:1px solid var(--border-accent);border-radius:10px;padding:.7rem 1rem;display:inline-block;margin:.9rem 0}
  @media(max-width:440px){.row2{grid-template-columns:1fr}}
</style>
<script src="cv-skin.js"></script>
</head>

      f_role:'Attending as', f_note:'Note to organiser (optional)',

      f_rank_other_ph:'Type your rank / grade', f_nation_sel:'Select nation…', f_sel:'Select…',

  function LANG(){ try{ return (localStorage.getItem('cv-lang')||'en').toLowerCase()==='tr'?'tr':'en'; }catch(_){ return 'en'; } }
  function T(k){ const d=I18N[LANG()]||I18N.en; return d[k]!=null?d[k]:(I18N.en[k]!=null?I18N.en[k]:k); }
  function Tf(k,...v){ let out=String(T(k)); v.forEach(x=>{ out=out.replace('%s',x); }); return out; }

  const $ = id => document.getElementById(id);
  const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const params = new URLSearchParams(location.search);
  const CODE = params.get('e');
  let EVENT = null;

  const ICON_MAIL = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>';
  const ICON_CHECK = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M20 6L9 17l-5-5"/></svg>';

  function evHeader(e){
    const when=[e.start_date,e.end_date].filter(Boolean).join(' → ')||T('ev_nodate');
    $('evHead').innerHTML = `<div class="ev-head">
      <div class="eyebrow">${esc(T('ev_for'))}</div>
      <h1>${esc(e.title)}</h1>
      <div class="meta">${esc(when)}${e.location?' · '+esc(e.location):''}${e.host_org?'<br>'+esc(T('ev_host'))+' '+esc(e.host_org):''}</div>
      ${e.description?`<div class="desc">${esc(e.description)}</div>`:''}
      <a class="prog-link" href="programme.html?e=${encodeURIComponent(e.code)}" target="_blank" rel="noopener">📋 ${esc(T('ev_prog'))}</a>
    </div>`;
  }

  function applyPageLang(){
    try{
      document.title = T('doc_title');
      const bs=$('brandSub'); if(bs) bs.textContent=T('brand_sub');
      const bm=$('bootMsg');  if(bm) bm.textContent=T('loading');
      document.documentElement.setAttribute('lang', LANG());
    }catch(_){}
  }

  async function init(){
    applyPageLang();
    if(!CODE){ return fail(T('bad_link'), T('bad_link_d')); }
    // fetch event (public read allowed for open events)
    const { data:ev, error } = await _sb.from('conventus_managed_events').select('*').eq('code', CODE).maybeSingle();
    if(error){ return fail(T('err_title'), error.message); }
    if(!ev){ return fail(T('notfound'), T('notfound_d')); }
    EVENT = ev; evHeader(ev);
    if(ev.published===false){ return fail(T('notopen'), T('notopen_d')); }
    if(!ev.registration_open){ return stdGate(ev); }
    route();
  }

function icsHref(ev){
    function dd(x,plus){var t=new Date(String(x).slice(0,10)+'T00:00:00Z');if(plus)t.setUTCDate(t.getUTCDate()+1);return t.toISOString().slice(0,10).replace(/-/g,'');}
    if(!ev.start_date)return null;
    var L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Conventity//EN','BEGIN:VEVENT',
      'UID:cv-'+ev.id+'@conventity.org',
      'DTSTART;VALUE=DATE:'+dd(ev.start_date),
      'DTEND;VALUE=DATE:'+dd(ev.end_date||ev.start_date,true),
      'SUMMARY:'+String(ev.title||'').replace(/[,;\n]/g,' '),
      'LOCATION:'+String(([ev.city,ev.country].filter(Boolean).join(', '))||ev.location||'').replace(/[,;\n]/g,' '),
      'END:VEVENT','END:VCALENDAR'];
    return 'data:text/calendar;charset=utf-8,'+encodeURIComponent(L.join('\r\n'));
  }
  function stdGate(ev){
    var ics=icsHref(ev);
    $('panel').innerHTML = `<div class="state" style="text-align:center;padding:1.4rem 0">
      <div style="font-size:.62rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-bottom:.5rem">📅 SAVE THE DATE</div>

  async function route(){
    const { data:{ session } } = await _sb.auth.getSession();
    if(session){ showWho(session.user); startWizard(session.user); }
    else { $('whoami').innerHTML=''; authPanel('register'); }
  }

  function showWho(user){
    const m=user.user_metadata||{}; const name=m.first_name||user.email.split('@')[0];
    $('whoami').innerHTML = `${esc(name)} · <a id="signout">${esc(T('signout'))}</a>`;

  function fail(title, sub){
    $('panel').innerHTML = `<div class="state"><div class="ic">!</div><h2>${esc(title)}</h2><p>${esc(sub)}</p></div>`;

  // ---------- AUTH (register / sign in) ----------
  function authPanel(tab){
    $('panel').innerHTML = `
      <h2>Register to apply</h2>
      <div class="hint">Create an account (or sign in) to submit your application. We verify your email for security.</div>
      <div class="tabs">
        <button id="tabReg" class="${tab==='register'?'active':''}">Register</button>
        <button id="tabIn" class="${tab==='signin'?'active':''}">Sign in</button>
      </div>
      <div id="authBody"></div>
      <div class="msg" id="authMsg"></div>`;
    $('tabReg').onclick=()=>authPanel('register');
    $('tabIn').onclick=()=>authPanel('signin');
    $('authBody').innerHTML = tab==='register' ? regForm() : signinForm();
    if(tab==='register') $('doReg').onclick=doRegister; else $('doIn').onclick=doSignin;
  }
  function regForm(){
    return `
      <div class="row2">
        <div class="field"><label>First name <span class="req">*</span></label><input id="fn" type="text" autocomplete="given-name"></div>
        <div class="field"><label>Last name <span class="req">*</span></label><input id="ln" type="text" autocomplete="family-name"></div>
      </div>
      <div class="field"><label>Email <span class="req">*</span></label><input id="em" type="email" autocomplete="email"></div>
      <div class="field"><label>Password <span class="req">*</span></label><input id="pw" type="password" autocomplete="new-password" placeholder="At least 6 characters"></div>
      <button class="btn" id="doReg">Create account</button>`;
  }
  function signinForm(){
    return `
      <div class="field"><label>Email <span class="req">*</span></label><input id="em" type="email" autocomplete="email"></div>
      <div class="field"><label>Password <span class="req">*</span></label><input id="pw" type="password" autocomplete="current-password"></div>
      <button class="btn" id="doIn">Sign in</button>`;
  }
  function authErr(m){ const e=$('authMsg'); e.className='msg err'; e.textContent=m; }

  async function doRegister(){
    const fn=$('fn').value.trim(), ln=$('ln').value.trim(), em=$('em').value.trim(), pw=$('pw').value;
    if(!fn||!ln||!em||!pw) return authErr('Please fill in all fields.');
    if(pw.length<6) return authErr('Password must be at least 6 characters.');
    $('doReg').disabled=true; $('doReg').textContent='Creating…';
    const { data, error } = await _sb.auth.signUp({
      email:em, password:pw,
      options:{ data:{ first_name:fn, last_name:ln }, emailRedirectTo: location.href }
    });
    $('doReg').disabled=false; $('doReg').textContent='Create account';
    if(error) return authErr(error.message);
    if(data.session){ // email confirmation disabled → straight in
      showWho(data.session.user); infoForm(data.session.user);
    } else {
      verifySent(em);
    }
  }
  async function doSignin(){
    const em=$('em').value.trim(), pw=$('pw').value;
    if(!em||!pw) return authErr('Please enter your email and password.');
    $('doIn').disabled=true; $('doIn').textContent='Signing in…';
    const { error } = await _sb.auth.signInWithPassword({ email:em, password:pw });
    $('doIn').disabled=false; $('doIn').textContent='Sign in';
    if(error) return authErr(error.message.includes('confirm') ? 'Please verify your email first — check your inbox.' : error.message);
    location.reload();
  }
  function verifySent(email){
    $('whoami').innerHTML='';
    $('panel').innerHTML = `<div class="state">
      <div class="ic">${ICON_MAIL}</div>
      <h2>Verify your email</h2>
      <p>We've sent a verification link to <b>${esc(email)}</b>. Click it to confirm your account, then you'll come right back here to complete your application.</p>
      <div class="center-note">Wrong email? <a id="back">Go back</a></div>
    </div>`;
    $('back').onclick=()=>authPanel('register');

  // ---------- INFO FORM (verified user) ----------
  const NATIONS=["Albania","Belgium","Bulgaria","Canada","Croatia","Czech Republic","Denmark","Estonia","Finland","France","Germany","Greece","Hungary","Iceland","Italy","Latvia","Lithuania","Luxembourg","Montenegro","Netherlands","North Macedonia","Norway","Poland","Portugal","Romania","Slovakia","Slovenia","Spain","Sweden","Türkiye","United Kingdom","United States"];
  const RANKS={
    "Officers (OF)":["OF-9 — General / Air Chief Marshal / Admiral","OF-8 — Lieutenant General / Air Marshal / Vice Admiral","OF-7 — Major General / Air Vice Marshal / Rear Admiral (UH)","OF-6 — Brigadier General / Air Commodore / Rear Admiral (LH)","OF-5 — Colonel / Group Captain / Captain (Navy)","OF-4 — Lieutenant Colonel / Wing Commander / Commander","OF-3 — Major / Squadron Leader / Lieutenant Commander","OF-2 — Captain / Flight Lieutenant / Lieutenant","OF-1 — Lieutenant / Flying Officer / Lieutenant JG"],
    "Other Ranks (OR)":["OR-9 — Command Sergeant Major / Warrant Officer / MCPO","OR-8 — Master Sergeant / Senior Master Sergeant / SCPO","OR-7 — Sergeant First Class / Master Sergeant / Chief Petty Officer","OR-6 — Staff Sergeant / Technical Sergeant / PO 1st Class","OR-5 — Sergeant / Staff Sergeant / PO 2nd Class","OR-4 — Corporal / Senior Airman / PO 3rd Class","OR-3 — Private First Class / Airman First Class / Seaman","OR-2 — Private E2 / Airman / Seaman Apprentice","OR-1 — Private E1 / Airman Basic / Seaman Recruit"],
    "NATO Civilian":["A7 — NATO Civilian Grade","A6 — NATO Civilian Grade","A5 — NATO Civilian Grade","A4 — NATO Civilian Grade","A3 — NATO Civilian Grade","A2 — NATO Civilian Grade","A1 — NATO Civilian Grade"],
    "Civilian / Industry":["Civilian — Government","Civilian — Industry","Civilian — Academia","Civilian — Other"]
  };
  function optList(arr,sel){ return arr.map(function(o){ return '<option'+(o===sel?' selected':'')+'>'+esc(o)+'</option>'; }).join(''); }
  function rankOptions(sel){
    var h='<option value="">'+esc(T('f_rank_sel'))+'</option>';
    for(var g in RANKS){ h+='<optgroup label="'+esc(g)+'">'+optList(RANKS[g],sel)+'</optgroup>'; }

  /* ---- ADIM: kisisel bilgiler -------------------------------------------
     Eskiden tek sayfalik formun tamamiydi; artik sihirbazin bir adimi.
     Alan gorunurlugu/zorunlulugu yine registration_field_defs'ten geliyor. */
  function infoFormHtml(){
    const m=(USER&&USER.user_metadata)||{};
    const d=DRAFT.info||{};
    const fn=d.first_name??m.first_name??'', ln=d.last_name??m.last_name??'';
    const hasName = !!((m.first_name&&m.last_name) && !DRAFT.info);

      <h2>${esc(T('info_h'))}</h2>
      <div class="hint">${esc(T('info_hint'))}</div>
      <div class="row2">
        <div class="field"><label>${esc(T('f_first'))} <span class="req">*</span></label><input id="fnm" type="text" maxlength="80" value="${v(fn)}" ${hasName?'readonly':''}></div>
        <div class="field"><label>${esc(T('f_last'))} <span class="req">*</span></label><input id="lnm" type="text" maxlength="80" value="${v(ln)}" ${hasName?'readonly':''}></div>
      </div>
      <div class="field"><label>${esc(T('f_email'))}</label><input type="text" value="${v(EMAIL)}" readonly>
        <div class="verified">${ICON_CHECK.replace('width="24" height="24"','width="12" height="12"')} ${esc(T('f_verified'))}</div></div>
      <div class="row2">
        <div class="field"><label>${esc(T('f_phone'))} <span class="req">*</span></label><input id="phn" type="tel" maxlength="40" value="${v(d.phone)}" placeholder="+90 5xx xxx xx xx"></div>
        <div class="field"><label>${esc(T('f_pass'))} <span class="req">*</span></label><input id="pss" type="text" maxlength="40" value="${v(d.passport_no)}" placeholder="A12345678"></div>
      </div>
      <div class="row2">
        <div class="field"><label>${esc(T('f_dob'))} <span class="req">*</span></label><input id="dob" type="text" maxlength="10" inputmode="numeric" value="${v(d.dobRaw)}" placeholder="GG.AA.YYYY"></div>
        <div class="field"><label>${esc(T('f_nation'))} <span class="req">*</span></label>
          <select id="cty"><option value="">${esc(T('f_nation_sel'))}</option>${optList(NATIONS, d.country)}</select></div>
      </div>
      <div class="field"><label>${esc(T('f_ns'))}</label><input id="nse" type="email" maxlength="120" value="${v(d.ns_email)}" placeholder="name@ns.nato.int"></div>
      <div class="field"><label>${esc(T('f_org'))} <span class="req">*</span></label><input id="inst" type="text" maxlength="140" value="${v(d.institution)}" placeholder="NATO LANDCOM"></div>
      <div class="row2">
        <div class="field"><label>${esc(T('f_rank'))} <span class="req">*</span></label>
          <select id="rk">${rankOptions(d.rank_sel)}</select>
          <input id="rkOther" type="text" maxlength="100" value="${v(d.rank_other)}" placeholder="${esc(T('f_rank_other_ph'))}" style="margin-top:9px;display:none"></div>
        <div class="field"><label>${esc(T('f_duty'))} <span class="req">*</span></label><input id="duty" type="text" maxlength="120" value="${v(d.duty)}"></div>
      </div>
      <div class="field"><label>${esc(T('f_role'))} <span class="req">*</span></label>
        <select id="role">
          <option value="">${esc(T('f_sel'))}</option>
          ${optList(['Delegate','Speaker','Observer','Media / Press','Support staff','Other'], d.role)}
        </select></div>
      <div class="field"><label>${esc(T('f_note'))}</label><textarea id="note" maxlength="400">${v(d.note)}</textarea></div>
      ${pafFieldsHtml()}`;
  }

  function bindInfoForm(){
    const rk=$('rk'); if(rk){
      const tog=()=>{ const o=rk.value==='__other__'; $('rkOther').style.display=o?'block':'none'; };
      rk.onchange=tog; tog();
    }
    const dob=$('dob'); if(dob){
      dob.oninput=function(){
        let d=this.value.replace(/\D/g,'').slice(0,8), out=d.slice(0,2);
        if(d.length>2) out+='.'+d.slice(2,4);
        if(d.length>4) out+='.'+d.slice(4,8);
        this.value=out;
      };
    }
    // kayitli ozel alan cevaplarini geri yaz
    const a=(DRAFT.info&&DRAFT.info.answers)||{};
    customDefs().forEach(def=>{
      const el=document.getElementById('paf_'+def.key); if(!el) return;
      if(a[def.key]==null) return;
      if(el.type==='checkbox') el.checked=!!a[def.key]; else el.value=a[def.key];
    });
    applyFieldConfig();
  }

  function dobToISO(v){
    const m=/^(\d{2})\.(\d{2})\.(\d{4})$/.exec((v||'').trim());
    if(!m) return null;
    const d=m[1], mo=m[2], y=m[3];
    const dt=new Date(y+'-'+mo+'-'+d+'T00:00:00Z');
    if(isNaN(dt) || dt.getUTCFullYear()!=+y || (dt.getUTCMonth()+1)!=+mo || dt.getUTCDate()!=+d) return null;
    return y+'-'+mo+'-'+d;
  }

  // registration_field_defs: core fields (map to columns) + custom fields (-> answers).
  function pafDefs(){ return Array.isArray(EVENT.registration_field_defs) ? EVENT.registration_field_defs : []; }
  function customDefs(){ return pafDefs().filter(d => !d.core && d.visible !== false); }
  function pafFieldsHtml(){
    const defs=customDefs(); if(!defs.length) return '';
    return '<h2 style="margin-top:26px">Event-specific details</h2>' + defs.map(d=>{
      const req=d.required?' <span class="req">*</span>':''; const id='paf_'+esc(d.key); const t=String(d.type||'text').toLowerCase();
      let ctl;
      if(t==='textarea') ctl=`<textarea id="${id}" maxlength="600"></textarea>`;
      else if(t==='select'||t==='multi-select'||t==='multiselect') ctl=`<select id="${id}"><option value="">Select…</option>${(d.options||[]).map(o=>`<option>${esc(o)}</option>`).join('')}</select>`;
      else if(t==='checkbox') ctl=`<label style="display:flex;gap:8px;align-items:center;font-weight:400"><input id="${id}" type="checkbox"> ${esc(d.label)}</label>`;
      else if(t==='date') ctl=`<input id="${id}" type="text" maxlength="10" inputmode="numeric" placeholder="DD.MM.YYYY">`;
      else ctl=`<input id="${id}" type="text" maxlength="200">`;
      return t==='checkbox' ? `<div class="field">${ctl}</div>` : `<div class="field"><label>${esc(d.label)}${req}</label>${ctl}</div>`;
    }).join('');
  }
  function pafCollect(){
    const a={}, missing=[];
    customDefs().forEach(d=>{
      const el=document.getElementById('paf_'+d.key); if(!el) return;
      const v = (el.type==='checkbox') ? !!el.checked : el.value.trim();
      a[d.key]=v;
      if(d.required && (v===''||v===false)) missing.push(d.label||d.key);
    });
    return { answers:a, missing };
  }
  // Core field visibility/required, driven by the organiser's PAF config (core===true defs).
  const CORE = { organisation:'inst', rank:'rk', duty:'duty', first_name:'fnm', last_name:'lnm',
    nation:'cty', phone:'phn', passport:'pss', dob:'dob', ns_email:'nse', attending_as:'role', note:'note' };
  function coreCfg(){
    const defs=pafDefs(), hasDefs=defs.length>0, cfg={};
    defs.forEach(d=>{ if(d.core) cfg[d.key]={ visible:d.visible!==false, required:!!d.required }; });
    return { hasDefs, cfg };
  }
  function shownOf(key){ const c=coreCfg(); if(!c.hasDefs) return true; return c.cfg[key] ? c.cfg[key].visible : false; }
  function reqOf(key){ const c=coreCfg(); if(!c.hasDefs) return true; return c.cfg[key] ? (c.cfg[key].visible && c.cfg[key].required) : false; }
  function applyFieldConfig(){
    Object.keys(CORE).forEach(key=>{
      const el=document.getElementById(CORE[key]); if(!el) return;
      const box=el.closest('.field'); if(!box) return;
      const show=shownOf(key), required=reqOf(key);
      box.style.display = show ? '' : 'none';
      const star=box.querySelector('label .req');
      if(star) star.style.display = (required && show) ? '' : 'none';
    });
  }

  /* ======================= SIHIRBAZ =======================================
     Adimlar etkinlige gore kuruluyor: kayit tipi ve parkur tanimli degilse
     o adim HIC cikmiyor. Cevaplar DRAFT'ta tutuluyor, gonderim tek yerde. */
  let USER=null, EMAIL='';
  let CFG={types:[],tracks:[],consents:[]};
  let DRAFT={type:null,typeOther:'',tracks:[],info:null,consents:{}};
  let STEPS=[], STEP=0, BUSY=false;

  async function loadCfg(){
    const [t,k,c] = await Promise.all([
      _sb.from('conventus_event_reg_types').select('*').eq('event_id',EVENT.id).eq('is_active',true).order('sort'),
      _sb.from('conventus_event_tracks').select('*').eq('event_id',EVENT.id).eq('is_active',true).order('sort'),
      _sb.from('conventus_event_consents').select('*').eq('event_id',EVENT.id).eq('is_active',true).order('sort')
    ]);
    // Sessiz dusme yok: yapilandirma okunamazsa adim atlanir ama konsola yazilir.
    if(t.error||k.error||c.error){
      try{ console.error('[register] yapilandirma okunamadi',t.error||k.error||c.error); }catch(_){}
    }
    CFG={types:t.data||[],tracks:k.data||[],consents:c.data||[]};
  }

  async function startWizard(user){
    USER=user; EMAIL=user.email||'';
    const { data:existing } = await _sb.from('conventus_registrations')
      .select('status, confirmation_code').eq('event_id',EVENT.id).eq('user_id',user.id).maybeSingle();
    if(existing) return alreadyApplied(existing);
    await loadCfg();
    STEPS=[];
    if(CFG.types.length)    STEPS.push('type');
    if(CFG.tracks.length)   STEPS.push('tracks');
    STEPS.push('info');
    if(CFG.consents.length) STEPS.push('consents');
    STEPS.push('review');
    STEP=0; render();
  }

  function stepTitle(k){ return T({type:'st_type',tracks:'st_tracks',info:'st_info',
    consents:'st_consents',review:'st_review'}[k]||k); }

  function render(){
    const k=STEPS[STEP];
    const pct=Math.round(((STEP+1)/STEPS.length)*100);
    const body = k==='type'?stepTypeHtml():k==='tracks'?stepTracksHtml():
                 k==='info'?infoFormHtml():k==='consents'?stepConsentsHtml():stepReviewHtml();
    const last = k==='review';
    $('panel').innerHTML = `
      <div class="wz-top">
        <div class="wz-bar"><i style="width:${pct}%"></i></div>
        <div class="wz-step"><b>${esc(stepTitle(k))}</b><span>${esc(Tf('step_of',STEP+1,STEPS.length))}</span></div>
      </div>
      ${body}
      <div class="msg" id="wzMsg"></div>
      <div class="wz-nav">
        ${STEP>0?`<button class="btn-ghost" id="wzPrev">${esc(T('nav_prev'))}</button>`:''}
        <button class="btn" id="wzNext">${esc(last?T('nav_submit'):T('nav_next'))}</button>
      </div>`;
    if(k==='info') bindInfoForm();
    if(k==='type') bindPickers('rt', true);
    if(k==='tracks') bindPickers('tr', false);
    if($('wzPrev')) $('wzPrev').onclick=()=>{ if(collectStep(true)!==false){ STEP--; render(); } };
    $('wzNext').onclick=()=>{ if(collectStep()===false) return; if(last) return submitAll(); STEP++; render(); };
    window.scrollTo({top:0,behavior:'smooth'});
  }

  function wzErr(msg){ const e=$('wzMsg'); e.className='msg err'; e.innerHTML=msg; e.scrollIntoView({block:'nearest'}); return false; }

  /* soft=true: geri giderken dogrulama yapma, sadece yazileni sakla */
  function collectStep(soft){
    const k=STEPS[STEP];
    if(k==='type')     return collectType(soft);
    if(k==='tracks')   return collectTracks(soft);
    if(k==='info')     return collectInfo(soft);
    if(k==='consents') return collectConsents(soft);
    return true;
  }

  // ---------- ADIM: kayit tipi ----------
  function stepTypeHtml(){
    /* <label> icine konan input tiklamada olayi IKI KEZ tetikliyor (label + input)
       ve secim aninda geri kapaniyordu. Bu yuzden kutular div, input'lar
       pointer-events:none; erisilebilirlik icin role/aria-checked ve klavye var. */
    const list = CFG.types.map(t=>{
      const on=DRAFT.type===t.key;
      return `<div class="pick${on?' on':''}" data-pick="rt" data-key="${esc(t.key)}"
                   role="radio" aria-checked="${on?'true':'false'}" tabindex="0">
        <span class="t"><input type="radio" tabindex="-1" ${on?'checked':''}> ${esc(t.label)}</span>
        ${t.note?`<span class="n">${esc(t.note)}</span>`:''}
      </div>`;
    }).join('');
    const sel=CFG.types.find(x=>x.key===DRAFT.type);
    const other = (sel&&sel.allow_other)
      ? `<div class="field" style="margin-top:.2rem"><label>${esc(sel.label)} — ${esc(T('type_other_ph'))} <span class="req">*</span></label>
           <input id="rtOther" type="text" maxlength="120" value="${esc(DRAFT.typeOther||'')}"></div>`
      : '';
    return `<h2>${esc(T('type_h'))}</h2><div class="hint">${esc(T('type_hint'))}</div>
            <div role="radiogroup">${list}</div>${other}`;
  }

  function collectType(soft){
    const other=$('rtOther'); if(other) DRAFT.typeOther=other.value.trim();
    if(soft) return true;
    if(!DRAFT.type) return wzErr(esc(T('type_need')));
    const t=CFG.types.find(x=>x.key===DRAFT.type);
    if(t && t.allow_other && !DRAFT.typeOther) return wzErr(esc(T('type_other_need')));
    return true;
  }

  // ---------- ADIM: parkurlar ----------
  function fmtRange(a,b){
    const f=(x)=>{const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(x||'')); return m?m[3]+'.'+m[2]+'.'+m[1]:'';};
    const A=f(a), B=f(b);
    return (A&&B&&A!==B)?A+' – '+B:(A||B||'');
  }
  function stepTracksHtml(){
    return `<h2>${esc(T('tracks_h'))}</h2><div class="hint">${esc(T('tracks_hint'))}</div>` +
      CFG.tracks.map(t=>{
        const on=DRAFT.tracks.indexOf(t.key)>=0;
        const when=[fmtRange(t.starts_on,t.ends_on),[t.time_from,t.time_to].filter(Boolean).join('–')].filter(Boolean).join(' · ');
        return `<div class="pick${on?' on':''}" data-pick="tr" data-key="${esc(t.key)}"
                     role="checkbox" aria-checked="${on?'true':'false'}" tabindex="0">
          <span class="t"><input type="checkbox" tabindex="-1" ${on?'checked':''}> ${esc(t.title)}</span>
          ${when?`<span class="when">${esc(when)}</span>`:''}
          ${t.description?`<span class="n">${esc(t.description)}</span>`:''}
          ${t.external_note?`<span class="ext">${esc(t.external_note)}</span>`:''}
        </div>`;
      }).join('');
  }
  function collectTracks(soft){
    if(soft) return true;
    if(!DRAFT.tracks.length) return wzErr(esc(T('tracks_need')));
    return true;
  }
  function bindPickers(kind, single){
    const pick=(el)=>{
      const key=el.getAttribute('data-key');
      if(single){ DRAFT.type=key; }
      else { const i=DRAFT.tracks.indexOf(key); if(i>=0) DRAFT.tracks.splice(i,1); else DRAFT.tracks.push(key); }
      const other=$('rtOther'); if(other) DRAFT.typeOther=other.value.trim();
      render();
    };
    Array.prototype.forEach.call(document.querySelectorAll('[data-pick="'+kind+'"]'), el=>{
      el.addEventListener('click', ()=>pick(el));
      el.addEventListener('keydown', ev=>{
        if(ev.key===' '||ev.key==='Enter'){ ev.preventDefault(); pick(el); }
      });
    });
  }

  // ---------- ADIM: onaylar ----------
  function stepConsentsHtml(){
    return `<h2>${esc(T('cons_h'))}</h2><div class="hint">${esc(T('cons_hint'))}</div>` +
      CFG.consents.map(c=>{
        const v=DRAFT.consents[c.key];
        return `<div class="cons">
          <p>${esc(c.body)}</p>
          <div class="yn">
            <label><input type="radio" name="c_${esc(c.key)}" value="yes" ${v===true?'checked':''}> ${esc(T('cons_yes'))}</label>
            <label><input type="radio" name="c_${esc(c.key)}" value="no"  ${v===false?'checked':''}> ${esc(T('cons_no'))}</label>
          </div>
          ${c.is_required?`<div class="warn">${esc(T('cons_required'))}</div>`:''}
        </div>`;
      }).join('');
  }
  function collectConsents(soft){
    CFG.consents.forEach(c=>{
      const el=document.querySelector('input[name="c_'+c.key+'"]:checked');
      if(el) DRAFT.consents[c.key] = el.value==='yes';
    });
    if(soft) return true;
    const unanswered=CFG.consents.some(c=>DRAFT.consents[c.key]==null);
    if(unanswered) return wzErr(esc(T('cons_need')));
    const blocked=CFG.consents.some(c=>c.is_required && DRAFT.consents[c.key]===false);
    if(blocked) return wzErr(esc(T('cons_blocked')));
    return true;
  }

  // ---------- ADIM: ozet ----------
  function revRow(k,v){ return `<dt>${esc(k)}</dt><dd>${v?esc(v):esc(T('rev_none'))}</dd>`; }
  function stepReviewHtml(){
    const d=DRAFT.info||{};
    const idx=(k)=>STEPS.indexOf(k);
    const sect=(key,title,rows)=>`<div class="rev">
        <div class="h"><b>${esc(title)}</b><a data-goto="${idx(key)}">${esc(T('rev_edit'))}</a></div>
        <dl>${rows}</dl></div>`;
    let out='';
    if(CFG.types.length){
      const t=CFG.types.find(x=>x.key===DRAFT.type);
      out+=sect('type',T('st_type'),revRow(T('st_type'),(t?t.label:'')+(DRAFT.typeOther?' — '+DRAFT.typeOther:'')));
    }
    if(CFG.tracks.length){
      const names=DRAFT.tracks.map(k=>{const t=CFG.tracks.find(x=>x.key===k);return t?t.title:k;});
      out+=sect('tracks',T('st_tracks'),revRow(T('st_tracks'),names.join(', ')));
    }
    out+=sect('info',T('st_info'),
      revRow(T('f_first'),d.first_name)+revRow(T('f_last'),d.last_name)+
      revRow(T('f_email'),EMAIL)+
      (shownOf('phone')?revRow(T('f_phone'),d.phone):'')+
      (shownOf('passport')?revRow(T('f_pass'),d.passport_no?String(d.passport_no).replace(/./g,'*'):''):'')+
      (shownOf('dob')?revRow(T('f_dob'),d.dobRaw):'')+
      (shownOf('nation')?revRow(T('f_nation'),d.country):'')+
      (shownOf('organisation')?revRow(T('f_org'),d.institution):'')+
      (shownOf('rank')?revRow(T('f_rank'),d.rank_title):'')+
      (shownOf('duty')?revRow(T('f_duty'),d.duty):'')+
      (shownOf('attending_as')?revRow(T('f_role'),d.role):''));
    if(CFG.consents.length){
      out+=sect('consents',T('st_consents'),
        CFG.consents.map(c=>revRow(c.body, DRAFT.consents[c.key]?T('cons_yes'):T('cons_no'))).join(''));
    }
    out+=`<div class="hint" style="margin:.2rem 0 0">${T('rev_submit_note')}</div>`;
    setTimeout(()=>{
      Array.prototype.forEach.call(document.querySelectorAll('[data-goto]'), a=>{
        a.onclick=()=>{ STEP=parseInt(a.getAttribute('data-goto'),10); render(); };
      });
    },0);
    return `<h2>${esc(T('rev_h'))}</h2><div class="hint">${esc(T('rev_hint'))}</div>`+out;
  }

  // ---------- kisisel bilgi toplama ----------
  function collectInfo(soft){
    const val=(id)=>{ const el=$(id); return el ? el.value.trim() : ''; };
    let rank_sel=val('rk'); const rank_other=val('rkOther');
    const rank = rank_sel==='__other__' ? rank_other : rank_sel;
    const dobRaw=val('dob');
    const paf=pafCollect();
    const d={
      first_name:val('fnm'), last_name:val('lnm'),
      phone:val('phn'), passport_no:val('pss'), dobRaw:dobRaw, dob:dobToISO(dobRaw),
      country:val('cty'), ns_email:val('nse'), institution:val('inst'),
      rank_sel:rank_sel, rank_other:rank_other, rank_title:rank,
      duty:val('duty'), role:val('role'), note:val('note'), answers:paf.answers
    };
    DRAFT.info=d;
    if(soft) return true;
    if((reqOf('first_name')&&!d.first_name) || (reqOf('last_name')&&!d.last_name)) return wzErr(esc(T('e_name')));
    if(reqOf('phone') && !d.phone) return wzErr(esc(T('e_phone')));
    if(reqOf('passport') && !d.passport_no) return wzErr(esc(T('e_pass')));
    if(reqOf('dob') && !d.dob) return wzErr(esc(T('e_dob')));
    if(reqOf('nation') && !d.country) return wzErr(esc(T('e_nation')));
    if(reqOf('organisation') && !d.institution) return wzErr(esc(T('e_org')));
    if(reqOf('rank') && !d.rank_title) return wzErr(esc(T('e_rank')));
    if(reqOf('duty') && !d.duty) return wzErr(esc(T('e_duty')));
    if(reqOf('attending_as') && !d.role) return wzErr(esc(T('e_role')));
    if(paf.missing.length) return wzErr(esc(Tf('e_missing',paf.missing.join(', '))));
    return true;
  }

  // ---------- gonderim ----------
  async function submitAll(){
    if(BUSY) return; BUSY=true;
    const btn=$('wzNext'); btn.disabled=true; btn.textContent=T('nav_sending');
    const d=DRAFT.info||{};
    const md=USER.user_metadata||{};
    if(d.first_name && d.last_name && (md.first_name!==d.first_name || md.last_name!==d.last_name)){
      try{ await _sb.auth.updateUser({ data:{ first_name:d.first_name, last_name:d.last_name } }); }catch(_){}
    }
    const row={
      event_id:EVENT.id, user_id:USER.id, email:EMAIL,
      first_name: shownOf('first_name')?(d.first_name||null):null,
      last_name:  shownOf('last_name') ?(d.last_name||null):null,
      phone:      shownOf('phone')     ?(d.phone||null):null,
      passport_no:shownOf('passport')  ?(d.passport_no||null):null,
      dob:        shownOf('dob')       ?d.dob:null,
      ns_email:   shownOf('ns_email')  ?(d.ns_email||null):null,
      institution:shownOf('organisation')?(d.institution||null):null,
      country:    shownOf('nation')    ?(d.country||null):null,
      rank_title: shownOf('rank')      ?(d.rank_title||null):null,
      duty:       shownOf('duty')      ?(d.duty||null):null,
      role:       shownOf('attending_as')?(d.role||null):null,
      note:       shownOf('note')      ?(d.note||null):null,
      reg_type:DRAFT.type||null, reg_type_other:DRAFT.typeOther||null,
      answers:d.answers||{}, status:'submitted'
    };
    const ins = await _sb.from('conventus_registrations').insert(row)
      .select('id, confirmation_code, status').single();
    if(ins.error){
      BUSY=false; btn.disabled=false; btn.textContent=T('nav_submit');
      if(ins.error.code==='23505') return alreadyApplied({status:'submitted'});
      return wzErr(esc(ins.error.message));
    }
    const reg=ins.data;

    /* Kayit acildi. Parkur/onay yazimi patlarsa SESSIZ GECMIYORUZ: kullaniciya
       numarasini veriyoruz ve organizatore yazmasini soyluyoruz — yoksa eksik
       kayitla yola devam eder. */
    let partial=false;
    if(DRAFT.tracks.length){
      const ids=CFG.tracks.filter(t=>DRAFT.tracks.indexOf(t.key)>=0).map(t=>({registration_id:reg.id,track_id:t.id}));
      const r=await _sb.from('conventus_registration_tracks').insert(ids);
      if(r.error){ partial=true; try{ console.error('[register] parkur yazilamadi',r.error); }catch(_){} }
    }
    if(CFG.consents.length){
      const rows=CFG.consents.map(c=>({registration_id:reg.id, consent_key:c.key,
        consent_version:c.version, answer:!!DRAFT.consents[c.key]}));
      const r=await _sb.from('conventus_registration_consents').insert(rows);
      if(r.error){ partial=true; try{ console.error('[register] onay yazilamadi',r.error); }catch(_){} }
    }
    BUSY=false;
    doneScreen(reg.confirmation_code, partial);
  }

  function doneScreen(code, partial){
    const ics=icsHref(EVENT);
    $('panel').innerHTML = `<div class="state">
      <div class="ic">${ICON_CHECK}</div>
      <h2>${esc(T('done_h'))}</h2>
      <p>${T('done_p')}</p>
      <div style="font-size:.7rem;color:var(--muted);margin-top:1.1rem">${esc(T('done_code'))}</div>
      <div class="code">${esc(code||'—')}</div>
      <p style="font-size:.74rem">${esc(T('done_code_note'))}</p>
      ${partial?`<div class="msg err" style="display:block;text-align:left;margin-top:1rem">${esc(Tf('partial',code||''))}</div>`:''}
      <div style="margin-top:1.3rem;display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap">
        ${ics?`<a class="prog-link" href="${ics}" download="${esc(EVENT.code||'event')}.ics">${esc(T('done_cal'))}</a>`:''}
        <a class="prog-link" href="my-events.html">${esc(T('done_my'))}</a>
      </div>
    </div>`;
  }

  function alreadyApplied(reg){
    const status=reg.status||'submitted';
    const label={pending:'pending',submitted:'submitted',under_review:'under_review',
      waitlisted:'waitlisted',approved:'approved',rejected:'rejected',checked_in:'checked_in'}[status]||status;
    $('panel').innerHTML = `<div class="state">
      <div class="ic">${ICON_CHECK}</div>
      <h2>${esc(T('already_h'))}</h2>
      <p>${esc(T('already_p'))}</p>
      ${reg.confirmation_code?`<div class="code">${esc(reg.confirmation_code)}</div>`:''}
      <div class="status-pill">${esc(label)}</div>
      <div style="margin-top:1.3rem;display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap">
        <a class="prog-link" href="my-events.html">${esc(T('done_my'))}</a>
      </div>
    </div>`;
  }

  // handle the return from the email verification link (session becomes available)
  _sb.auth.onAuthStateChange((event)=>{ if(event==='SIGNED_IN' && EVENT){ route(); } });

  init();
</script>
</body>
