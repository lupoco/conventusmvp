<style>
  .bar{position:sticky;top:0;z-index:var(--z-nav);display:flex;align-items:center;gap:12px;padding:0 16px;height:56px;
    border-bottom:1px solid var(--line);background:var(--nav-bg)}
  .bar .back{font-family:var(--font-mono);font-size:12px;color:var(--muted)}
  .bar .title{font-family:var(--font-display);font-size:1.2rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar .sp{flex:1}
  .tbtn{font-family:var(--font-mono);font-size:11px;font-weight:700;color:var(--muted);background:var(--paper-2);
    border:1px solid var(--line-2);border-radius:var(--r-pill);padding:6px 12px}
  .tbtn:hover{color:var(--pf);border-color:var(--pf)}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:20px 16px 80px}
  .head h1{font-size:clamp(1.8rem,4vw,2.6rem)}
  .subline{color:var(--muted);font-size:13px;margin:4px 0 16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .subline .mono{font-family:var(--font-mono)}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:20px}
  .tab{font-family:var(--font-mono);font-size:12px;font-weight:700;padding:9px 14px;color:var(--muted);background:none;
    border:none;border-bottom:2px solid transparent;margin-bottom:-1px}
  .tab.on{color:var(--pf);border-bottom-color:var(--pf)} .tab:hover{color:var(--ink)}
  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
  .toolbar h3{font-family:var(--font-display);font-weight:400;font-size:1.3rem;margin:0}
  .toolbar .sp{flex:1}
  .fbar{display:flex;gap:5px;flex-wrap:wrap}
  .fchip{font-family:var(--font-mono);font-size:10.5px;font-weight:700;padding:5px 11px;border-radius:var(--r-pill);
    border:1px solid var(--line-2);color:var(--muted);background:var(--paper-2);cursor:pointer}
  .fchip.on{color:#fff;background:var(--pf);border-color:var(--pf)}
  .empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line-2);border-radius:var(--r-md);font-size:13px}
  .kv{display:grid;grid-template-columns:180px 1fr;gap:8px 16px;font-size:14px}
  .kv dt{color:var(--muted);font-size:12px} .kv dd{margin:0;color:var(--ink)}
  .gate{max-width:460px;margin:12vh auto;text-align:center}
  .gate h2{font-family:var(--font-display);font-weight:400;font-size:1.8rem;margin-bottom:8px}
  .gate p{color:var(--muted);margin-bottom:18px}
  .st{font-family:var(--font-mono);font-size:9.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
    padding:2px 8px;border-radius:var(--r-pill);border:1px solid;white-space:nowrap}
  .st.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
  .st.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
  .st.bad{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,transparent)}
  .st.n{color:var(--muted);border-color:var(--line-2)}
  .row-acts{display:flex;gap:5px;justify-content:flex-end;flex-wrap:wrap}
  .ans{font-size:12px;color:var(--muted);max-width:360px}
  .ans b{color:var(--ink-2);font-weight:600}
  .soon{padding:34px;text-align:center;color:var(--muted);font-size:13px}
  .dbg{position:fixed;inset:0;background:rgba(6,12,24,.5);opacity:0;pointer-events:none;transition:opacity .2s;z-index:1100}
  .dbg.on{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;right:0;height:100%;width:min(460px,94vw);background:var(--paper);border-left:1px solid var(--line);
    box-shadow:var(--shadow-3);transform:translateX(102%);transition:transform .22s var(--ease);z-index:1101;display:flex;flex-direction:column}
  .drawer.on{transform:none}
  .drawer h3{font-family:var(--font-display);font-weight:400;font-size:1.4rem;padding:18px 20px 0}
  .dbody{padding:16px 20px;overflow-y:auto;flex:1;display:grid;gap:12px}
  .dbody label{display:block;font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
  .dfoot{display:flex;gap:8px;align-items:center;padding:14px 20px;border-top:1px solid var(--line)}
  .dfoot .sp{flex:1}
  .ferr{color:var(--danger);font-size:12.5px;min-height:16px}
  .seg{display:inline-flex;border:1px solid var(--line-2);border-radius:var(--r-pill);overflow:hidden}
  .seg button{padding:6px 14px;border:none;background:transparent;color:var(--muted);font-family:var(--font-mono);font-size:11px;font-weight:700;cursor:pointer}
  .seg button.on{background:var(--pf);color:#fff}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--paper);border:1px solid var(--pf);
    color:var(--ink);padding:10px 18px;border-radius:var(--r-md);font-size:13px;box-shadow:var(--shadow-2);opacity:0;
    transition:opacity .25s;pointer-events:none;z-index:1200}
  .toast.on{opacity:1}.toast.bad{border-color:var(--danger)}
  .card label{display:block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
  .card input,.card textarea,.card select{width:100%;background:var(--paper-2);border:1px solid var(--line);border-radius:var(--r-md);padding:9px 11px;color:var(--ink);font-family:inherit;font-size:14px;outline:none;transition:border-color .15s}
  .card input:focus,.card textarea:focus,.card select:focus{border-color:var(--pf)}
  .card select{cursor:pointer}
  .card textarea{resize:vertical;min-height:52px}
  @media(max-width:640px){.kv{grid-template-columns:1fr}}
</style>
</head>

  function Tf(k,val){ return String(T(k)).replace('%s',val); }
  function $(s){ return document.querySelector(s); }
  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function fmtD(iso){ if(!iso) return '—'; var d=new Date(iso);
    return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+d.getFullYear(); }
  function fmtDT(iso){ if(!iso) return '—'; var d=new Date(iso);
    return fmtD(iso)+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
  var toastT; function toast(m,bad){ var t=$('#toast'); t.textContent=m; t.classList.toggle('bad',!!bad); t.classList.add('on');

  function openDrawer(title,body,foot){ $('#dTitle').textContent=title; $('#dBody').innerHTML=body; $('#dFoot').innerHTML=foot;
    $('#dbg').classList.add('on'); $('#drawer').classList.add('on'); }
  function closeDrawer(){ $('#dbg').classList.remove('on'); $('#drawer').classList.remove('on'); }
  document.getElementById('dbg').addEventListener('click',closeDrawer);

  var CODE=new URLSearchParams(location.search).get('e');
  var EVENT=null, COMM=null, TAB='general', REGS=[], FILTER='all', SESSION=null;

  boot();
  async function boot(){
    var s=await sb.auth.getSession(); SESSION=(s.data&&s.data.session)||null;
    if(!SESSION){ gate('signin'); return; }
    if(!CODE){ gate('notfound'); return; }
    var e=await sb.from('conventus_managed_events').select('*').eq('code',CODE).maybeSingle();
    if(e.error||!e.data){ gate('notfound', e.error&&e.error.message); return; }
    EVENT=e.data;
    if(EVENT.activity_id){
      var can=await sb.rpc('conventity_can_manage_event',{p_activity_id:EVENT.activity_id});
      if(can.error||!can.data){ gate('notfound', can.error&&can.error.message); return; }
    } else { gate('notfound','event has no activity_id'); return; }
    if(EVENT.community_id){
      var c=await sb.from('conventus_communities').select('name,short_name').eq('id',EVENT.community_id).maybeSingle();
      COMM=c.data||null;
    }
    $('#barTitle').textContent=EVENT.title||EVENT.code;
    render();
  }
  function gate(kind,detail){
    setChrome();
    var map={signin:['signin','signin_d','/login.html','signin_b'],notfound:['notfound','notfound_d',null,null]};
    var g=map[kind];
    $('#wrap').innerHTML='<div class="gate"><h2>'+esc(T(g[0]))+'</h2><p>'+esc(T(g[1]))+
      (detail?'<br><span class="mono" style="font-size:11px">'+esc(detail)+'</span>':'')+'</p>'+
      (g[2]?'<a class="btn btn-primary" href="'+g[2]+'">'+esc(T(g[3]))+'</a>':'')+'</div>';
  }

  function setChrome(){ var b=$('#backLbl'); if(b) b.textContent=T('back'); }

  function render(){
    setChrome();
    var tabs=[['general','tab_general'],['reg','tab_reg'],['form','tab_form'],['agenda','tab_agenda'],['ann','tab_ann'],['docs','tab_docs'],['log','tab_log']];
    $('#wrap').innerHTML=
      '<div class="head"><div class="eyebrow">conventus_managed_events</div><h1>'+esc(EVENT.title||EVENT.code)+'</h1></div>'+
      '<div class="subline"><span class="mono">'+esc(EVENT.code)+'</span>·'+
        '<span>'+(EVENT.published?esc(T('published')):esc(T('draft')))+'</span>'+
        (COMM?'·<span>'+esc(COMM.short_name||COMM.name)+'</span>':'')+'</div>'+
      '<div class="tabs">'+tabs.map(function(t){return '<button class="tab'+(TAB===t[0]?' on':'')+'" data-tab="'+t[0]+'">'+esc(T(t[1]))+'</button>';}).join('')+'</div>'+

  function dmy(iso){ var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso||'')); return m?m[3]+'.'+m[2]+'.'+m[1]:''; }
  function dmyToISO(v){
    v=(v||'').trim(); if(!v) return {ok:true, val:null};
    var m=/^(\d{2})\.(\d{2})\.(\d{4})$/.exec(v); if(!m) return {ok:false};
    var d=new Date(m[3]+'-'+m[2]+'-'+m[1]+'T00:00:00Z');
    if(isNaN(d)||d.getUTCFullYear()!=+m[3]||(d.getUTCMonth()+1)!=+m[2]||d.getUTCDate()!=+m[1]) return {ok:false};
    return {ok:true, val:m[3]+'-'+m[2]+'-'+m[1]};
  }
  function okTime(v){ v=(v||'').trim(); return !v || /^([01]\d|2[0-3]):[0-5]\d$/.test(v); }
  function maskDate(el){ if(!el) return; el.addEventListener('input',function(){
    var d=this.value.replace(/\D/g,'').slice(0,8), o=d.slice(0,2);
    if(d.length>2) o+='.'+d.slice(2,4);
    if(d.length>4) o+='.'+d.slice(4,8);
    this.value=o; }); }

  function fv(id){ var el=$('#'+id); return el?el.value.trim():''; }
  function fc(id){ var el=$('#'+id); return !!(el&&el.checked); }

  async function saveFm(){
    var err=function(m){ $('#fmErr').innerHTML=m; };
    var kind=fmKind, d=fmEdit?fmRow(kind,fmEdit):null;
    var key=fv('fm_key').toLowerCase();
    if(!/^[a-z0-9_]{2,40}$/.test(key)) return err(esc(T('fm_need_key')));
    var sort=parseInt(fv('fm_sort'),10); if(isNaN(sort)) sort=0;
    var row={event_id:EVENT.id, key:key, sort:sort, is_active:fc('fm_active')};
    var newVersion=null;

    if(kind==='types'){
      if(!fv('fm_label')) return err(esc(T('fm_need_label')));
      row.label=fv('fm_label'); row.note=fv('fm_note')||null; row.allow_other=fc('fm_other');
    } else if(kind==='tracks'){
      if(!fv('fm_title')) return err(esc(T('fm_need_title')));
      var a=dmyToISO(fv('fm_from')), b=dmyToISO(fv('fm_to'));
      if(!a.ok||!b.ok) return err(esc(T('fm_bad_date')));
      if(!okTime(fv('fm_tfrom'))||!okTime(fv('fm_tto'))) return err(esc(T('fm_bad_time')));
      var cap=fv('fm_cap');
      if(cap && !(/^\d+$/.test(cap) && +cap>0)) return err(esc(T('fm_bad_cap')));
      row.title=fv('fm_title'); row.description=fv('fm_desc')||null;
      row.starts_on=a.val; row.ends_on=b.val;
      row.time_from=fv('fm_tfrom')||null; row.time_to=fv('fm_tto')||null;
      row.capacity=cap?+cap:null; row.external_note=fv('fm_ext')||null;
    } else {
      if(!fv('fm_body')) return err(esc(T('fm_need_body')));
      row.body=fv('fm_body'); row.is_required=fc('fm_req');
      /* Onay metni DEGISTIYSE ustune yazmiyoruz: verilmis yanitlar
         (key+version) o metne isaret ediyor. Yeni surum acip eskisini
         pasife aliyoruz — gecmis oldugu gibi kaliyor. */
      if(d && d.body !== row.body){
        newVersion = (d.version||1)+1; row.version=newVersion;
      } else if(d){
        row.version=d.version;
      } else {
        row.version=1;
      }
    }

    var res;
    if(kind==='consents' && newVersion){
      res = await sb.from(FM_TABLE[kind]).insert(row);
      if(!res.error) await sb.from(FM_TABLE[kind]).update({is_active:false}).eq('id',d.id);
    } else if(d){
      res = await sb.from(FM_TABLE[kind]).update(row).eq('id',d.id);
    } else {
      res = await sb.from(FM_TABLE[kind]).insert(row);
    }
    if(res.error) return err(esc(res.error.message));
    fmEdit=null; fmKind=null;
    await tFormTab();
    toast(newVersion ? T('fm_newver').replace('%s',newVersion).replace(/<[^>]+>/g,'') : T('fm_saved'));
  }

      kv('g_loc',e.location)+kv('g_host',e.host_org)+
      kvRaw('g_comm',COMM?esc(COMM.name):'—')+
      kvRaw('g_pub',e.published?esc(T('published')):esc(T('draft')))+
      kvRaw('g_reg',e.registration_open?esc(T('open')):esc(T('closed')))+
      kvRaw('g_cap',e.capacity!=null?esc(e.capacity):'—')+
      kvRaw('g_paf',esc(defs.length)+(defs.length?' ('+defs.map(function(d){return esc(d.label||d.key);}).join(', ')+')':''))+
      '</dl></div>';
  }
  function kv(k,v){ return '<dt>'+esc(T(k))+'</dt><dd>'+esc(v||'—')+'</dd>'; }
  function kvRaw(k,v){ return '<dt>'+esc(T(k))+'</dt><dd>'+v+'</dd>'; }

  async function tReg(){
    $('#tb').innerHTML='<div class="empty">…</div>';
    var r=await sb.from('conventus_registrations').select('*').eq('event_id',EVENT.id).order('created_at',{ascending:false});
    if(r.error){ $('#tb').innerHTML='<div class="empty">'+esc(r.error.message)+'</div>'; return; }
    REGS=r.data||[];
    drawReg();
  }
  function pafPreview(a){
    if(!a||typeof a!=='object') return '';
    var keys=Object.keys(a).slice(0,4);
    return keys.map(function(k){return '<b>'+esc(k)+':</b> '+esc(a[k]);}).join(' · ');
  }
  function regName(x){
    var nm=[x.first_name,x.last_name].filter(Boolean).join(' ');
    if(nm) return nm + (x.is_delegated?' · '+((lang()==='tr')?'vekaleten':'on behalf'):'');
    var a=x.answers||{};
    return a.name||a.full_name||x.email||x.user_id||x.id||'—';
  }
  var FILTERS=[['all','r_all'],['submitted','r_pending'],['approved','r_approved'],['rejected','r_rejected'],['waitlisted','r_wait']];
  function drawReg(){
    var list=REGS.filter(function(x){
      if(FILTER==='all') return true;
      if(FILTER==='submitted') return x.status==='submitted'||x.status==='under_review'||x.status==='draft'||x.status==='pending';
      return x.status===FILTER;
    });
    var html='<div class="toolbar"><h3>'+esc(T('tab_reg'))+'</h3><span class="mono" style="color:var(--muted);font-size:12px">'+
      REGS.length+' '+esc(T('r_count'))+'</span><div class="sp"></div><div class="fbar">'+
      FILTERS.map(function(f){return '<button class="fchip'+(FILTER===f[0]?' on':'')+'" data-f="'+f[0]+'">'+esc(T(f[1]))+'</button>';}).join('')+
      '</div><button class="btn btn-primary btn-sm" id="obAdd">'+esc(T('ob_add'))+'</button></div>';
    if(!list.length){ html+='<div class="empty">'+esc(T('r_none'))+'</div>'; }
    else{
      html+='<div class="table-wrap"><table class="grid"><thead><tr><th>'+esc(T('r_who'))+'</th><th>'+esc(T('r_ans'))+
        '</th><th>'+esc(T('r_status'))+'</th><th>'+esc(T('r_when'))+'</th><th></th></tr></thead><tbody>'+
        list.map(function(x){
          return '<tr><td style="color:var(--ink);font-weight:600">'+esc(regName(x))+'</td>'+
            '<td class="ans">'+pafPreview(x.answers)+'</td>'+
            '<td>'+stChip(x.status)+'</td>'+
            '<td class="mono" style="font-size:11px">'+esc(fmtDT(x.created_at))+'</td>'+
            '<td class="row-acts">'+regActions(x)+'</td></tr>';
        }).join('')+'</tbody></table></div>';
    }
    $('#tb').innerHTML=html;
    Array.prototype.forEach.call(document.querySelectorAll('[data-f]'),function(b){
      b.addEventListener('click',function(){ FILTER=b.getAttribute('data-f'); drawReg(); });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-set]'),function(b){
      b.addEventListener('click',function(){ setStatus(b.getAttribute('data-id'), b.getAttribute('data-set')); });
    });
    var ob=$('#obAdd'); if(ob) ob.addEventListener('click',onBehalfForm);
  }

  var OB_MODE='single';
  function onBehalfForm(){
    OB_MODE='single';
    var body=
      '<div style="font-size:12.5px;color:var(--muted)">'+esc(T('ob_hint'))+'</div>'+
      '<div class="seg"><button id="obS" class="on">'+esc(T('ob_single'))+'</button><button id="obB">'+esc(T('ob_bulk'))+'</button></div>'+
      '<div id="obSingle">'+
        '<div><label>'+esc(T('ob_first'))+'</label><input id="ob_fn"></div>'+
        '<div><label>'+esc(T('ob_last'))+'</label><input id="ob_ln"></div>'+
        '<div><label>'+esc(T('ob_email'))+'</label><input id="ob_em" type="email"></div>'+
        '<div><label>'+esc(T('ob_org'))+'</label><input id="ob_org"></div>'+
        '<div><label>'+esc(T('ob_rank'))+'</label><input id="ob_rank"></div>'+
        '<div><label>'+esc(T('ob_nation'))+'</label><input id="ob_nat"></div>'+
        '<div><label>'+esc(T('ob_phone'))+'</label><input id="ob_ph"></div>'+
      '</div>'+
      '<div id="obBulk" style="display:none"><label>'+esc(T('ob_bulk_h'))+'</label>'+
        '<textarea id="ob_bulk" rows="7" style="width:100%;font-family:var(--font-mono);font-size:12px" '+
        'placeholder="Jane Doe, jane@mod.gov, MoD&#10;John Roe, john@landcom.nato.int, LANDCOM"></textarea></div>'+
      '<div class="ferr" id="obErr"></div>';
    openDrawer(T('ob_title'), body,
      '<div class="sp"></div><button class="btn btn-ghost" id="obCancel">'+esc(T('ob_cancel'))+'</button>'+
      '<button class="btn btn-primary" id="obSave">'+esc(T('ob_save'))+'</button>');
    $('#obCancel').addEventListener('click',closeDrawer);
    $('#obSave').addEventListener('click',doOnBehalf);
    $('#obS').addEventListener('click',function(){ OB_MODE='single'; this.classList.add('on'); $('#obB').classList.remove('on');
      $('#obSingle').style.display=''; $('#obBulk').style.display='none'; });
    $('#obB').addEventListener('click',function(){ OB_MODE='bulk'; this.classList.add('on'); $('#obS').classList.remove('on');
      $('#obSingle').style.display='none'; $('#obBulk').style.display=''; });
  }
  function v(id){ var el=$('#'+id); return el?el.value.trim():''; }
  async function doOnBehalf(){
    var uid=SESSION.user.id, rows=[];
    if(OB_MODE==='single'){
      var fn=v('ob_fn'), ln=v('ob_ln');
      if(!fn&&!ln){ $('#obErr').textContent=T('ob_need'); return; }
      rows.push({ first_name:fn||null, last_name:ln||null, email:v('ob_em')||null,
        institution:v('ob_org')||null, rank_title:v('ob_rank')||null, country:v('ob_nat')||null, phone:v('ob_ph')||null });
    } else {
      var lines=(v('ob_bulk')||'').split('\n').map(function(s){return s.trim();}).filter(Boolean);
      if(!lines.length){ $('#obErr').textContent=T('ob_need'); return; }
      rows=lines.map(function(l){
        var p=l.split(',').map(function(x){return x.trim();});
        var name=(p[0]||'').split(/\s+/); var fn=name.shift()||''; var ln=name.join(' ');
        return { first_name:fn||null, last_name:ln||null, email:p[1]||null, institution:p[2]||null };
      }).filter(function(r){ return r.first_name||r.last_name; });
      if(!rows.length){ $('#obErr').textContent=T('ob_need'); return; }
    }
    var payload=rows.map(function(r){ return Object.assign({
      event_id:EVENT.id, user_id:null, registered_by:uid, is_delegated:true, status:'approved', answers:{} }, r); });
    var res=await sb.from('conventus_registrations').insert(payload);
    if(res.error){ $('#obErr').textContent=res.error.message; return; }
    closeDrawer(); toast(Tf('ob_added', payload.length)); await tReg();
  }
  function regActions(x){
    var id=esc(x.id), s=x.status, out=[];
    function btn(to,lbl,cls){ return '<button class="btn btn-ghost btn-sm'+(cls||'')+'" data-id="'+id+'" data-set="'+to+'">'+esc(T(lbl))+'</button>'; }
    if(s==='submitted'||s==='under_review'||s==='draft'||s==='waitlisted'||s==='pending'){
      out.push(btn('approved','act_approve'));
      out.push(btn('rejected','act_reject'));
      if(s!=='waitlisted') out.push(btn('waitlisted','act_wait'));
    } else if(s==='approved'){
      out.push(btn('checked_in','act_checkin'));
    }
    return out.join(' ');
  }
  async function setStatus(id,to){
    var res=await sb.from('conventus_registrations').update({status:to}).eq('id',id);
    if(res.error){ toast(res.error.message,true); return; }
    var row=REGS.find(function(x){return String(x.id)===String(id);}); if(row) row.status=to;
    toast(T('done')); drawReg();
  }

  $('#langBtn').addEventListener('click',function(){ if(window.CVPrefs) CVPrefs.toggleLang(); });
  $('#themeBtn').addEventListener('click',function(){ if(window.CVPrefs) CVPrefs.toggleTheme(); });
  if(window.CVPrefs&&CVPrefs.onChange) CVPrefs.onChange(function(w){ if(w==='lang'&&EVENT) render(); });
})();
</script>
</body>
</html>
