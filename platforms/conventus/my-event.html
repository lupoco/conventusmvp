<!doctype html>
<html lang="en" data-platform="conventus">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>My Event · Conventus · Conventity</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
<script src="/assets/js/cv-config.js"></script>
<script src="/assets/prefs.js"></script>
<link rel="stylesheet" href="/assets/tokens.css"/>
<link rel="stylesheet" href="/assets/base.css"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/cv-core.js"></script>
<style>
  .bar{position:sticky;top:0;z-index:var(--z-nav);display:flex;align-items:center;gap:12px;padding:0 16px;height:56px;
    border-bottom:1px solid var(--line);background:var(--nav-bg)}
  .bar .back{font-family:var(--font-mono);font-size:12px;color:var(--muted)}
  .bar .sp{flex:1}
  .tbtn{font-family:var(--font-mono);font-size:11px;font-weight:700;color:var(--muted);background:var(--paper-2);
    border:1px solid var(--line-2);border-radius:var(--r-pill);padding:6px 12px}
  .tbtn:hover{color:var(--pf);border-color:var(--pf)}
  .wrap{max-width:940px;margin:0 auto;padding:24px 16px 80px}
  .head h1{font-size:clamp(1.9rem,4.5vw,3rem)}
  .subline{color:var(--muted);font-size:13px;margin:4px 0 4px;display:flex;gap:12px;flex-wrap:wrap}
  .banner{display:flex;align-items:center;gap:12px;padding:14px 18px;border-radius:var(--r-lg);border:1px solid var(--line);
    background:var(--paper);margin:18px 0}
  .banner .ic{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;
    font-weight:700;color:#fff}
  .banner.ok .ic{background:var(--ok)} .banner.warn .ic{background:var(--warn)} .banner.bad .ic{background:var(--danger)}
  .banner .t{font-weight:700;color:var(--ink)} .banner .d{font-size:13px;color:var(--muted)}
  .grid{display:grid;grid-template-columns:320px 1fr;gap:20px;align-items:start}
  @media(max-width:760px){.grid{grid-template-columns:1fr}}
  .badge-card{background:linear-gradient(160deg,var(--brand-ink),#123a6b);color:#fff;border-radius:var(--r-lg);
    padding:20px;box-shadow:var(--shadow-2);position:relative;overflow:hidden}
  .badge-card .ev{font-family:var(--font-mono);font-size:10px;letter-spacing:.14em;opacity:.75;text-transform:uppercase}
  .badge-card .nm{font-family:var(--font-display);font-size:1.9rem;line-height:1.05;margin:6px 0 2px}
  .badge-card .rk{font-size:13px;opacity:.9}
  .badge-card .org{font-size:13px;opacity:.8;margin-top:2px}
  .badge-card .acc{display:inline-block;margin-top:14px;font-family:var(--font-mono);font-size:10px;font-weight:700;
    letter-spacing:.08em;text-transform:uppercase;padding:3px 10px;border-radius:var(--r-pill);
    background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3)}
  .badge-card .code{font-family:var(--font-mono);font-size:11px;opacity:.7;margin-top:16px;letter-spacing:.1em}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;margin-bottom:16px}
  .card h3{font-family:var(--font-display);font-weight:400;font-size:1.3rem;margin-bottom:4px}
  .card .eyebrow{margin-bottom:10px}
  .ann{border-top:1px solid var(--line);padding:12px 0}
  .ann:first-of-type{border-top:none}
  .ann .at{font-weight:700;color:var(--ink);font-size:14px}
  .ann .ab{font-size:13px;color:var(--ink-2);white-space:pre-wrap;margin-top:3px}
  .ann .ad{font-family:var(--font-mono);font-size:10px;color:var(--muted);margin-top:5px}
  .kv{display:grid;grid-template-columns:150px 1fr;gap:6px 14px;font-size:13.5px}
  .kv dt{color:var(--muted);font-size:12px} .kv dd{margin:0;color:var(--ink)}
  .empty{color:var(--muted);font-size:13px;padding:8px 0}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .gate{max-width:460px;margin:12vh auto;text-align:center}
  .gate h2{font-family:var(--font-display);font-weight:400;font-size:1.9rem;margin-bottom:8px}
  .gate p{color:var(--muted);margin-bottom:18px}
</style>
</head>
<body>
<div class="bar">
  <a class="back" href="/platforms/conventus/my-events.html">← <span id="backLbl">My events</span></a>
  <div class="sp"></div>
  <button class="tbtn" id="langBtn">TR/EN</button>
  <button class="tbtn" id="themeBtn">◐</button>
</div>
<div class="wrap" id="wrap"><div class="empty" id="boot">…</div></div>

<script>
(function(){
  'use strict';
  var SB_URL=window.__CV_SUPABASE_URL;
  var SB_KEY=window.__CV_ANON_KEY;
  var sb=window.cvClient();
  window.__cvSb=sb;

  var I18N={
   tr:{ back:'Etkinliklerim', signin:'Giriş gerekli', signin_d:'My Event sayfası için giriş yap.', signin_b:'Giriş yap',
     notfound:'Etkinlik ya da kaydın bulunamadı', notfound_d:'Bağlantı geçersiz ya da bu etkinliğe kaydın yok.',
     b_approved_t:'Kaydın onaylandı', b_approved_d:'Etkinlik bilgilerine buradan ulaşabilirsin.',
     b_pending_t:'Başvurun incelemede', b_pending_d:'Onaylanınca etkinlik detayları burada açılacak.',
     b_wait_t:'Bekleme listesindesin', b_wait_d:'Yer açılırsa bilgilendirileceksin.',
     b_rejected_t:'Başvurun onaylanmadı', b_rejected_d:'Ayrıntı için organizatörle iletişime geç.',
     badge:'Katılımcı kartı', acc:'akreditasyon', ann:'Duyurular', ann_none:'Henüz duyuru yok.',
     agenda:'Ajanda & Program', agenda_d:'Oturumlar ve program.', open_prog:'Programı aç →',
     details:'Kayıt bilgilerim', logistics:'İdari & Lojistik', log_none:'Henüz lojistik bilgisi girilmedi.',
     d_name:'Ad Soyad', d_rank:'Rütbe', d_org:'Kurum', d_nation:'Ülke', d_role:'Katılım', d_email:'E-posta', d_status:'Durum',
     l_venue:'Mekân', l_address:'Adres', l_transport:'Ulaşım', l_dress:'Kıyafet', l_contact:'İrtibat', l_security:'Güvenlik',
     docs:'Dokümanlar', docs_none:'Henüz doküman paylaşılmadı.',
     cat_general:'Genel', cat_agenda:'Ajanda', cat_venue:'Mekân', cat_travel:'Seyahat', cat_security:'Güvenlik', cat_forms:'Formlar', cat_other:'Diğer',
     handbook:'El Kitabı' },
   en:{ back:'My events', signin:'Sign in required', signin_d:'Sign in to view My Event.', signin_b:'Sign in',
     notfound:'Event or registration not found', notfound_d:'Invalid link, or you are not registered for this event.',
     b_approved_t:'You are approved', b_approved_d:'Access the event details below.',
     b_pending_t:'Your application is under review', b_pending_d:'Details unlock here once approved.',
     b_wait_t:'You are on the waitlist', b_wait_d:'You will be notified if a place opens.',
     b_rejected_t:'Your application was not approved', b_rejected_d:'Contact the organiser for details.',
     badge:'Attendee badge', acc:'accreditation', ann:'Announcements', ann_none:'No announcements yet.',
     agenda:'Agenda & Programme', agenda_d:'Sessions and programme.', open_prog:'Open programme →',
     details:'My registration', logistics:'Admin & Logistics', log_none:'No logistics information yet.',
     d_name:'Name', d_rank:'Rank', d_org:'Organisation', d_nation:'Nation', d_role:'Attending as', d_email:'Email', d_status:'Status',
     l_venue:'Venue', l_address:'Address', l_transport:'Transport', l_dress:'Dress code', l_contact:'Contacts', l_security:'Security',
     docs:'Documents', docs_none:'No documents shared yet.',
     cat_general:'General', cat_agenda:'Agenda', cat_venue:'Venue', cat_travel:'Travel', cat_security:'Security', cat_forms:'Forms', cat_other:'Other',
     handbook:'Handbook' }
  };
  function lang(){ return (window.CVPrefs&&CVPrefs.getLang&&CVPrefs.getLang())||'en'; }
  function T(k){ var d=I18N[lang()]||I18N.en; return d[k]!=null?d[k]:(I18N.en[k]!=null?I18N.en[k]:k); }
  function $(s){ return document.querySelector(s); }
  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function fmtD(iso){ if(!iso) return '—'; var d=new Date(iso);
    return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+d.getFullYear(); }
  function fmtDT(iso){ if(!iso) return '—'; var d=new Date(iso);
    return fmtD(iso)+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }

  var CODE=new URLSearchParams(location.search).get('e');
  var EVENT=null, REG=null, ANN=[], DOCS=[], SESSION=null;

  boot();
  async function boot(){
    var s=await sb.auth.getSession(); SESSION=(s.data&&s.data.session)||null;
    if(!SESSION){ gate('signin'); return; }
    if(!CODE){ gate('notfound'); return; }
    var e=await sb.from('conventus_managed_events').select('*').eq('code',CODE).maybeSingle();
    if(e.error||!e.data){ gate('notfound', e.error&&e.error.message); return; }
    EVENT=e.data;
    var r=await sb.from('conventus_registrations').select('*').eq('event_id',EVENT.id).eq('user_id',SESSION.user.id).maybeSingle();
    if(r.error||!r.data){ gate('notfound', r.error&&r.error.message); return; }
    REG=r.data;
    // approved -> also load announcements
    if(isApproved()){
      var a=await sb.from('conventus_announcements').select('*').eq('event_id',EVENT.id).eq('is_published',true)
        .order('pinned',{ascending:false}).order('created_at',{ascending:false});
      ANN=(a.error?[]:(a.data||[]));
      // documents (RLS filters by audience automatically)
      var dq=await sb.from('conventus_documents').select('*').eq('event_id',EVENT.id).eq('is_published',true)
        .order('sort_order',{ascending:true}).order('created_at',{ascending:true});
      DOCS=(dq.error?[]:(dq.data||[]));
    }
    render();
  }
  function isApproved(){ return REG && (REG.status==='approved'||REG.status==='checked_in'); }
  function bucket(){
    var s=REG?REG.status:'';
    if(s==='approved'||s==='checked_in') return 'approved';
    if(s==='rejected'||s==='cancelled'||s==='no_show') return 'rejected';
    if(s==='waitlisted') return 'wait';
    return 'pending';
  }
  function gate(kind,detail){
    var map={signin:['signin','signin_d','/login.html','signin_b'],notfound:['notfound','notfound_d',null,null]};
    var g=map[kind];
    $('#wrap').innerHTML='<div class="gate"><h2>'+esc(T(g[0]))+'</h2><p>'+esc(T(g[1]))+
      (detail?'<br><span class="mono" style="font-size:11px">'+esc(detail)+'</span>':'')+'</p>'+
      (g[2]?'<a class="btn btn-primary" href="'+g[2]+'">'+esc(T(g[3]))+'</a>':'')+'</div>';
  }

  function render(){
    $('#backLbl').textContent=T('back');
    var b=bucket();
    var bmap={approved:['ok','✓','b_approved_t','b_approved_d'],pending:['warn','…','b_pending_t','b_pending_d'],
      wait:['warn','~','b_wait_t','b_wait_d'],rejected:['bad','✕','b_rejected_t','b_rejected_d']};
    var bi=bmap[b];
    var loc=[EVENT.city,EVENT.country].filter(Boolean).join(', ')||EVENT.location||'';
    var html=''+
      '<div class="head"><div class="eyebrow">'+esc(EVENT.code)+'</div><h1>'+esc(EVENT.title||EVENT.code)+'</h1></div>'+
      '<div class="subline">'+(EVENT.start_date?'<span>📅 '+esc([fmtD(EVENT.start_date),fmtD(EVENT.end_date)].filter(function(x){return x!=='—';}).join(' – '))+'</span>':'')+
        (loc?'<span>📍 '+esc(loc)+'</span>':'')+'</div>'+
      '<div class="banner '+bi[0]+'"><div class="ic">'+bi[1]+'</div><div><div class="t">'+esc(T(bi[2]))+'</div>'+
        '<div class="d">'+esc(T(bi[3]))+'</div></div></div>';

    if(b==='approved'){
      html+='<div class="grid"><div>'+badgeCard()+detailsCard()+'</div><div>'+annCard()+agendaCard()+documentsCard()+logisticsCard()+'</div></div>';
    }
    $('#wrap').innerHTML=html;
  }

  function fullName(){ return [REG.first_name,REG.last_name].filter(Boolean).join(' ')|| (SESSION.user.email||'—'); }
  function badgeCard(){
    return '<div class="badge-card">'+
      '<div class="ev">'+esc(EVENT.title||EVENT.code)+'</div>'+
      '<div class="nm">'+esc(fullName())+'</div>'+
      (REG.rank_title?'<div class="rk">'+esc(REG.rank_title)+'</div>':'')+
      (REG.institution?'<div class="org">'+esc(REG.institution)+(REG.country?' · '+esc(REG.country):'')+'</div>':'')+
      (REG.role?'<div class="acc">'+esc(REG.role)+'</div>':'<div class="acc">'+esc(T('acc'))+'</div>')+
      '<div class="code">'+esc(EVENT.code)+' · '+esc(String(REG.id||'').slice(0,8))+'</div>'+
    '</div>';
  }
  function detailsCard(){
    var a=REG.answers||{};
    var rows=kv('d_name',fullName())+kv('d_rank',REG.rank_title)+kv('d_org',REG.institution)+
      kv('d_nation',REG.country)+kv('d_role',REG.role)+kv('d_email',REG.email)+
      Object.keys(a).map(function(k){ return '<dt>'+esc(k)+'</dt><dd>'+esc(String(a[k]))+'</dd>'; }).join('');
    return '<div class="card"><div class="eyebrow">'+esc(EVENT.code)+'</div><h3>'+esc(T('details'))+'</h3><dl class="kv">'+rows+'</dl></div>';
  }
  function kv(k,v){ return '<dt>'+esc(T(k))+'</dt><dd>'+esc(v||'—')+'</dd>'; }

  function annCard(){
    var body= ANN.length ? ANN.map(function(x){
      return '<div class="ann"><div class="at">'+(x.pinned?'📌 ':'')+esc(x.title)+'</div>'+
        (x.body?'<div class="ab">'+esc(x.body)+'</div>':'')+'<div class="ad">'+esc(fmtDT(x.created_at))+'</div></div>';
    }).join('') : '<div class="empty">'+esc(T('ann_none'))+'</div>';
    return '<div class="card"><h3>'+esc(T('ann'))+'</h3>'+body+'</div>';
  }
  function agendaCard(){
    var e=encodeURIComponent(EVENT.code||'');
    return '<div class="card"><h3>'+esc(T('agenda'))+'</h3><div class="empty">'+esc(T('agenda_d'))+'</div>'+
      '<div class="actions"><a class="btn btn-sm" href="/platforms/conventus/programme.html?e='+e+'">'+esc(T('open_prog'))+'</a></div></div>';
  }
  function documentsCard(){
    var body = DOCS.length ? DOCS.map(function(d){
      var cat='<span class="mono" style="font-size:10px;color:var(--muted)">'+esc(T('cat_'+d.category)||d.category)+'</span>';
      var title=esc(d.title);
      var link=d.url ? '<a href="'+esc(d.url)+'" target="_blank" rel="noopener">'+title+' ↗</a>' : title;
      return '<div class="ann"><div class="at">'+link+'</div><div class="ad">'+cat+'</div></div>';
    }).join('') : '<div class="empty">'+esc(T('docs_none'))+'</div>';
    return '<div class="card"><h3>'+esc(T('docs'))+'</h3>'+body+'</div>';
  }
  function logisticsCard(){
    var L=EVENT.logistics||{}; var has=L&&typeof L==='object'&&Object.keys(L).length;
    var e=encodeURIComponent(EVENT.code||'');
    var rows= has ? (
      kvIf('l_venue',L.venue)+kvIf('l_address',L.address)+kvIf('l_transport',L.transport)+
      kvIf('l_dress',L.dress_code)+kvIf('l_contact',L.contacts)+kvIf('l_security',L.security)
    ) : '';
    return '<div class="card"><h3>'+esc(T('logistics'))+'</h3>'+
      (rows?'<dl class="kv">'+rows+'</dl>':'<div class="empty">'+esc(T('log_none'))+'</div>')+
      '<div class="actions"><a class="btn btn-ghost btn-sm" href="/platforms/conventus/handbook.html?e='+e+'">'+esc(T('handbook'))+'</a></div></div>';
  }
  function kvIf(k,v){ return v ? ('<dt>'+esc(T(k))+'</dt><dd>'+esc(typeof v==='object'?JSON.stringify(v):v)+'</dd>') : ''; }

  $('#langBtn').addEventListener('click',function(){ if(window.CVPrefs) CVPrefs.toggleLang(); });
  $('#themeBtn').addEventListener('click',function(){ if(window.CVPrefs) CVPrefs.toggleTheme(); });
  if(window.CVPrefs&&CVPrefs.onChange) CVPrefs.onChange(function(w){ if(w==='lang'&&EVENT) render(); });
})();
</script>
</body>
</html>
