<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>My Events · Conventus</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<script src="/assets/js/cv-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/cv-core.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --pf:#004990; --pf-glow:rgba(0,73,144,.10);
  --bg:#F5F2EC; --paper:#fff; --paper2:#FAF7F1;
  --ink:#0E2148; --ink2:#1F2D55; --muted:#5A6486;
  --line:#E5DFD2; --line2:#D6CFBE;
  --btnd:#0E2148;
  --ok:#1E8E5A; --warn:#B7791F; --bad:#C0392B;
  --ok-bg:rgba(30,142,90,.09); --warn-bg:rgba(183,121,31,.10); --bad-bg:rgba(192,57,43,.08);
}
[data-dark]{
  --pf:#4B92DB; --pf-glow:rgba(75,146,219,.12);
  --bg:#0B1428; --paper:#101C36; --paper2:#0E1A32;
  --ink:#EEF1F7; --ink2:#AAB4C8; --muted:#7F8AA2;
  --line:#243456; --line2:#2A3A5E;
  --btnd:#EEF1F7;
  --ok:#34C97F; --warn:#E0A63C; --bad:#E4604E;
}
body{background:var(--bg);color:var(--ink);font-family:'Manrope',system-ui,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
a{color:var(--pf);text-decoration:none}
.hidden{display:none !important}
.bar{position:sticky;top:0;z-index:60;display:flex;align-items:center;justify-content:space-between;gap:.8rem;padding:0 1.3rem;height:56px;background:var(--paper);border-bottom:1px solid var(--line)}
.bar-l{display:flex;align-items:center;gap:10px}
.badge{background:var(--pf);color:#fff;padding:3px 11px;border-radius:100px;font-size:10px;letter-spacing:.12em;font-weight:700;font-family:'JetBrains Mono',monospace;white-space:nowrap}
.crumb{font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
.bar-r{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.pill{padding:5px 12px;background:var(--paper2);border:1px solid var(--line);border-radius:100px;cursor:pointer;font-size:11px;font-weight:800;color:var(--muted);font-family:inherit;transition:all .15s;white-space:nowrap;text-decoration:none}
.pill:hover{border-color:var(--pf);color:var(--pf)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:100px;overflow:hidden;background:var(--paper2)}
.seg button{padding:5px 11px;background:transparent;border:none;color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;cursor:pointer;transition:all .15s}
.seg button.on{background:var(--pf);color:#fff}
.wrap{max-width:820px;margin:0 auto;padding:2rem 1.3rem 6rem}
.hero{margin-bottom:1.4rem}
.hero h1{font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(1.6rem,4vw,2.2rem)}
.hero h1 em{font-style:normal;color:var(--pf)}
.hero p{font-size:.85rem;color:var(--muted);margin-top:.3rem}
.gate{max-width:460px;margin:12vh auto 0;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:2.2rem;text-align:center;box-shadow:0 14px 40px rgba(14,33,72,.06)}
.gate h2{font-family:'Instrument Serif',serif;font-weight:400;font-size:1.7rem;margin-bottom:.5rem}
.gate h2 em{font-style:normal;color:var(--pf)}
.gate p{font-size:.86rem;color:var(--muted);line-height:1.65;margin-bottom:1.3rem}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:11px;font-family:inherit;font-size:.85rem;font-weight:700;cursor:pointer;border:none;transition:all .15s;text-decoration:none}
.btn-primary{background:var(--btnd);color:var(--paper)}
[data-dark] .btn-primary{color:#0E1A32}
.btn-primary:hover{background:var(--pf);color:#fff}
.btn-ghost{background:var(--paper2);color:var(--ink2);border:1px solid var(--line)}
.btn-ghost:hover{border-color:var(--pf);color:var(--pf)}
.btn-sm{padding:6px 12px;font-size:.74rem;border-radius:9px}
.list{display:flex;flex-direction:column;gap:12px}
.item{background:var(--paper);border:1px solid var(--line);border-left:3px solid var(--line2);border-radius:14px;padding:1.1rem 1.25rem;transition:box-shadow .15s}
.item:hover{box-shadow:0 8px 24px rgba(14,33,72,.06)}
.item.ap{border-left-color:var(--ok)}
.item.pe{border-left-color:var(--warn)}
.item.re{border-left-color:var(--bad)}
.it-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.it-title{font-family:'Instrument Serif',serif;font-weight:400;font-size:1.15rem}
.code{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.1em;color:var(--muted)}
.chip{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.08em;padding:3px 9px;border-radius:100px;border:1px solid;white-space:nowrap}
.chip.ok{border-color:var(--ok);color:var(--ok);background:var(--ok-bg)}
.chip.warn{border-color:var(--warn);color:var(--warn);background:var(--warn-bg)}
.chip.bad{border-color:var(--bad);color:var(--bad);background:var(--bad-bg)}
.it-meta{display:flex;gap:14px;flex-wrap:wrap;font-size:.77rem;color:var(--muted);margin-top:5px}
.it-meta b{color:var(--ink)}
.it-foot{display:flex;gap:7px;margin-top:.8rem;flex-wrap:wrap}
.empty{background:var(--paper2);border:1px dashed var(--line2);border-radius:16px;padding:2.6rem;text-align:center;color:var(--muted);font-size:.9rem}
@media(max-width:680px){
  .bar{flex-wrap:wrap;height:auto;padding:.55rem 1rem;row-gap:.4rem}
  .crumb{display:none}
}
</style>
</head>
<body>

<div class="bar">
  <div class="bar-l">
    <span class="badge">CONVENTUS</span>
    <span class="crumb" data-i18n="crumb">My Events</span>
  </div>
  <div class="bar-r">
    <a class="pill" href="index.html" data-i18n="back">← Conventus</a>
    <a class="pill" href="go-and-test.html" data-i18n="browse">Browse events</a>
    <div class="seg"><button id="langEN">EN</button><button id="langTR">TR</button></div>
    <button class="pill" id="themeBtn">🌙</button>
  </div>
</div>

<div class="gate hidden" id="gateAuth">
  <h2 data-i18n-html="g_auth_h">Sign in <em>required</em></h2>
  <p data-i18n="g_auth_p">Sign in to see the events you've registered for.</p>
  <a class="btn btn-primary" href="/login.html" data-i18n="g_auth_b">Sign in</a>
</div>

<div class="wrap hidden" id="main">
  <div class="hero">
    <h1 data-i18n-html="h1">My <em>Events</em></h1>
    <p data-i18n="h1p">Your registrations, their status, and quick access to each event's programme and travel plan.</p>
  </div>
  <div class="list" id="list"></div>
</div>

<script>
(function(){
  var sb=window.cvClient();

  var I18N={
   en:{
    crumb:'My Events',back:'← Conventus',browse:'Browse events',
    g_auth_h:'Sign in <em>required</em>',g_auth_p:'Sign in to see the events you\u2019ve registered for.',g_auth_b:'Sign in',
    h1:'My <em>Events</em>',h1p:'Your registrations, their status, and quick access to each event\u2019s programme and travel plan.',
    APPROVED:'✓ APPROVED',PENDING:'PENDING',REJECTED:'REJECTED',
    applied:'Applied',
    b_prog:'▦ Programme',b_plan:'⚑ Go & Meet — My Plan',b_reg:'✎ My registration',b_myevent:'◈ My Event',
    empty:'You haven\u2019t registered for any events yet.',
    empty_cta:'Browse events →'
   },
   tr:{
    crumb:'Etkinliklerim',back:'← Conventus',browse:'Etkinliklere göz at',
    g_auth_h:'Giriş <em>gerekli</em>',g_auth_p:'Kayıt olduğunuz etkinlikleri görmek için giriş yapın.',g_auth_b:'Giriş yap',
    h1:'<em>Etkinliklerim</em>',h1p:'Kayıtlarınız, durumları ve her etkinliğin programına ve seyahat planına hızlı erişim.',
    APPROVED:'✓ ONAYLI',PENDING:'BEKLEMEDE',REJECTED:'REDDEDİLDİ',
    applied:'Başvuru',
    b_prog:'▦ Program',b_plan:'⚑ Go & Meet — Planım',b_reg:'✎ Başvurum',b_myevent:'◈ Etkinliğim',
    empty:'Henüz bir etkinliğe kayıt olmadınız.',
    empty_cta:'Etkinliklere göz at →'
   }
  };
  var LANG=localStorage.getItem('cv-lang')||'en';
  function t(k){var d=I18N[LANG]||I18N.en;return (k in d)?d[k]:(I18N.en[k]!==undefined?I18N.en[k]:k);}
  function applyI18n(){
    document.documentElement.lang=LANG;
    document.querySelectorAll('[data-i18n]').forEach(function(el){el.textContent=t(el.dataset.i18n);});
    document.querySelectorAll('[data-i18n-html]').forEach(function(el){el.innerHTML=t(el.dataset.i18nHtml);});
    $('langEN').classList.toggle('on',LANG==='en');
    $('langTR').classList.toggle('on',LANG==='tr');
  }
  function setLang(l){LANG=l;localStorage.setItem('cv-lang',l);applyI18n();if(READY)render();}

  var REGS=[], EVMAP={}, READY=false;
  var $=function(id){return document.getElementById(id);};
  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');}
  function fmtD(s){if(!s)return'';var p=String(s).slice(0,10).split('-');return p[2]+'.'+p[1]+'.'+p[0];}
  function dr(a,b){a=fmtD(a);b=fmtD(b);if(a&&b&&a!==b)return a+' → '+b;return a||b||'';}

  var dark=localStorage.getItem('cn-dark')==='1';
  function applyDark(){document.body.toggleAttribute('data-dark',dark);$('themeBtn').textContent=dark?'☀️':'🌙';}
  applyDark();
  $('themeBtn').onclick=function(){dark=!dark;localStorage.setItem('cn-dark',dark?'1':'0');applyDark();};
  $('langEN').onclick=function(){setLang('en');};
  $('langTR').onclick=function(){setLang('tr');};
  applyI18n();

  init();
  async function init(){
    var s=await sb.auth.getSession();
    if(!s.data||!s.data.session){show($('gateAuth'));return;}
    var uid=s.data.session.user.id;

    var r=await sb.from('conventus_registrations').select('*')
      .eq('user_id',uid).order('created_at',{ascending:false});
    REGS=r.error?[]:(r.data||[]);

    var ids=REGS.map(function(x){return x.event_id;}).filter(function(v,i,a){return v!=null&&a.indexOf(v)===i;});
    if(ids.length){
      var e=await sb.from('conventus_managed_events').select('*').in('id',ids);
      (e.data||[]).forEach(function(ev){EVMAP[ev.id]=ev;});
    }
    show($('main'));
    READY=true;
    render();
  }
  function show(el){el.classList.remove('hidden');}

  function render(){
    if(!REGS.length){
      $('list').innerHTML='<div class="empty">'+t('empty')
        +'<div style="margin-top:1rem"><a class="btn btn-primary" href="go-and-test.html">'+t('empty_cta')+'</a></div></div>';
      return;
    }
    $('list').innerHTML=REGS.map(function(rg){
      var ev=EVMAP[rg.event_id];
      var raw=(rg.status||'submitted').toLowerCase();
      var st=(raw==='approved'||raw==='checked_in')?'APPROVED'
        :((raw==='rejected'||raw==='cancelled'||raw==='no_show')?'REJECTED':'PENDING');
      var cls=st==='APPROVED'?'ap':(st==='REJECTED'?'re':'pe');
      var chip=st==='APPROVED'?'<span class="chip ok">'+t('APPROVED')+'</span>'
        :(st==='REJECTED'?'<span class="chip bad">'+t('REJECTED')+'</span>'
        :'<span class="chip warn">'+t('PENDING')+'</span>');
      var title=ev?ev.title:'—';
      var code=ev?ev.code:'';
      var e=encodeURIComponent(code);
      var loc=ev?([ev.city,ev.country].filter(Boolean).join(', ')||ev.location||''):'';
      var acts='<a class="btn btn-primary btn-sm" href="/platforms/conventus/my-event.html?e='+e+'">'+t('b_myevent')+'</a>';
      acts+='<a class="btn btn-ghost btn-sm" href="programme.html?e='+e+'">'+t('b_prog')+'</a>';
      if(st==='APPROVED')acts+='<a class="btn btn-ghost btn-sm" href="gm-plan.html?e='+e+'">'+t('b_plan')+'</a>';
      acts+='<a class="btn btn-ghost btn-sm" href="/platforms/conventus/register-conventus.html?e='+e+'">'+t('b_reg')+'</a>';
      return '<div class="item '+cls+'">'
        +'<div class="it-top"><span class="it-title">'+esc(title)+'</span><span class="code">'+esc(code)+'</span>'+chip+'</div>'
        +'<div class="it-meta">'
          +(ev&&dr(ev.start_date,ev.end_date)?'<span>📅 <b>'+esc(dr(ev.start_date,ev.end_date))+'</b></span>':'')
          +(loc?'<span>📍 <b>'+esc(loc)+'</b></span>':'')
          +(rg.created_at?'<span>'+t('applied')+': <b>'+esc(fmtD(rg.created_at))+'</b></span>':'')
        +'</div>'
        +'<div class="it-foot">'+acts+'</div>'
      +'</div>';
    }).join('');
  }
})();
</script>
</body>
</html>
