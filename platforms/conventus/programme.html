<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Programme · Conventus · Conventity</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --pf:#004990; --pf-glow:rgba(0,73,144,.12);
  --bg:#F5F2EC; --paper:#fff; --paper2:#FAF7F1;
  --ink:#0E2148; --ink2:#1F2D55; --muted:#5A6486;
  --line:#E5DFD2; --line2:#D6CFBE;
}
[data-dark]{
  --bg:#0B1428; --paper:#101C36; --paper2:#0E1A32;
  --ink:#EEF1F7; --ink2:#AAB4C8; --muted:#7F8AA2;
  --line:#243456; --line2:#2A3A5E;
  --pf:#4B92DB; --pf-glow:rgba(75,146,219,.12);
}
body{background:var(--bg);color:var(--ink);font-family:'Manrope',system-ui,sans-serif;min-height:100vh}
a{color:var(--pf);text-decoration:none}
.hidden{display:none !important}

/* BAR */
.bar{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:0 1.4rem;height:52px;background:var(--paper);border-bottom:1px solid var(--line)}
.crumbs{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--muted)}
.badge{background:var(--pf);color:#fff;padding:2px 9px;border-radius:100px;font-size:10px;letter-spacing:.1em;font-weight:700;font-family:'JetBrains Mono',monospace}
.bar-right{display:flex;align-items:center;gap:8px}
.pill-btn{padding:5px 11px;background:var(--paper2);border:1px solid var(--line);border-radius:100px;cursor:pointer;font-size:11px;font-weight:700;color:var(--muted);font-family:inherit;transition:all .15s}
.pill-btn:hover{border-color:var(--pf);color:var(--pf)}
.tfmt{display:inline-flex;border:1px solid var(--line);border-radius:100px;overflow:hidden}
.tfmt button{padding:5px 11px;background:transparent;border:none;color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;cursor:pointer;transition:all .15s}
.tfmt button.on{background:var(--pf);color:#fff}

.wrap{max-width:820px;margin:0 auto;padding:2.4rem 1.4rem 5rem}

/* GATE */
.gate{max-width:440px;margin:14vh auto 0;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:2rem;text-align:center}
.gate h2{font-family:'Instrument Serif',serif;font-weight:400;font-size:1.5rem;margin-bottom:.5rem}
.gate p{font-size:.85rem;color:var(--muted);line-height:1.6}

/* HEAD */
.eyebrow{display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--pf);font-family:'JetBrains Mono',monospace;margin-bottom:.8rem}
h1{font-family:'Instrument Serif',serif;font-size:clamp(1.8rem,4vw,2.6rem);font-weight:400;line-height:1.12;margin-bottom:.6rem}
h1 em{font-style:normal;color:var(--pf)}
.ev-meta{display:flex;gap:16px;flex-wrap:wrap;font-size:.82rem;color:var(--muted);margin-bottom:.4rem}
.ev-desc{font-size:.86rem;color:var(--muted);line-height:1.65;max-width:60ch;margin-top:.6rem}

/* DAY TABS */
.days{display:flex;gap:7px;flex-wrap:wrap;margin:1.8rem 0 1.4rem;position:sticky;top:52px;z-index:40;background:var(--bg);padding:.6rem 0}
.day-tab{padding:7px 15px;border-radius:100px;border:1px solid var(--line);background:var(--paper);color:var(--muted);font-size:.78rem;font-weight:700;cursor:pointer;font-family:inherit;transition:all .15s}
.day-tab:hover{border-color:var(--pf);color:var(--pf)}
.day-tab.on{background:var(--pf);border-color:var(--pf);color:#fff}

/* DAY SECTION */
.dsec{margin-bottom:2rem}
.dsec-h{display:flex;align-items:center;gap:12px;margin-bottom:.9rem}
.dsec-h .nm{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.14em;font-weight:700;color:var(--pf);text-transform:uppercase}
.dsec-h .ln{flex:1;height:1px;background:var(--line)}
.dsec-h .cnt{font-size:11px;color:var(--muted)}

/* ITEMS */
.pitem{display:grid;grid-template-columns:86px 20px 1fr;gap:0 14px;position:relative;margin-bottom:2px}
.pitem:not(.last)::before{content:'';position:absolute;left:94px;top:26px;bottom:-4px;width:1px;background:var(--line)}
.pt{text-align:right;padding-top:6px}
.pt .t1{font-family:'JetBrains Mono',monospace;font-size:.85rem;font-weight:500;color:var(--ink)}
.pt .t2{font-family:'JetBrains Mono',monospace;font-size:.7rem;color:var(--muted);margin-top:1px}
.pnode{display:flex;flex-direction:column;align-items:center;padding-top:9px}
.pnode .dot{width:11px;height:11px;border-radius:50%;border:2.5px solid var(--paper);box-shadow:0 0 0 1px var(--line2);flex-shrink:0;background:var(--tc,var(--line2))}
.pcard{background:var(--paper);border:1px solid var(--line);border-left:3px solid var(--tc,var(--line2));border-radius:12px;padding:.9rem 1.1rem;margin-bottom:10px}
.pcard-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:3px}
.ptitle{font-weight:800;font-size:.95rem;color:var(--ink)}
.tchip{font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:.1em;padding:2px 8px;border-radius:100px;border:1px solid var(--tc);color:var(--tc);white-space:nowrap}
.pmeta{display:flex;gap:14px;flex-wrap:wrap;font-size:.76rem;color:var(--muted)}
.pdesc{font-size:.8rem;color:var(--muted);line-height:1.6;margin-top:7px}
.pbtns{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.link-btn{display:inline-flex;align-items:center;gap:5px;padding:5px 13px;border-radius:100px;border:1px solid var(--pf);color:var(--pf);font-size:.74rem;font-weight:700;transition:all .15s}
.link-btn:hover{background:var(--pf);color:#fff}
.dempty{background:var(--paper2);border:1px dashed var(--line2);border-radius:12px;padding:1.6rem;text-align:center;color:var(--muted);font-size:.82rem}

/* ANNOUNCEMENTS */
.anns{display:flex;flex-direction:column;gap:9px;margin-top:1.4rem}
.ann{background:var(--pf-glow);border:1px solid var(--pf);border-radius:12px;padding:.85rem 1.05rem}
.ann-t{display:flex;align-items:center;gap:8px;font-weight:800;font-size:.88rem;color:var(--ink)}
.ann-t .pin{font-size:.8rem}
.ann-b{font-size:.8rem;color:var(--muted);line-height:1.6;margin-top:4px;white-space:pre-wrap}
.ann-d{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--muted);margin-top:6px;letter-spacing:.06em}

.foot{margin-top:3rem;padding-top:1.4rem;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-size:.72rem;color:var(--muted)}
.foot b{color:var(--pf)}

/* PRINT */
@media print{
  .bar,.days,.foot .noprint{display:none !important}
  body{background:#fff;color:#000}
  .dsec{display:block !important;page-break-inside:avoid}
  .pcard{border-color:#ccc;box-shadow:none}
  .wrap{padding-top:0}
}
@media(max-width:560px){
  .pitem{grid-template-columns:70px 14px 1fr}
  .pitem:not(.last)::before{left:76px}
}
</style>
<script src="/assets/js/cv-config.js"></script>
<script src="cv-skin.js"></script>
</head>
<body>

<div class="bar">
  <div class="crumbs">
    <a href="/platforms/conventus/index.html" style="text-decoration:none"><span class="badge">CONVENTUS</span></a>
    <span style="opacity:.4">›</span>
    <span>Programme</span>
  </div>
  <div class="bar-right">
    <div class="tfmt">
      <button id="fmt12">12H</button>
      <button id="fmt24">24H</button>
    </div>
    <button class="pill-btn" id="printBtn">🖨 Print</button>
    <button class="pill-btn" id="themeBtn">🌙</button>
  </div>
</div>

<div class="gate hidden" id="gate">
  <h2>Programme not found</h2>
  <p>This link is missing an event code, or the programme hasn't been published yet. Please check the link you received from the organiser.</p>
</div>

<div class="wrap hidden" id="main">
  <div class="eyebrow">■ OFFICIAL PROGRAMME</div>
  <h1 id="evTitle">—</h1>
  <div class="ev-meta" id="evMeta"></div>
  <div class="ev-desc" id="evDesc"></div>

  <div id="annBox"></div>

  <div class="days" id="dayTabs"></div>
  <div id="daySecs"></div>

  <div class="foot">
    <span>Programme is subject to change.</span>
    <span class="noprint">Powered by <b>Conventus</b> · Conventity</span>
  </div>
</div>

<script>
(function(){
  var SB_URL=window.__CV_SUPABASE_URL;
  var SB_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNoYnd5bHJ3cGlvcXlwYmRoamduIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0MjEzMTIsImV4cCI6MjA5Nzk5NzMxMn0.2bZSj_is-oDq_AfZ-llAHFwXCsgRVXrmLw9PoS54qlk';
  function api(path){
    return fetch(SB_URL+'/rest/v1/'+path,{headers:{apikey:SB_ANON,Authorization:'Bearer '+SB_ANON}})
      .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); });
  }

  var TYPES={
    session:    {nm:'Session',        ic:'🎤', c:'#C9973A'},
    meal:       {nm:'Meal',           ic:'🍽️', c:'#0E8C8B'},
    transport:  {nm:'Transport',      ic:'🚌', c:'#004990'},
    social:     {nm:'Social',         ic:'🎉', c:'#B0509E'},
    executive:  {nm:'Executive Time', ic:'💼', c:'#5A6486'},
    networking: {nm:'Networking',     ic:'🤝', c:'#2E8B57'}
  };

  var qs=new URLSearchParams(location.search);
  var CODE=(qs.get('e')||'').trim();
  var EVENT=null, ITEMS=[], curDay='ALL';
  var MODE24=localStorage.getItem('cv-prog-24h')!=='0';

  var $=function(id){return document.getElementById(id);};
  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');}
  function show(el){el.classList.remove('hidden');}

  // theme (aynı anahtar: cn-dark, index ile ortak)
  var dark=localStorage.getItem('cn-dark')==='1';
  function applyDark(){document.body.toggleAttribute('data-dark',dark);$('themeBtn').textContent=dark?'☀️':'🌙';}
  applyDark();
  $('themeBtn').onclick=function(){dark=!dark;localStorage.setItem('cn-dark',dark?'1':'0');applyDark();};

  var MONL=['January','February','March','April','May','June','July','August','September','October','November','December'];
  var DAYL=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  function pd(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);}
  function dayName(s){var d=pd(s);return DAYL[d.getDay()]+', '+d.getDate()+' '+MONL[d.getMonth()];}
  function dayShort(s){var d=pd(s);return DAYL[d.getDay()].slice(0,3)+' '+d.getDate()+' '+MONL[d.getMonth()].slice(0,3);}
  function fmtT(t){
    if(!t)return'';
    var h=+t.slice(0,2),m=t.slice(3,5);
    if(MODE24)return String(h).padStart(2,'0')+':'+m;
    var ap=h>=12?'pm':'am';var h12=h%12;if(h12===0)h12=12;
    return h12+':'+m+' '+ap;
  }
  function setFmtBtns(){$('fmt12').classList.toggle('on',!MODE24);$('fmt24').classList.toggle('on',MODE24);}
  $('fmt12').onclick=function(){MODE24=false;localStorage.setItem('cv-prog-24h','0');setFmtBtns();render();};
  $('fmt24').onclick=function(){MODE24=true;localStorage.setItem('cv-prog-24h','1');setFmtBtns();render();};
  $('printBtn').onclick=function(){var prev=curDay;curDay='ALL';render();setTimeout(function(){window.print();curDay=prev;render();},60);};

  // ---------- BOOT ----------
  init();
  async function init(){
    setFmtBtns();
    if(!CODE){show($('gate'));return;}
    try{
      var evs=await api('conventus_managed_events?select=id,code,title,start_date,end_date,location,host_org,description&code=eq.'+encodeURIComponent(CODE));
      if(!evs.length){show($('gate'));return;}
      EVENT=evs[0];
      // RLS zaten yalnızca yayınlananları verir; filtre yine de açık yazılıyor
      ITEMS=await api('conventus_sessions?select=*&event_id=eq.'+EVENT.id+'&is_published=eq.true&order=session_date.asc&order=start_time.asc&order=sort_order.asc');
      try{
        var anns=await api('conventus_announcements?select=title,body,pinned,created_at&event_id=eq.'+EVENT.id+'&is_published=eq.true&order=pinned.desc&order=created_at.desc');
        renderAnns(anns);
      }catch(e){/* duyuru tablosu yoksa sessizce geç */}
    }catch(e){show($('gate'));return;}

    $('evTitle').innerHTML=esc(EVENT.title).replace(/\s(\S+)$/,' <em>$1</em>');
    var meta=[];
    if(EVENT.start_date){
      var range=dayName(EVENT.start_date);
      if(EVENT.end_date&&EVENT.end_date!==EVENT.start_date)range+=' — '+dayName(EVENT.end_date);
      meta.push('📅 '+range);
    }
    if(EVENT.location)meta.push('📍 '+esc(EVENT.location));
    if(EVENT.host_org)meta.push('🏛 '+esc(EVENT.host_org));
    $('evMeta').innerHTML=meta.map(function(m){return '<span>'+m+'</span>';}).join('');
    if(EVENT.description)$('evDesc').textContent=EVENT.description;

    show($('main'));
    render();
  }

  function renderAnns(anns){
    if(!Array.isArray(anns)||!anns.length)return;
    $('annBox').innerHTML='<div class="anns">'+anns.map(function(a){
      var d=new Date(a.created_at);
      var ds=d.getDate()+' '+MONL[d.getMonth()].slice(0,3).toUpperCase()+' · '
        +String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
      return '<div class="ann">'
        +'<div class="ann-t">'+(a.pinned?'<span class="pin">📌</span>':'📣 ')+esc(a.title)+'</div>'
        +(a.body?'<div class="ann-b">'+esc(a.body)+'</div>':'')
        +'<div class="ann-d">'+ds+'</div>'
      +'</div>';
    }).join('')+'</div>';
  }

  function days(){
    var set={};ITEMS.forEach(function(x){set[x.session_date]=1;});
    return Object.keys(set).sort();
  }

  // ---------- RENDER ----------
  function render(){
    var ds=days();
    if(!ds.length){
      $('dayTabs').innerHTML='';
      $('daySecs').innerHTML='<div class="dempty">The programme hasn\'t been published yet. Please check back later.</div>';
      return;
    }
    if(curDay!=='ALL'&&ds.indexOf(curDay)<0)curDay='ALL';

    $('dayTabs').innerHTML=
      '<button class="day-tab'+(curDay==='ALL'?' on':'')+'" data-d="ALL">All days</button>'
      +ds.map(function(d){
        return '<button class="day-tab'+(d===curDay?' on':'')+'" data-d="'+d+'">'+dayShort(d)+'</button>';
      }).join('');
    $('dayTabs').querySelectorAll('.day-tab').forEach(function(b){
      b.onclick=function(){curDay=b.dataset.d;render();};
    });

    var showDays=curDay==='ALL'?ds:[curDay];
    $('daySecs').innerHTML=showDays.map(function(d){
      var rows=ITEMS.filter(function(x){return x.session_date===d;});
      return '<div class="dsec">'
        +'<div class="dsec-h"><span class="nm">'+dayName(d)+'</span><span class="ln"></span><span class="cnt">'+rows.length+' item'+(rows.length===1?'':'s')+'</span></div>'
        +rows.map(function(x,i){
          var T=TYPES[x.item_type]||TYPES.session;
          var btns=Array.isArray(x.buttons)?x.buttons:[];
          return '<div class="pitem'+(i===rows.length-1?' last':'')+'" style="--tc:'+T.c+'">'
            +'<div class="pt"><div class="t1">'+fmtT(x.start_time)+'</div><div class="t2">'+(x.end_time?('– '+fmtT(x.end_time)):'')+'</div></div>'
            +'<div class="pnode"><span class="dot"></span></div>'
            +'<div class="pcard">'
              +'<div class="pcard-top">'
                +'<span class="ptitle">'+esc(x.title)+'</span>'
                +'<span class="tchip">'+T.ic+' '+T.nm.toUpperCase()+'</span>'
              +'</div>'
              +'<div class="pmeta">'
                +(x.room?'<span>📍 '+esc(x.room)+'</span>':'')
                +(x.speakers?'<span>🎙 '+esc(x.speakers)+'</span>':'')
              +'</div>'
              +(x.description?'<div class="pdesc">'+esc(x.description)+'</div>':'')
              +(btns.length?'<div class="pbtns">'+btns.map(function(b){
                  var u=String(b.u||'');
                  if(u&&!/^https?:\/\//i.test(u))u='https://'+u;
                  return '<a class="link-btn" href="'+esc(u)+'" target="_blank" rel="noopener">🔗 '+esc(b.t||'Link')+'</a>';
                }).join('')+'</div>':'')
            +'</div>'
          +'</div>';
        }).join('')
      +'</div>';
    }).join('');
  }
})();
</script>
</body>
</html>
