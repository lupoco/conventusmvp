<!doctype html>
<html lang="en" data-platform="conventus">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Go &amp; Meet · Conventus · Conventity</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
<script src="/assets/js/cv-config.js"></script>
<script src="/assets/prefs.js"></script>
<link rel="stylesheet" href="/assets/tokens.css"/>
<link rel="stylesheet" href="/assets/base.css"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/cv-core.js"></script>
<style>
  /* ---- kabuk ---------------------------------------------------------- */
  .bar{position:sticky;top:0;z-index:var(--z-nav);display:flex;align-items:center;gap:12px;padding:0 16px;height:56px;
    border-bottom:1px solid var(--line);background:var(--nav-bg)}
  .bar .back{font-family:var(--font-mono);font-size:12px;color:var(--muted);white-space:nowrap}
  .bar .title{font-family:var(--font-display);font-size:1.15rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar .sp{flex:1}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:20px 16px 90px}
  .head h1{font-size:clamp(1.7rem,5vw,2.6rem);margin:0}
  .eyebrow{font-family:var(--font-mono);font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    color:var(--gold,#B8892B);margin-bottom:6px}
  .subline{color:var(--muted);font-size:13px;margin:6px 0 20px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .subline .mono{font-family:var(--font-mono)}
  .empty{padding:26px;text-align:center;color:var(--muted);border:1px dashed var(--line-2);border-radius:var(--r-md);font-size:13px}

  /* ---- bolum baslıgı --------------------------------------------------- */
  .sec{margin:34px 0 0}
  .sec-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:4px}
  .sec-h h2{font-family:var(--font-display);font-weight:400;font-size:clamp(1.25rem,3.4vw,1.65rem);margin:0}
  .sec-h .n{font-family:var(--font-mono);font-size:11px;color:var(--muted)}
  .sec-d{color:var(--muted);font-size:13px;margin:0 0 14px;max-width:62ch}
  .hr{height:1px;background:var(--line);margin:8px 0 16px}

  /* ---- KART IZGARASI — mobil once, sonra genisler ---------------------- */
  .cards{display:grid;gap:14px;grid-template-columns:1fr}
  @media (min-width:560px){ .cards{grid-template-columns:repeat(2,1fr)} }
  @media (min-width:900px){ .cards{grid-template-columns:repeat(3,1fr)} }
  @media (min-width:1280px){ .cards.wide{grid-template-columns:repeat(4,1fr)} }

  .kart{display:flex;flex-direction:column;border:1px solid var(--line-2);border-radius:var(--r-md);
    background:var(--paper);overflow:hidden;min-width:0}
  .kart .body{padding:15px 16px;display:flex;flex-direction:column;gap:7px;flex:1;min-width:0}
  .kart h3{font-family:var(--font-display);font-weight:400;font-size:1.12rem;margin:0;line-height:1.25;
    overflow-wrap:anywhere}
  .kart .who{font-family:var(--font-mono);font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  .kart .desc{font-size:13px;color:var(--muted);line-height:1.5;overflow-wrap:anywhere}
  .kart .meta{display:flex;gap:8px;flex-wrap:wrap;font-family:var(--font-mono);font-size:11px;color:var(--muted);
    margin-top:auto;padding-top:8px}
  .kart .meta span+span::before{content:'·';margin-right:8px;opacity:.55}
  .kart .foot{display:flex;gap:9px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--line);
    background:var(--paper-2)}
  .fiyat{font-family:var(--font-mono);font-weight:700;font-size:15px;color:var(--ink)}
  .fiyat small{font-weight:400;font-size:11px;color:var(--muted)}
  .kart .foot .sp{flex:1}
  .accent{height:3px;background:var(--pf)}

  .st{font-family:var(--font-mono);font-size:9.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
    border:1px solid var(--line-2);border-radius:var(--r-pill);padding:3px 8px;white-space:nowrap}
  .st.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
  .st.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
  .st.n{color:var(--muted)}

  /* ---- etkinlik karti --------------------------------------------------- */
  .ev .body{gap:6px}
  .ev .when{font-family:var(--font-mono);font-size:11.5px;color:var(--pf);font-weight:700}
  .ev .where{font-size:12.5px;color:var(--muted)}

  /* ---- hizmet seridi (etkinlik sayfasi ici gezinme) --------------------- */
  .jump{display:flex;gap:7px;flex-wrap:wrap;margin:16px 0 4px}
  .jump a{font-family:var(--font-mono);font-size:11px;font-weight:700;padding:6px 12px;border-radius:var(--r-pill);
    border:1px solid var(--line-2);color:var(--muted);text-decoration:none;background:var(--paper-2)}
  .jump a:hover{color:var(--pf);border-color:var(--pf)}

  .msg{display:none;margin:12px 0;padding:11px 13px;border-radius:var(--r-md);font-size:13px;line-height:1.5}
  .msg.on{display:block}
  .msg.err{color:var(--danger);border:1px solid color-mix(in srgb,var(--danger) 35%,transparent);
    background:color-mix(in srgb,var(--danger) 7%,transparent)}
  .msg.info{color:var(--muted);border:1px solid var(--line-2);background:var(--paper-2)}

  /* ---- cok dar ekranlar -------------------------------------------------- */
  @media (max-width:380px){
    .wrap{padding:16px 12px 80px}
    .kart .body{padding:13px 13px}
    .kart .foot{padding:11px 13px}
  }
</style>
</head>
<body>
<header class="bar">
  <a class="back" href="/platforms/conventus/index.html" id="backLnk">← Conventus</a>
  <span class="title" id="barTitle">Go &amp; Meet</span>
  <span class="sp"></span>
</header>

<main class="wrap" id="wrap"><div class="empty">…</div></main>

<script>
(function(){
  'use strict';

  /* =========================================================================
     Go & Meet — etkinlik sayfasi
     ?e=<kod> yoksa  : yayindaki etkinliklerin kartlari
     ?e=<kod> varsa  : o etkinligin lojistik sayfasi (konaklama · ulasim/arac
                       · kultur turu · es programi) ve rezervasyon

     NEDEN YENIDEN YAZILDI: onceki surum bir tasarim araci ciktisiydi —
     React + 60KB'lik support.js shim + shadow DOM + icine gomulu EFDI demo
     verisi. CLAUDE.md "Vanilla HTML/CSS/JS, React yok" diyor ve shadow DOM
     yuzunden cv-core'un oturum/tema/dil altyapisina baglanamiyordu.

     KULTUR TURU ve ES PROGRAMI ayri kartlar ama SEMADA TEK KATEGORI
     (culture_spouse — gm_inventory'nin CHECK kisiti). Ayrim details.kind
     ile yapiliyor; ulasimda da ayni desen kullaniliyor. Kisiti degistirmek
     canli veriyi bozacagi icin tercih edilmedi.
     ===================================================================== */

  var sb = (typeof cvClient==='function') ? cvClient() : null;
  var params = new URLSearchParams(location.search);
  var CODE = params.get('e');
  var USER = null, EVENT = null, PLAN = [], BUSY = false;

  /* ---- i18n ---------------------------------------------------------- */
  var I18N = {
    tr:{
      title:'Go & Meet', back:'← Conventus',
      ev_h:'Yaklaşan etkinlikler', ev_d:'Kayıt açık etkinlikler. Bir etkinliğe tıklayarak konaklama, ulaşım ve kültür programını görebilirsin.',
      ev_none:'Şu anda yayında etkinlik yok.',
      ev_open:'Detay ve rezervasyon →', ev_reg:'Kayıt ol',
      nodate:'Tarih belirlenmedi', noloc:'Yer belirlenmedi',
      s_acc:'Konaklama', s_acc_d:'Etkinlik için anlaşmalı oteller. Rezervasyon talebin organizatöre ve otele iletilir.',
      s_car:'Ulaşım & Araç', s_car_d:'Havalimanı transferi, servis ve araç kiralama seçenekleri.',
      s_tour:'Kültür Turu', s_tour_d:'Etkinlik programının dışında, şehri tanımak için düzenlenen turlar.',
      s_spouse:'Eş Programı', s_spouse_d:'Size eşlik edenler için ayrı program. Katılım için ayrıca kayıt gerekir.',
      none_acc:'Bu etkinlik için henüz otel tanımlanmadı.',
      none_car:'Bu etkinlik için henüz ulaşım seçeneği tanımlanmadı.',
      none_tour:'Bu etkinlik için henüz tur tanımlanmadı.',
      none_spouse:'Bu etkinlik için henüz eş programı tanımlanmadı.',
      cap:'%s kişilik', dates:'%s → %s',
      book:'Rezervasyon talebi', booked:'Talep edildi', cancel:'Talebi geri al',
      need_login:'Rezervasyon için giriş yapmalısın.', login:'Giriş yap →',
      booking:'Gönderiliyor…', booked_ok:'Talebin alındı. Organizatör onayladığında haber verilecek.',
      cancel_ok:'Talebin geri alındı.',
      err_book:'Talep gönderilemedi: %s', err_load:'Veriler yüklenemedi: %s',
      notfound:'Etkinlik bulunamadı.', notfound_d:'Bağlantı yanlış olabilir ya da etkinlik yayından kaldırılmış olabilir.',
      all_ev:'← Tüm etkinlikler',
      closed:'Bu etkinlik için lojistik hizmetleri kapalı.',
      req:'talep', req_n:'%s talebin var'
    },
    en:{
      title:'Go & Meet', back:'← Conventus',
      ev_h:'Upcoming events', ev_d:'Events open for registration. Select one to see accommodation, transport and the cultural programme.',
      ev_none:'No published events right now.',
      ev_open:'Details and booking →', ev_reg:'Register',
      nodate:'Dates to be confirmed', noloc:'Location to be confirmed',
      s_acc:'Accommodation', s_acc_d:'Hotels with a conference rate. Your request goes to the organiser and the hotel.',
      s_car:'Transport & Car', s_car_d:'Airport transfer, shuttle and car rental options.',
      s_tour:'Cultural Tour', s_tour_d:'Tours outside the main programme to see the host city.',
      s_spouse:'Spouse Programme', s_spouse_d:'A separate programme for accompanying persons. Requires its own booking.',
      none_acc:'No hotels have been set up for this event yet.',
      none_car:'No transport options have been set up for this event yet.',
      none_tour:'No tours have been set up for this event yet.',
      none_spouse:'No spouse programme has been set up for this event yet.',
      cap:'%s places', dates:'%s → %s',
      book:'Request booking', booked:'Requested', cancel:'Withdraw request',
      need_login:'You need to sign in to book.', login:'Sign in →',
      booking:'Sending…', booked_ok:'Your request was received. The organiser will confirm.',
      cancel_ok:'Your request was withdrawn.',
      err_book:'Could not send the request: %s', err_load:'Could not load: %s',
      notfound:'Event not found.', notfound_d:'The link may be wrong, or the event may have been unpublished.',
      all_ev:'← All events',
      closed:'Logistics services are switched off for this event.',
      req:'request', req_n:'you have %s request(s)'
    }
  };
  function LANG(){ try{ return (localStorage.getItem('cv-lang')||'en').toLowerCase()==='tr'?'tr':'en'; }catch(_){ return 'en'; } }
  function T(k){ var d=I18N[LANG()]||I18N.en; return d[k]!=null?d[k]:(I18N.en[k]!=null?I18N.en[k]:k); }
  function Tf(k){ var a=[].slice.call(arguments,1), s=String(T(k)); a.forEach(function(v){ s=s.replace('%s',v); }); return s; }

  var $ = function(id){ return document.getElementById(id); };
  var esc = function(s){ return String(s==null?'':s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); };

  function dmy(iso){ var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso||'')); return m?m[3]+'.'+m[2]+'.'+m[1]:''; }
  function money(a,c){
    if(a==null||a==='') return '';
    var n=Number(a); if(isNaN(n)) return '';
    try{ return new Intl.NumberFormat(LANG()==='tr'?'tr-TR':'en-GB',
      {style:'currency',currency:c||'EUR',maximumFractionDigits:0}).format(n); }
    catch(_){ return n+' '+(c||'EUR'); }
  }
  function setChrome(){
    var b=$('backLnk'); if(b) b.textContent=T('back');
    var t=$('barTitle'); if(t) t.textContent=T('title');
  }
  function say(kind,html){
    var w=$('wrap'); var m=document.createElement('div');
    m.className='msg on '+kind; m.innerHTML=html; w.insertBefore(m, w.firstChild);
    setTimeout(function(){ try{ m.remove(); }catch(_){}} , 6000);
  }

  /* ---- HIZMET TANIMLARI ------------------------------------------------
     key      : bolum anahtari (gm_services ile ayni ad, es programi haric)
     cat      : gm_inventory.category
     kindNot  : details.kind bu ise bu bolume AIT DEGIL (kultur/es ayrimi)
     kindIs   : details.kind bu ise bu bolume ait                          */
  var SERVICES = [
    { key:'accommodation', svc:'accommodation', cat:'accommodation',
      h:'s_acc',    d:'s_acc_d',    none:'none_acc',    anchor:'konaklama' },
    { key:'transfer_car',  svc:'transfer_car',  cat:'transfer_car',
      h:'s_car',    d:'s_car_d',    none:'none_car',    anchor:'ulasim' },
    { key:'culture',       svc:'culture_spouse', cat:'culture_spouse', kindNot:'spouse',
      h:'s_tour',   d:'s_tour_d',   none:'none_tour',   anchor:'tur' },
    { key:'spouse',        svc:'culture_spouse', cat:'culture_spouse', kindIs:'spouse',
      h:'s_spouse', d:'s_spouse_d', none:'none_spouse', anchor:'es' }
  ];
  function invKind(r){ var d=(r&&r.details)||{}; return String(d.kind||'').toLowerCase(); }
  function belongs(svc, r){
    if(r.category !== svc.cat) return false;
    if(svc.kindIs)  return invKind(r)===svc.kindIs;
    if(svc.kindNot) return invKind(r)!==svc.kindNot;
    return true;
  }
  function eventHasService(svc){
    var list = (EVENT && EVENT.gm_services) || [];
    return list.indexOf(svc.svc) >= 0;
  }

  /* ---- 1) ETKINLIK LISTESI -------------------------------------------- */
  async function renderList(){
    setChrome();
    var r = await sb.from('conventus_managed_events')
      .select('id,code,title,start_date,end_date,city,country,location,host_org,description')
      .eq('published',true).order('start_date',{ascending:true,nullsFirst:false});
    if(r.error){ $('#wrap'); $('wrap').innerHTML='<div class="empty">'+esc(Tf('err_load',r.error.message))+'</div>'; return; }
    var evs = r.data||[];
    var head = '<div class="head"><div class="eyebrow">conventus · go &amp; meet</div>'+
      '<h1>'+esc(T('ev_h'))+'</h1></div>'+
      '<p class="sec-d" style="margin-top:8px">'+esc(T('ev_d'))+'</p>';
    if(!evs.length){ $('wrap').innerHTML = head+'<div class="empty">'+esc(T('ev_none'))+'</div>'; return; }
    $('wrap').innerHTML = head + '<div class="cards wide">' + evs.map(function(e){
      var when = (e.start_date||e.end_date)
        ? (e.end_date && e.end_date!==e.start_date ? Tf('dates',dmy(e.start_date),dmy(e.end_date)) : dmy(e.start_date))
        : T('nodate');
      var where = [e.city,e.country].filter(Boolean).join(', ') || e.location || T('noloc');
      var href = 'go-and-meet.html?e='+encodeURIComponent(e.code||'');
      return '<article class="kart ev"><div class="accent"></div><div class="body">'+
        '<div class="when">'+esc(when)+'</div>'+
        '<h3>'+esc(e.title||e.code)+'</h3>'+
        '<div class="where">'+esc(where)+(e.host_org?' · '+esc(e.host_org):'')+'</div>'+
        (e.description?'<div class="desc">'+esc(String(e.description).slice(0,150))+'</div>':'')+
        '<div class="meta"><span class="mono">'+esc(e.code||'')+'</span></div></div>'+
        '<div class="foot"><a class="btn btn-primary btn-sm" href="'+href+'">'+esc(T('ev_open'))+'</a></div>'+
        '</article>';
    }).join('') + '</div>';
  }

  /* ---- 2) ETKINLIK SAYFASI -------------------------------------------- */
  async function renderEvent(){
    setChrome();
    var r = await sb.from('conventus_managed_events').select('*').eq('code',CODE).maybeSingle();
    if(r.error){ $('wrap').innerHTML='<div class="empty">'+esc(Tf('err_load',r.error.message))+'</div>'; return; }
    if(!r.data){
      $('wrap').innerHTML='<div class="head"><h1>'+esc(T('notfound'))+'</h1></div>'+
        '<p class="sec-d">'+esc(T('notfound_d'))+'</p>'+
        '<p><a class="btn btn-sm" href="go-and-meet.html">'+esc(T('all_ev'))+'</a></p>';
      return;
    }
    EVENT = r.data;
    var t=$('barTitle'); if(t) t.textContent = EVENT.title || EVENT.code;

    /* Envanter ve saglayicilar tek seferde; plan yalniz giris yapmissa. */
    var q = [
      sb.from('gm_inventory')
        .select('id,provider_id,category,title,description,details,price_amount,currency,date_from,date_to,capacity')
        .eq('event_id',EVENT.id).eq('is_active',true).order('category').order('title'),
      sb.from('gm_providers_public').select('id,name,city,country,website')
    ];
    if(USER) q.push(sb.from('gm_plan').select('id,inventory_id,category,status').eq('event_id',EVENT.id).eq('user_id',USER.id));
    var res = await Promise.all(q);
    if(res[0].error){ $('wrap').innerHTML='<div class="empty">'+esc(Tf('err_load',res[0].error.message))+'</div>'; return; }
    var inv = res[0].data||[], provs = res[1].data||[];
    PLAN = (res[2] && res[2].data) ? res[2].data : [];
    var pmap = {}; provs.forEach(function(p2){ pmap[p2.id]=p2; });

    var when = (EVENT.start_date||EVENT.end_date)
      ? (EVENT.end_date && EVENT.end_date!==EVENT.start_date
          ? Tf('dates',dmy(EVENT.start_date),dmy(EVENT.end_date)) : dmy(EVENT.start_date))
      : T('nodate');
    var where = [EVENT.city,EVENT.country].filter(Boolean).join(', ') || EVENT.location || T('noloc');

    var active = SERVICES.filter(eventHasService);
    var html = '<p style="margin:0 0 10px"><a class="back" href="go-and-meet.html" style="text-decoration:none">'+esc(T('all_ev'))+'</a></p>'+
      '<div class="head"><div class="eyebrow">'+esc(EVENT.code||'')+'</div>'+
      '<h1>'+esc(EVENT.title||EVENT.code)+'</h1></div>'+
      '<div class="subline"><span class="mono">'+esc(when)+'</span>·<span>'+esc(where)+'</span>'+
      (EVENT.host_org?'·<span>'+esc(EVENT.host_org)+'</span>':'')+
      (PLAN.length?'·<span class="st ok">'+esc(Tf('req_n',PLAN.length))+'</span>':'')+'</div>';

    if(!active.length){
      $('wrap').innerHTML = html + '<div class="empty">'+esc(T('closed'))+'</div>';
      return;
    }
    html += '<nav class="jump">'+active.map(function(s2){
      return '<a href="#'+s2.anchor+'">'+esc(T(s2.h))+'</a>'; }).join('')+'</nav>';

    active.forEach(function(svc){
      var rows = inv.filter(function(x){ return belongs(svc,x); });
      html += '<section class="sec" id="'+svc.anchor+'">'+
        '<div class="sec-h"><h2>'+esc(T(svc.h))+'</h2>'+
        (rows.length?'<span class="n">'+rows.length+'</span>':'')+'</div>'+
        '<p class="sec-d">'+esc(T(svc.d))+'</p><div class="hr"></div>';
      html += rows.length
        ? '<div class="cards">'+rows.map(function(x){ return invCard(x,pmap); }).join('')+'</div>'
        : '<div class="empty">'+esc(T(svc.none))+'</div>';
      html += '</section>';
    });
    $('wrap').innerHTML = html;
    bindBooking();
  }

  function planFor(invId){ for(var i=0;i<PLAN.length;i++){ if(PLAN[i].inventory_id===invId) return PLAN[i]; } return null; }

  function invCard(x, pmap){
    var p2 = pmap[x.provider_id];
    var bits = [];
    if(x.date_from) bits.push(dmy(x.date_from)+(x.date_to&&x.date_to!==x.date_from?' → '+dmy(x.date_to):''));
    if(x.capacity)  bits.push(Tf('cap',x.capacity));
    var mine = planFor(x.id);
    var price = money(x.price_amount,x.currency);
    var btn = mine
      ? '<span class="st ok">'+esc(T('booked'))+'</span>'+
        '<button class="btn btn-sm" data-cancel="'+esc(mine.id)+'">'+esc(T('cancel'))+'</button>'
      : (USER
          ? '<button class="btn btn-primary btn-sm" data-book="'+esc(x.id)+'" data-cat="'+esc(x.category)+'">'+esc(T('book'))+'</button>'
          : '<a class="btn btn-sm" href="/login.html?next='+encodeURIComponent(location.pathname+location.search)+'">'+esc(T('login'))+'</a>');
    return '<article class="kart"><div class="accent"></div><div class="body">'+
      (p2?'<div class="who">'+esc(p2.name)+(p2.city?' · '+esc(p2.city):'')+'</div>':'')+
      '<h3>'+esc(x.title)+'</h3>'+
      (x.description?'<div class="desc">'+esc(x.description)+'</div>':'')+
      (bits.length?'<div class="meta">'+bits.map(function(b){return '<span>'+esc(b)+'</span>';}).join('')+'</div>':'')+
      '</div><div class="foot">'+
      (price?'<span class="fiyat">'+esc(price)+'</span>':'')+
      '<span class="sp"></span>'+btn+'</div></article>';
  }

  function bindBooking(){
    Array.prototype.forEach.call(document.querySelectorAll('[data-book]'), function(b){
      b.addEventListener('click', function(){ book(b.getAttribute('data-book'), b.getAttribute('data-cat'), b); });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-cancel]'), function(b){
      b.addEventListener('click', function(){ unbook(b.getAttribute('data-cancel'), b); });
    });
  }

  /* Rezervasyon = gm_plan satiri (status 'requested'). RLS zaten
     user_id = auth.uid() ve status='requested' sarti koyuyor; burada
     kullaniciya da ayni dili konusuyoruz: bu bir TALEP, onay degil. */
  async function book(invId, cat, btn){
    if(BUSY||!USER) return; BUSY=true;
    var old=btn.textContent; btn.disabled=true; btn.textContent=T('booking');
    var ins = await sb.from('gm_plan').insert({
      event_id:EVENT.id, user_id:USER.id, category:cat, inventory_id:invId, status:'requested'
    }).select('id,inventory_id,category,status').single();
    BUSY=false;
    if(ins.error){ btn.disabled=false; btn.textContent=old; say('err',esc(Tf('err_book',ins.error.message))); return; }
    PLAN.push(ins.data);
    await renderEvent(); say('info',esc(T('booked_ok')));
  }
  async function unbook(planId, btn){
    if(BUSY) return; BUSY=true;
    btn.disabled=true;
    var del = await sb.from('gm_plan').delete().eq('id',planId);
    BUSY=false;
    if(del.error){ btn.disabled=false; say('err',esc(Tf('err_book',del.error.message))); return; }
    PLAN = PLAN.filter(function(p2){ return p2.id!==planId; });
    await renderEvent(); say('info',esc(T('cancel_ok')));
  }

  /* ---- baslangic ------------------------------------------------------- */
  async function init(){
    if(!sb){ $('wrap').innerHTML='<div class="empty">Supabase client yüklenemedi.</div>'; return; }
    /* Giris ZORUNLU DEGIL: anon akredite envanteri gorur (gmi_anon_showcase),
       yalniz rezervasyon giris ister. Vitrin herkese acik olmali. */
    try{
      var ses = await sb.auth.getSession();
      USER = (ses && ses.data && ses.data.session) ? ses.data.session.user : null;
    }catch(_){ USER=null; }
    if(CODE) await renderEvent(); else await renderList();
  }
  window.addEventListener('cv-lang-change', function(){ if(CODE) renderEvent(); else renderList(); });
  init();
})();
</script>
