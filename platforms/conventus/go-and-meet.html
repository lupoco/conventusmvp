<link rel="stylesheet" href="/assets/base.css"/>

<style>
/* =========================================================================
   Go & Meet — gorsel dil start.html ile AYNI.
   Kullanici "ana sayfa gibi zenginlestir" dedigi icin sayfaya ozel bir palet
   KURULMADI; start.html'in degiskenleri ve tipografisi birebir alindi.
   Instrument Serif (baslik) · Manrope (govde) · JetBrains Mono (etiket)
   krem #F5F2EC · navy #0E2148 · Conventus blue #004990 · altin aksan
   ===================================================================== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --pf:#004990; --pf-glow:rgba(0,73,144,0.15);
  --bg:#F5F2EC; --paper:#fff; --paper2:#FAF7F1;
  --ink:#0E2148; --ink2:#1F2D55; --muted:#5A6486;
  --line:#E5DFD2; --line2:#D6CFBE;
  --gold:#8A6D2F; --gold-glow:rgba(138,109,47,.10);
  --ok:#1F7A4C; --danger:#A33A4A;
}
[data-dark]{
  --bg:#0B1428; --paper:#101C36; --paper2:#0E1A32;
  --ink:#EEF1F7; --ink2:#AAB4C8; --muted:#7F8AA2;
  --line:#243456; --line2:#2A3A5E;
  --pf:#4B92DB; --gold:#C9A961; --gold-glow:rgba(201,169,97,.12);
}
body{background:var(--bg);color:var(--ink);font-family:'Manrope',system-ui,sans-serif;min-height:100vh}

.bar{position:sticky;top:0;z-index:200;display:flex;align-items:center;justify-content:space-between;
  padding:0 1.5rem;height:52px;background:var(--paper);border-bottom:1px solid var(--line)}
.crumbs{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--muted);min-width:0}
.crumbs .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{background:var(--pf);color:#fff;padding:2px 9px;border-radius:100px;font-size:10px;letter-spacing:.1em;font-weight:700}
.ver{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--muted);border:1px solid var(--line);border-radius:100px;padding:2px 7px}
.bar-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.mini{padding:5px 9px;background:var(--paper2);border:1px solid var(--line);border-radius:100px;cursor:pointer;
  font-size:11px;font-weight:700;color:var(--muted);font-family:inherit;transition:all .15s}
.mini:hover,.mini.on{border-color:var(--pf);color:var(--pf)}
.close-btn{display:flex;align-items:center;gap:6px;padding:6px 14px;background:var(--paper2);border:1px solid var(--line);
  border-radius:8px;font-size:12px;font-weight:600;color:var(--ink2);text-decoration:none;transition:all .15s}
.close-btn:hover{border-color:var(--pf);color:var(--pf)}

.wrap{max-width:1120px;margin:0 auto;padding:3.2rem 2rem 6rem}
.head{text-align:center;margin-bottom:2.4rem}
.eyebrow{display:inline-flex;align-items:center;gap:6px;font-family:'JetBrains Mono',monospace;font-size:11px;
  font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--pf);margin-bottom:1rem}
.eyebrow span{white-space:nowrap}
.eyebrow svg{width:14px;height:14px;flex-shrink:0}
h1{font-family:'Instrument Serif',serif;font-size:clamp(2rem,4.4vw,3.2rem);font-weight:400;line-height:1.08;
  color:var(--ink);margin-bottom:.9rem}
h1 em{font-style:normal;color:var(--pf)}
.lead{font-size:.95rem;color:var(--muted);line-height:1.6;max-width:580px;margin:0 auto}
.facts{display:flex;gap:.6rem;flex-wrap:wrap;justify-content:center;margin-top:1.1rem;
  font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--ink2)}
.facts span{display:inline-flex;align-items:center;gap:6px;background:var(--paper);border:1px solid var(--line);
  border-radius:100px;padding:5px 12px}
.facts svg{width:13px;height:13px;color:var(--pf)}

.jump{display:flex;gap:.55rem;flex-wrap:wrap;justify-content:center;margin:0 0 2.2rem}
.jump a{font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;padding:7px 14px;border-radius:100px;border:1px solid var(--line2);
  color:var(--muted);text-decoration:none;background:var(--paper);transition:all .15s}
.jump a:hover{color:var(--pf);border-color:var(--pf)}

.sec{margin-top:3rem;scroll-margin-top:70px}
.sec-head{display:flex;align-items:center;gap:.85rem;margin-bottom:.4rem}
.sec-ic{width:42px;height:42px;border-radius:12px;background:var(--pf-glow);color:var(--pf);
  display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sec-ic svg{width:21px;height:21px}
.sec-t h2{font-family:'Instrument Serif',serif;font-weight:400;font-size:1.55rem;line-height:1.15;color:var(--ink)}
.sec-t .n{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--gold)}
.sec-d{font-size:.84rem;color:var(--muted);line-height:1.6;margin:.5rem 0 1.2rem;max-width:64ch}

.cards{display:grid;gap:1.1rem;grid-template-columns:1fr}
@media(min-width:620px){.cards{grid-template-columns:repeat(2,1fr)}}
@media(min-width:980px){.cards{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1280px){.cards.wide{grid-template-columns:repeat(4,1fr)}}

.door{display:flex;flex-direction:column;background:var(--paper);border:1px solid var(--line);border-radius:16px;
  padding:1.5rem 1.35rem;transition:border-color .18s,transform .18s,box-shadow .18s;min-width:0}
.door:hover{border-color:var(--pf);transform:translateY(-3px);box-shadow:0 12px 30px rgba(14,33,72,.09)}
.door-nm{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;letter-spacing:.12em;
  text-transform:uppercase;color:var(--pf);margin-bottom:.4rem;overflow-wrap:anywhere}
.door h3{font-size:1.05rem;font-weight:700;color:var(--ink);margin-bottom:.5rem;line-height:1.3;overflow-wrap:anywhere}
.door p{font-size:.8rem;color:var(--muted);line-height:1.6;margin-bottom:.9rem;overflow-wrap:anywhere}
.door .grow{flex:1}
.door-meta{display:flex;gap:.5rem;flex-wrap:wrap;font-family:'JetBrains Mono',monospace;font-size:10px;
  color:var(--muted);margin-bottom:.9rem}
.door-meta span+span::before{content:'·';margin-right:.5rem;opacity:.5}

.oda{display:flex;gap:1.3rem;flex-wrap:wrap;margin-bottom:.9rem}
.oda .l{font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted);display:block}
.oda .v{font-family:'Instrument Serif',serif;font-size:1.25rem;color:var(--ink);line-height:1.2}
.fiyat{font-family:'Instrument Serif',serif;font-size:1.35rem;color:var(--ink);line-height:1.2}
.fiyat small{font-family:'Manrope',sans-serif;font-size:.7rem;color:var(--muted);font-weight:600}

.promo{border:1.5px dashed var(--gold);background:var(--gold-glow);border-radius:10px;padding:.6rem .8rem;
  text-align:center;margin-bottom:.9rem}
.promo .l{font-family:'JetBrains Mono',monospace;font-size:8.5px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted);display:block;margin-bottom:2px}
.promo .v{font-family:'JetBrains Mono',monospace;font-size:1rem;font-weight:700;letter-spacing:.08em;color:var(--gold)}

.chip{font-family:'JetBrains Mono',monospace;font-size:9.5px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;border-radius:100px;padding:3px 9px;white-space:nowrap;border:1px solid var(--line2);color:var(--muted)}
.chip.gold{color:#fff;background:var(--gold);border-color:var(--gold)}
.chip.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 42%,transparent);
  background:color-mix(in srgb,var(--ok) 8%,transparent)}
.chips{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.6rem}

.cta{display:flex;align-items:center;justify-content:center;gap:7px;padding:9px;background:var(--pf);color:#fff;
  border-radius:9px;font-size:.82rem;font-weight:700;text-decoration:none;border:1px solid var(--pf);
  font-family:inherit;cursor:pointer;width:100%;transition:opacity .15s}
.cta:hover{opacity:.9}
.cta.ghost{background:var(--paper2);color:var(--ink2);border-color:var(--line2)}
.cta.ghost:hover{border-color:var(--pf);color:var(--pf);opacity:1}
.cta[disabled]{opacity:.55;cursor:default}
.sub-a{display:block;text-align:center;margin-top:.55rem;font-size:.75rem;font-weight:700;color:var(--muted);text-decoration:none}
.sub-a:hover{color:var(--pf)}

.empty{padding:2.2rem;text-align:center;color:var(--muted);border:1px dashed var(--line2);border-radius:14px;
  font-size:.84rem;background:var(--paper)}
.msg{display:none;margin:1rem 0;padding:.85rem 1.1rem;border-radius:12px;font-size:.85rem;line-height:1.55}
.msg.on{display:block}
.msg.err{color:var(--danger);border:1px solid color-mix(in srgb,var(--danger) 34%,transparent);
  background:color-mix(in srgb,var(--danger) 6%,transparent)}
.msg.info{color:var(--ink2);border:1px solid var(--pf);background:var(--pf-glow)}

@media(max-width:760px){ .wrap{padding:2.2rem 1.2rem 4rem} .bar{padding:0 1rem} .sec{margin-top:2.4rem} }
</style>
</head>

  function LANG(){ try{ return (localStorage.getItem('cv-lang')||'en').toLowerCase()==='tr'?'tr':'en'; }catch(_){ return 'en'; } }
  function T(k){ var d=I18N[LANG()]||I18N.en; return d[k]!=null?d[k]:(I18N.en[k]!=null?I18N.en[k]:k); }
  function Tf(k){ var a=[].slice.call(arguments,1), s=String(T(k)); a.forEach(function(v){ s=s.replace('%s',v); }); return s; }

  function dmy(iso){ var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso||'')); return m?m[3]+'.'+m[2]+'.'+m[1]:''; }
  function money(a,c){
    if(a==null||a==='') return '';
    var n=Number(a); if(isNaN(n)) return '';
    try{ return new Intl.NumberFormat(LANG()==='tr'?'tr-TR':'en-GB',

  }
  function setChrome(){

    if(tr) tr.classList.toggle('on', LANG()==='tr');
  }
  function setLang(l){ try{ localStorage.setItem('cv-lang',l); }catch(_){}
    if(CODE) renderEvent(); else renderList(); }
  function setDark(on){ try{ localStorage.setItem('cn-dark', on?'1':'0'); }catch(_){}
    if(on) document.documentElement.setAttribute('data-dark','');
    else document.documentElement.removeAttribute('data-dark');
    var t=$('thBtn'); if(t) t.textContent = on ? '☀️' : '🌙';
  }
  function bindChrome(){
    var en=$('lgEN'), tr=$('lgTR'), th=$('thBtn');
    if(en) en.onclick=function(){ setLang('en'); };
    if(tr) tr.onclick=function(){ setLang('tr'); };
    if(th) th.onclick=function(){ setDark(!document.documentElement.hasAttribute('data-dark')); };
    var d=false; try{ d = localStorage.getItem('cn-dark')==='1'; }catch(_){}

    { key:'transfer_car',  svc:'transfer_car',  cat:'transfer_car',
      ic:'car',   h:'s_car',    d:'s_car_d',    none:'none_car',    anchor:'ulasim' },
    { key:'culture',       svc:'culture_spouse', cat:'culture_spouse', kindNot:'spouse',
      ic:'map',   h:'s_tour',   d:'s_tour_d',   none:'none_tour',   anchor:'tur' },
    { key:'spouse',        svc:'culture_spouse', cat:'culture_spouse', kindIs:'spouse',
      ic:'users', h:'s_spouse', d:'s_spouse_d', none:'none_spouse', anchor:'es' }
  ];
  function invKind(r){ var d=(r&&r.details)||{}; return String(d.kind||'').toLowerCase(); }
  function belongs(svc, r){
    if(r.category !== svc.cat) return false;
    if(svc.kindIs)  return invKind(r)===svc.kindIs;
    if(svc.kindNot) return invKind(r)!==svc.kindNot;
    return true;
  }
  function eventHasService(svc){
    var list = (EVENT && EVENT.gm_services) || [];
    return list.indexOf(svc.svc) >= 0;
  }

  /* ---- 1) ETKINLIK LISTESI -------------------------------------------- */
  async function renderList(){
    setChrome();
    var r = await sb.from('conventus_managed_events')
      .select('id,code,title,start_date,end_date,city,country,location,host_org,description')
      .eq('published',true).order('start_date',{ascending:true,nullsFirst:false});
    if(r.error){ $('#wrap'); $('wrap').innerHTML='<div class="empty">'+esc(Tf('err_load',r.error.message))+'</div>'; return; }
    var evs = r.data||[];
    var head = '<div class="head"><div class="eyebrow">'+ICONS.cal+'<span>'+esc(T('ev_eyebrow'))+'</span></div>'+
      '<h1>'+Tf('ev_h_rich','<em>Go &amp; Meet</em>')+'</h1>'+
      '<p class="lead">'+esc(T('ev_d'))+'</p></div>';
    if(!evs.length){ $('wrap').innerHTML = head+'<div class="empty">'+esc(T('ev_none'))+'</div>'; return; }
    $('wrap').innerHTML = head + '<div class="cards wide">' + evs.map(function(e){
      var when = (e.start_date||e.end_date)
        ? (e.end_date && e.end_date!==e.start_date ? Tf('dates',dmy(e.start_date),dmy(e.end_date)) : dmy(e.start_date))
        : T('nodate');
      var where = [e.city,e.country].filter(Boolean).join(', ') || e.location || T('noloc');
      var href = 'go-and-meet.html?e='+encodeURIComponent(e.code||'');
      return '<article class="door">'+
        '<div class="door-nm">'+esc(e.code||'')+'</div>'+
        '<h3>'+esc(e.title||e.code)+'</h3>'+
        '<div class="door-meta"><span>'+esc(when)+'</span><span>'+esc(where)+'</span>'+
          (e.host_org?'<span>'+esc(e.host_org)+'</span>':'')+'</div>'+
        (e.description?'<p>'+esc(String(e.description).slice(0,140))+'</p>':'<p class="grow"></p>')+
        '<div class="grow"></div>'+
        '<a class="cta" href="'+href+'">'+esc(T('ev_open'))+'</a></article>';
    }).join('') + '</div>';
  }

  /* ---- 2) ETKINLIK SAYFASI -------------------------------------------- */
  async function renderEvent(){
    setChrome();
    var r = await sb.from('conventus_managed_events').select('*').eq('code',CODE).maybeSingle();
    if(r.error){ $('wrap').innerHTML='<div class="empty">'+esc(Tf('err_load',r.error.message))+'</div>'; return; }
    if(!r.data){
      $('wrap').innerHTML='<div class="head"><h1>'+esc(T('notfound'))+'</h1></div>'+
        '<p class="sec-d">'+esc(T('notfound_d'))+'</p>'+
        '<p><a class="btn btn-sm" href="go-and-meet.html">'+esc(T('all_ev'))+'</a></p>';
      return;
    }
    EVENT = r.data;
    var t=$('crumb'); if(t) t.textContent = EVENT.title || EVENT.code;

    /* Envanter ve saglayicilar tek seferde; plan yalniz giris yapmissa. */
    var q = [
      sb.from('gm_inventory')
        .select('id,provider_id,category,title,description,details,price_amount,currency,date_from,date_to,capacity')
        .eq('event_id',EVENT.id).eq('is_active',true).order('category').order('title'),
      sb.from('gm_providers_public').select('id,name,city,country,website')
    ];
    if(USER) q.push(sb.from('gm_plan').select('id,inventory_id,category,status').eq('event_id',EVENT.id).eq('user_id',USER.id));
    var res = await Promise.all(q);
    if(res[0].error){ $('wrap').innerHTML='<div class="empty">'+esc(Tf('err_load',res[0].error.message))+'</div>'; return; }
    var inv = res[0].data||[], provs = res[1].data||[];
    PLAN = (res[2] && res[2].data) ? res[2].data : [];
    var pmap = {}; provs.forEach(function(p2){ pmap[p2.id]=p2; });

    var when = (EVENT.start_date||EVENT.end_date)
      ? (EVENT.end_date && EVENT.end_date!==EVENT.start_date
          ? Tf('dates',dmy(EVENT.start_date),dmy(EVENT.end_date)) : dmy(EVENT.start_date))
      : T('nodate');
    var where = [EVENT.city,EVENT.country].filter(Boolean).join(', ') || EVENT.location || T('noloc');

    /* Bolum yalniz (hizmet ACIK) VE (en az bir kalem var) ise cizilir.
       Kalemi olmayan bolume "henuz tanimlanmadi" yazmak katilimci icin
       gurultu; organizator ayni boslugu kendi sekmesinde zaten goruyor.
       Bu ayni zamanda kultur/es tek bayrak sorununu da cozuyor: es kalemi
       girilmemisse es bolumu cikmiyor. */
    var active = SERVICES.filter(function(svc){
      if(!eventHasService(svc)) return false;
      return inv.some(function(x){ return belongs(svc,x); });
    });
    var html = '<div class="head">'+
      '<div class="eyebrow">'+ICONS.pin+'<span>'+esc(EVENT.code||'')+'</span></div>'+
      '<h1>'+esc(EVENT.title||EVENT.code)+'</h1>'+
      '<p class="lead">'+esc(T('logi_lead'))+'</p>'+
      '<div class="facts">'+
        '<span>'+ICONS.cal+esc(when)+'</span>'+
        '<span>'+ICONS.pin+esc(where)+'</span>'+
        (EVENT.host_org?'<span>'+ICONS.org+esc(EVENT.host_org)+'</span>':'')+
        (PLAN.length?'<span class="chip ok">'+esc(Tf('req_n',PLAN.length))+'</span>':'')+
      '</div></div>';

    if(!active.length){
      $('wrap').innerHTML = html + '<div class="empty">'+esc(T('closed'))+'</div>';
      return;
    }
    html += '<nav class="jump"><a href="go-and-meet.html">'+esc(T('all_ev'))+'</a>'+active.map(function(s2){
      return '<a href="#'+s2.anchor+'">'+esc(T(s2.h))+'</a>'; }).join('')+'</nav>';

    active.forEach(function(svc){
      var rows = inv.filter(function(x){ return belongs(svc,x); });
      html += '<section class="sec" id="'+svc.anchor+'">'+
        '<div class="sec-head"><div class="sec-ic">'+ICONS[svc.ic]+'</div>'+
        '<div class="sec-t">'+(rows.length?'<div class="n">'+rows.length+' '+esc(T('items'))+'</div>':'')+
        '<h2>'+esc(T(svc.h))+'</h2></div></div>'+
        '<p class="sec-d">'+esc(T(svc.d))+'</p>';
      html += '<div class="cards">'+rows.map(function(x){ return invCard(x,pmap); }).join('')+'</div>';
      html += '</section>';
    });
    $('wrap').innerHTML = html;
    bindBooking();
  }

  /* Iptal edilmis talep YOK sayilir — katilimci yeniden talep edebilmeli.
     Onaylanmisi geri alamaz: gm_plan silme politikasi zaten status='requested'
     sarti koyuyor, bu yuzden dugmeyi de gostermiyoruz. */
  function planFor(invId){
    for(var i=0;i<PLAN.length;i++){
      if(PLAN[i].inventory_id===invId && PLAN[i].status!=='cancelled') return PLAN[i];
    }
    return null;
  }

  /* Kart icerigi details'e gore ZENGINLESIR (organizator event-manage'in
     Lojistik sekmesinden girer):
       single/double -> konaklamada tek/cift fiyat
       discount      -> altin indirim rozeti
       promo         -> kesik cizgili promosyon kodu kutusu
     Hicbiri yoksa kart sade fiyatla gosterilir — bos alan cizilmez. */
  function invCard(x, pmap){
    var p2  = pmap[x.provider_id];
    var who = (p2 && p2.name) || x.provider_name || '';
    var d   = x.details || {};
    var mine = planFor(x.id);

    var bits = [];
    if(x.date_from) bits.push(dmy(x.date_from)+(x.date_to&&x.date_to!==x.date_from?' → '+dmy(x.date_to):''));
    if(x.capacity)  bits.push(Tf('cap',x.capacity));

    var chips = '';
    if(d.discount) chips += '<span class="chip gold">'+esc(d.discount)+' '+esc(T('off'))+'</span>';
    if(mine) chips += '<span class="chip '+(mine.status==='confirmed'?'ok':'')+'">'+
                      esc(T(mine.status==='confirmed'?'st_confirmed':'st_requested'))+'</span>';

    /* Tek/cift fiyat yalnizca girilmisse; yoksa tek fiyat satiri. */
    var priceBlock = '';
    if(d.single || d.double){
      priceBlock = '<div class="oda">'+
        (d.single?'<div><span class="l">'+esc(T('single'))+'</span><span class="v">'+esc(d.single)+'</span></div>':'')+
        (d.double?'<div><span class="l">'+esc(T('double'))+'</span><span class="v">'+esc(d.double)+'</span></div>':'')+
        '</div>';
    }else{
      var pr = money(x.price_amount, x.currency);
      if(pr) priceBlock = '<div class="fiyat">'+esc(pr)+'</div>';
    }

    var promoBlock = d.promo
      ? '<div class="promo"><span class="l">'+esc(T('promo'))+'</span><span class="v">'+esc(d.promo)+'</span></div>'
      : '';

    var action = mine
      ? (mine.status==='confirmed'
          ? '<button class="cta ghost" disabled>'+esc(T('st_confirmed'))+'</button>'
          : '<button class="cta ghost" data-cancel="'+esc(mine.id)+'">'+esc(T('cancel'))+'</button>')
      : (USER
          ? '<button class="cta" data-book="'+esc(x.id)+'" data-cat="'+esc(x.category)+'">'+esc(T('book'))+'</button>'
          : '<a class="cta ghost" href="/login.html?next='+encodeURIComponent(location.pathname+location.search)+'">'+esc(T('login'))+'</a>');

    return '<article class="door">'+
      (who?'<div class="door-nm">'+esc(who)+'</div>':'')+
      '<h3>'+esc(x.title)+'</h3>'+
      (chips?'<div class="chips">'+chips+'</div>':'')+
      (x.description?'<p>'+esc(x.description)+'</p>':'')+
      (bits.length?'<div class="door-meta">'+bits.map(function(b){return '<span>'+esc(b)+'</span>';}).join('')+'</div>':'')+
      '<div class="grow"></div>'+
      priceBlock + promoBlock + action +
      (mine?'<span class="sub-a">'+esc(T(mine.status==='confirmed'?'confirmed_note':'booked_note'))+'</span>':'')+
      '</article>';
  }

  function bindBooking(){
    Array.prototype.forEach.call(document.querySelectorAll('[data-book]'), function(b){
      b.addEventListener('click', function(){ book(b.getAttribute('data-book'), b.getAttribute('data-cat'), b); });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-cancel]'), function(b){
      b.addEventListener('click', function(){ unbook(b.getAttribute('data-cancel'), b); });
    });
  }

  /* Rezervasyon = gm_plan satiri (status 'requested'). RLS zaten
     user_id = auth.uid() ve status='requested' sarti koyuyor; burada
     kullaniciya da ayni dili konusuyoruz: bu bir TALEP, onay degil. */
  async function book(invId, cat, btn){
    if(BUSY||!USER) return; BUSY=true;
    var old=btn.textContent; btn.disabled=true; btn.textContent=T('booking');
    var ins = await sb.from('gm_plan').insert({
      event_id:EVENT.id, user_id:USER.id, category:cat, inventory_id:invId, status:'requested'
    }).select('id,inventory_id,category,status').single();
    BUSY=false;
    if(ins.error){ btn.disabled=false; btn.textContent=old; say('err',esc(Tf('err_book',ins.error.message))); return; }
    PLAN.push(ins.data);
    await renderEvent(); say('info',esc(T('booked_ok')));
  }
  async function unbook(planId, btn){
    if(BUSY) return; BUSY=true;
    btn.disabled=true;
    var del = await sb.from('gm_plan').delete().eq('id',planId);
    BUSY=false;
    if(del.error){ btn.disabled=false; say('err',esc(Tf('err_book',del.error.message))); return; }
    PLAN = PLAN.filter(function(p2){ return p2.id!==planId; });
    await renderEvent(); say('info',esc(T('cancel_ok')));
  }

  /* ---- baslangic ------------------------------------------------------- */
  async function init(){
    if(!sb){ $('wrap').innerHTML='<div class="empty">Supabase client yüklenemedi.</div>'; return; }
    /* Giris ZORUNLU DEGIL: anon akredite envanteri gorur (gmi_anon_showcase),
       yalniz rezervasyon giris ister. Vitrin herkese acik olmali. */
    try{
      var ses = await sb.auth.getSession();
      USER = (ses && ses.data && ses.data.session) ? ses.data.session.user : null;
    }catch(_){ USER=null; }
    bindChrome();
    if(CODE) await renderEvent(); else await renderList();
  }
  window.addEventListener('cv-lang-change', function(){ if(CODE) renderEvent(); else renderList(); });
  init();
})();
</script>
</body>
</html>
